<!-- TEST_NIGHT.html - SOLO TEST - NON IN ONDA - usa RS3_DI_NOTTE.jpg -->
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEST NIGHT - RS3_DI_NOTTE</title>
<style>
body{font-family:Segoe UI,Arial,sans-serif;color:white;text-align:center;background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.75)),url("studio-radio.jpeg");background-size:cover;background-position:center;min-height:100vh;margin:0;padding:0}
.test-bar{position:fixed;top:0;left:0;right:0;background:#111;z-index:9999;padding:10px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;border-bottom:2px solid #c9a86a}
.test-bar button{padding:12px 18px;font-weight:900;border:none;border-radius:10px;cursor:pointer;font-size:1rem}
.container{max-width:600px;margin:80px auto 20px auto;padding:28px;background:rgba(255,255,255,.08);backdrop-filter:blur(8px);border-radius:25px;border:1px solid rgba(255,255,255,.15)}
.logo-wrap{display:inline-block;padding:5px;border-radius:26px;background:linear-gradient(135deg,#ff512f,#dd2476,#ffd966,#00d4ff,#ff512f);background-size:300% 300%;animation:gradientMove 4s ease infinite}
@keyframes gradientMove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.logo{width:280px;height:280px;object-fit:cover;border-radius:20px;display:block;background:#fff}
h1{margin-top:20px;font-size:2.8rem;line-height:1.1}
.live{margin-top:15px;color:#ff4444;font-size:1.5rem;font-weight:bold}
body.soul-mode .container{border:1px solid #b388ff}
body.soul-mode h1{color:#d1a3ff} body.soul-mode .live{color:#d1a3ff}
body.soul-mode .logo-wrap{background:linear-gradient(135deg,#7b1fa2,#b388ff,#d1a3ff,#7b1fa2) !important}
body.retro-mode .container{border:2.5px solid #d4af37 !important;box-shadow:0 0 40px rgba(212,175,55,.55) !important}
body.retro-mode #mainTitle{color:#ffd700 !important;font-weight:900 !important;text-shadow:0 0 8px rgba(255,215,0,.9) !important;font-family:Impact,'Arial Black',sans-serif !important}
body.retro-mode .live{color:#d4af37 !important}
body.retro-mode .logo-wrap{background:linear-gradient(135deg,#8B6914,#d4af37,#ffd700,#d4af37,#8B6914) !important}
/* MODO NOTTE - STILE TUA FOTO */
body.night-mode{background: linear-gradient(rgba(15,10,5,.7),rgba(15,10,5,.9)),url("studio-radio.jpeg") !important;background-size:cover !important}
body.night-mode .container{border:2px solid #c9a86a !important;box-shadow:0 0 40px rgba(201,168,106,.4) !important}
body.night-mode .logo-wrap{background:linear-gradient(135deg,#2a1e0f,#c9a86a,#e8d5a3,#2a1e0f) !important;box-shadow:0 0 25px rgba(201,168,106,.5) !important}
body.night-mode #mainTitle{color:#e8d5a3 !important;font-family: Georgia, serif !important;font-weight:400 !important;letter-spacing:2px !important;text-shadow:0 0 12px rgba(201,168,106,.8) !important}
body.night-mode #mainTitle span{color:#c9a86a !important;font-family:'Times New Roman',serif !important;font-style:italic !important;display:block;font-size:0.65em;margin-top:8px;letter-spacing:4px}
body.night-mode .live{color:#c9a86a !important}
</style>
</head>
<body>
<div class="test-bar">
  <button style="background:#fff;color:#000" onclick="applyMode('classic')">CLASSIC</button>
  <button style="background:#b388ff;color:#fff" onclick="applyMode('soul')">SOUL</button>
  <button style="background:gold;color:#000" onclick="applyMode('gold')">GOLD</button>
  <button style="background:#2a1e0f;color:#c9a86a;border:1.5px solid #c9a86a" onclick="applyMode('night')">DI NOTTE 🌙</button>
</div>

<div class="container">
  <div class="logo-wrap"><img src="RADIO SISTEMA 3.jpeg" class="logo" id="mainLogo"></div>
  <h1 id="mainTitle">RADIO SISTEMA 3</h1>
  <div class="live" id="liveText">ON AIR 24/7</div>
  <p style="margin-top:20px;color:#aaa;font-size:0.9rem">TEST FUORI ONDA - Qui provi i 4 modi. Il master vero non si tocca.</p>
</div>

<script>
const MAIN_COVER="./RADIO SISTEMA 3.jpeg";
const SOUL_COVER="./RS3_SOUL_viola_scuro.jpg";
const NIGHT_COVER="./RS3_DI_NOTTE.jpg"; // TUA FOTO

function applyMode(mode){
  const logo=document.getElementById('mainLogo');
  const live=document.getElementById('liveText');
  const title=document.getElementById('mainTitle');
  document.body.classList.remove('soul-mode','retro-mode','night-mode');
  if(mode==='soul'){
    document.body.classList.add('soul-mode');
    logo.src=SOUL_COVER;
    live.innerHTML="💜 SOUL FUNK ON AIR";
    title.textContent="SOUL FUNK";
  } else if(mode==='gold'){
    document.body.classList.add('retro-mode');
    logo.src=MAIN_COVER;
    live.innerHTML="📀 VINYL ON AIR";
    title.innerHTML='RADIO SISTEMA 3<br><span style="display:block;font-size:0.68em;margin-top:4px;letter-spacing:2px">GOLD 60-70</span>';
  } else if(mode==='night'){
    document.body.classList.add('night-mode');
    logo.src=NIGHT_COVER;
    live.innerHTML="🌙 DI NOTTE ON AIR";
    title.innerHTML='RADIO SISTEMA 3<br><span>Di Notte</span>';
  } else {
    logo.src=MAIN_COVER;
    live.innerHTML="ON AIR 24/7";
    title.textContent="RADIO SISTEMA 3";
  }
}
// parti direttamente in NOTTE per provarlo
applyMode('night');
</script>
</body>
</html>
