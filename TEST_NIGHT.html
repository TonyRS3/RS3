const RS3_NIGHT_LOGO_NOME="RS3_LOVE_NIGHT.jpg"; // <--- TUO FILE NOTTE
function getLogoAssoluto(){try{const isSoul=(typeof soulActive!=='undefined'&&soulActive)||(document.body&&document.body.classList.contains('soul-mode'));const isGold=(typeof goldActive!=='undefined'&&goldActive)||(document.body&&document.body.classList.contains('retro-mode'));const isNight=(typeof nightActive!=='undefined'&&nightActive)||(document.body&&document.body.classList.contains('night-mode'));let nome=RADIO_LOGO_FISSO_NOME;if(isSoul)nome=RS3_SOUL_LOGO_NOME;if(isNight)nome=RS3_NIGHT_LOGO_NOME;const base=window.location.href.substring(0,window.location.href.lastIndexOf('/')+1);return base+encodeURI(nome);}catch(e){return RADIO_LOGO_FISSO_NOME;}}
const BRANI_NOVITA = [{ id: "0xuFBG6o6EU", artista: "Gaia", titolo: "Senz'allegria" }];
function normalizzaBrano(b){if(typeof b==='string')return{id:b,artista:'',titolo:b};return b;}

</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}body{font-family:Segoe UI,Arial,sans-serif;color:white;text-align:center;background:linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.55)),url("studio-radio.jpeg");background-size:cover;background-position:center;background-attachment:fixed;overflow-x:hidden}
.page-layout{display:grid;grid-template-columns:150px 150px minmax(0,900px) 310px;gap:8px;max-width:1520px;margin:0 auto;padding:0px;align-items:start;justify-content:center;}
.container{max-width:900px;margin:0 auto;padding:28px;background:rgba(255,255,255,.08);backdrop-filter:blur(8px);border-radius:25px;border:1px solid rgba(255,255,255,.15);grid-column:3;grid-row:1 / span 3}
.logo-wrap{display:inline-block;padding:5px;border-radius:26px;background:linear-gradient(135deg,#ff512f,#dd2476,#ffd966,#00d4ff,#ff512f);background-size:300% 300%;animation:gradientMove 4s ease infinite}
@keyframes gradientMove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.logo{width:260px;height:260px;object-fit:cover;border-radius:20px;display:block;background:#fff}
h1{margin-top:20px;font-size:3rem}

@keyframes pulse{0%{opacity:1}50%{opacity:.4}100%{opacity:1}}
.player-box{margin-top:8px;margin-bottom:2px !important;background:rgba(255,255,255,.10);padding:10px 12px 8px 12px;border-radius:20px;width:400px;max-width:92%;margin-left:auto;margin-right:auto}
audio{width:100%;max-width:340px;height:36px}
#rs3-mio-box{margin-top:2px !important;max-width:400px !important;margin-left:auto !important;margin-right:auto !important;background:rgba(0,0,0,0.85) !important;padding:0 !important;border-radius:14px !important;min-height:95px !important;overflow:hidden !important;display:block !important}
.rs3-trackbox{display:flex !important;flex-direction:row !important;align-items:center !important;gap:14px !important;padding:12px 12px !important}
.rs3-cover{width:72px !important;height:72px !important;min-width:72px !important;object-fit:cover !important;border-radius:8px !important;background:#000 !important;display:block !important}
.rs3-info{flex:1 !important;display:flex !important;flex-direction:column !important;text-align:left !important;color:white !important;font-size:0.92rem !important}
body.soul-mode h1{ color:#d1a3ff !important }body.soul-mode .live{ color:#d1a3ff !important }body.soul-mode .logo-wrap{ background:linear-gradient(135deg,#7b1fa2,#b388ff,#d1a3ff,#7b1fa2) !important }
body.retro-mode .container{border:2.5px solid #d4af37 !important;box-shadow:0 0 40px rgba(212,175,55,.55) !important}
body.retro-mode #mainTitle{color:#ffd700 !important;font-weight:900 !important;letter-spacing:3px !important;text-shadow:0 0 8px rgba(255,215,0,.9),0 0 18px rgba(212,175,55,.6) !important}

/* --- NUOVO MODO NOTTE - LOVE NIGHT --- */
body.night-mode{background: linear-gradient(rgba(5,10,40,.65),rgba(5,10,40,.85)),url("studio-radio.jpeg") !important;background-size:cover !important}

body.night-mode #rs3-mio-box{border:1.5px solid #00d4ff !important;box-shadow:0 0 15px rgba(0,212,255,.3) !important}

.test-bar{position:fixed;top:0;left:0;right:0;background:#111;z-index:9999;padding:8px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;border-bottom:2px solid #00d4ff}

<body>
<div class="test-bar">
  <button style="background:#fff;color:#000" onclick="applyMode('classic')">TEST CLASSIC</button>
  <button style="background:#b388ff;color:#fff" onclick="applyMode('soul')">TEST SOUL</button>
  <button style="background:gold;color:#000" onclick="applyMode('gold')">TEST GOLD</button>
  <button style="background:#001a4d;color:#00d4ff;border:1px solid #00d4ff" onclick="applyMode('night')">TEST NIGHT 💙</button>
</div>
<div class="page-layout" style="margin-top:60px">
  <div class="container">
    <div class="logo-wrap"><img src="RADIO SISTEMA 3.jpeg" alt="Radio Sistema 3" class="logo" id="mainLogo"></div>
    <h1 id="mainTitle">RADIO SISTEMA 3</h1>
    <div class="live" id="liveText">ON AIR 24/7</div>
    <div class="player-box">
      <audio id="radioAudio" controls src="https://listentomystream.com:8046/stream"></audio>
    </div>
    <div id="rs3-mio-box"><div class="rs3-trackbox"><img class="rs3-cover" src="RADIO SISTEMA 3.jpeg"><div class="rs3-info"><div style="font-weight:900">Radio Sistema 3</div><div style="color:#ffd966">Live</div></div></div></div>
  </div>
</div>
<script>
const NPOINT_URL="https://api.npoint.io/9ed90a2b1c3d903bfac6";
const SOUL_COVER_FILE="./RS3_SOUL_viola_scuro.jpg";
const MAIN_COVER_FILE="./RADIO SISTEMA 3.jpeg";
const NIGHT_COVER_FILE="./RS3_LOVE_NIGHT.jpg";
let soulActive=false;let goldActive=false;let nightActive=false;

function applyMode(mode){
  const logoImg=document.getElementById('mainLogo');
  const liveText=document.getElementById('liveText');
  const mainTitle=document.getElementById('mainTitle');
  soulActive=false; goldActive=false; nightActive=false;
  document.body.classList.remove('soul-mode','retro-mode','classic-mode','night-mode');
  if(mode==='soul'){
    soulActive=true; document.body.classList.add('soul-mode');
    if(logoImg)logoImg.src=SOUL_COVER_FILE;
    if(liveText)liveText.innerHTML="💜 SOUL FUNK ON AIR";
    if(mainTitle)mainTitle.textContent="SOUL FUNK";
  } else if(mode==='gold'){
    goldActive=true; document.body.classList.add('retro-mode');
    if(logoImg)logoImg.src=MAIN_COVER_FILE;
    if(liveText)liveText.innerHTML="📀 VINYL ON AIR";
    if(mainTitle)mainTitle.innerHTML='RADIO SISTEMA 3<br><span style="display:block;font-size:0.68em;margin-top:4px;letter-spacing:2px">GOLD 60-70</span>';
  } else if(mode==='night'){
    nightActive=true; document.body.classList.add('night-mode');
    if(logoImg)logoImg.src=NIGHT_COVER_FILE;
    if(liveText)liveText.innerHTML="💙 LOVE NIGHT ON AIR";
    if(mainTitle)mainTitle.innerHTML='RADIO SISTEMA 3<br><span style="display:block;font-size:0.62em;margin-top:6px;letter-spacing:3px">💙 LOVE NIGHT 💙</span>';
  } else {
    document.body.classList.add('classic-mode');
    if(logoImg)logoImg.src=MAIN_COVER_FILE;
    if(liveText)liveText.innerHTML="ON AIR 24/7";
    if(mainTitle)mainTitle.textContent="RADIO SISTEMA 3";
  }
}
function normalizeMode(m){
  if(!m) return 'classic';
  m=String(m).toLowerCase();
  if(m.includes('soul')) return 'soul';
  if(m.includes('gold')||m.includes('retro')) return 'gold';
  if(m.includes('night')||m.includes('love')) return 'night';
  return 'classic';
}
// Se apri con ?mode=night lo vedi subito
const qp=new URLSearchParams(location.search);
if(qp.get('mode')){ applyMode(normalizeMode(qp.get('mode'))); } else { applyMode('night'); }
</script>
</body>
