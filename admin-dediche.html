<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Admin Dediche</title>
<style>body{background:#111;color:#fff;font-family:Arial;padding:20px;max-width:600px;margin:auto}input,textarea{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:none}button{padding:12px;border-radius:20px;border:none;font-weight:bold;cursor:pointer} .item{background:#222;padding:10px;border-radius:10px;margin:8px 0}</style>
</head><body>
<h2>🔐 Admin Dediche</h2>
<div id="login"><input type="password" id="pass" placeholder="Password"><button onclick="login()">Entra</button></div>
<div id="box" style="display:none">
<input id="da" placeholder="Da: Luca"><input id="per" placeholder="Per: Maria"><textarea id="msg" placeholder="Messaggio"></textarea><input id="song" placeholder="Canzone (opzionale)">
<button onclick="add()" style="background:#ffd966;width:100%">💾 PUBBLICA SUL SITO</button>
<div id="lista" style="margin-top:20px"></div>
</div>
<script>
function login(){if(document.getElementById('pass').value=='sistema3'){document.getElementById('login').style.display='none';document.getElementById('box').style.display='block';render()}else alert('Password errata')}
function get(){return JSON.parse(localStorage.getItem('dediche_radio_sistema3')||'[]')}
function save(d){localStorage.setItem('dediche_radio_sistema3',JSON.stringify(d))}
function add(){const da=document.getElementById('da').value,per=document.getElementById('per').value,msg=document.getElementById('msg').value,song=document.getElementById('song').value; if(!da||!per||!msg){alert('Compila tutto');return} const d=get(); d.unshift({da,per,msg,song,data:new Date().toLocaleString()}); save(d); document.getElementById('da').value='';document.getElementById('per').value='';document.getElementById('msg').value=''; render(); alert('Pubblicata! Ricarica il sito principale');}
function delItem(i){const d=get(); d.splice(i,1); save(d); render()}
function render(){const d=get(); document.getElementById('lista').innerHTML=d.map((x,i)=>`<div class=item><b>${x.da} → ${x.per}</b><br>${x.msg}<br><small>${x.song||''}</small><br><button onclick="delItem(${i})" style="background:#ff4444;color:#fff;margin-top:5px">Elimina</button></div>`).join('')}
</script></body></html>
