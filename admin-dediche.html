<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Admin RSISTEMA.EU</title>
<style>body{background:#111;color:#fff;font-family:Arial;padding:20px;max-width:700px;margin:auto}input,textarea{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:none;background:#222;color:#fff}button{padding:12px 20px;border-radius:20px;border:none;font-weight:bold;cursor:pointer;margin:5px} .box{background:#222;padding:15px;border-radius:15px;margin:15px 0} pre{background:#000;padding:15px;border-radius:10px;overflow:auto;color:#0f0}</style>
</head><body>
<h2>🔐 Admin Dediche - RSISTEMA.EU</h2>
<div id="login"><input type="password" id="pass" placeholder="Password"><button onclick="login()" style="background:#ffd966">ENTRA</button></div>
<div id="main" style="display:none">
<div class="box">
<input id="da" placeholder="Da: Tony"><input id="per" placeholder="Per: Maria"><textarea id="msg" placeholder="Messaggio della dedica..."></textarea><input id="song" placeholder="Canzone (opzionale)">
<button onclick="aggiungi()" style="background:#ffd966;width:100%;font-size:1.1rem">➕ AGGIUNGI ALLA LISTA</button>
</div>
<div class="box"><h3>📋 Anteprima (max 5)</h3><div id="lista"></div></div>
<div class="box"><h3>📄 Codice da copiare in dediche.json</h3><p style="color:#aaa;font-size:.9rem">Copia tutto questo e incollalo nel file dediche.json su GitHub:</p><pre id="output"></pre>
<button onclick="copia()" style="background:#00ff88">📋 COPIA CODICE</button><button onclick="svuota()" style="background:#ff4444;color:#fff">🗑️ SVUOTA TUTTO</button></div>
</div>
<script>
let dediche = JSON.parse(localStorage.getItem('dediche_github')||'[]');
function login(){if(document.getElementById('pass').value=='sistema3'){document.getElementById('login').style.display='none';document.getElementById('main').style.display='block';render()}else alert('Password errata!')}
function aggiungi(){const da=document.getElementById('da').value.trim(),per=document.getElementById('per').value.trim(),msg=document.getElementById('msg').value.trim(),song=document.getElementById('song').value.trim(); if(!da||!per||!msg){alert('Compila Da, Per e Messaggio');return} dediche.unshift({da,per,msg,song,data:new Date().toLocaleString('it-IT')}); if(dediche.length>10) dediche=dediche.slice(0,10); localStorage.setItem('dediche_github',JSON.stringify(dediche)); document.getElementById('da').value='';document.getElementById('per').value='';document.getElementById('msg').value='';document.getElementById('song').value=''; render();}
function elimina(i){dediche.splice(i,1); localStorage.setItem('dediche_github',JSON.stringify(dediche)); render();}
function svuota(){if(confirm('Sicuro?')){dediche=[];localStorage.setItem('dediche_github',JSON.stringify(dediche));render();}}
function render(){document.getElementById('lista').innerHTML=dediche.length?dediche.map((x,i)=>`<div style="background:#333;padding:10px;border-radius:10px;margin:6px 0"><b>${x.da} → ${x.per}</b><br>${x.msg}<br><small>${x.song||''} - ${x.data}</small><br><button onclick="elimina(${i})" style="background:#ff4444;color:#fff;padding:5px 10px;font-size:.8rem">Elimina</button></div>`).join(''):'Nessuna dedica'; document.getElementById('output').textContent=JSON.stringify(dediche,null,2);}
function copia(){const t=document.getElementById('output').textContent; navigator.clipboard.writeText(t).then(()=>alert('Codice copiato! Ora vai su GitHub e incollalo in dediche.json')); }
render();
</script></body></html>
