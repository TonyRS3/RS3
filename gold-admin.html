<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOLD ADMIN - v201 NUOVO NPOINT</title>
<style>
body{font-family:Arial;background:#111;color:#fff;text-align:center;padding:20px}
button{padding:18px 30px;margin:10px;font-size:1.3rem;font-weight:900;border:none;border-radius:12px;cursor:pointer;width:90%;max-width:400px}
#classic{background:#fff;color:#000}
#soul{background:#b388ff;color:#fff}
#gold{background:gold;color:#000}
#night{background:#001a4d;color:#00d4ff;border:1.5px solid #00d4ff} 
#status{margin-top:20px;padding:15px;background:#222;border-radius:10px;font-family:monospace;white-space:pre-wrap}
#loginBox{position:fixed;top:0;left:0;width:100%;height:100%;background:#111;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
input{padding:15px;font-size:1.2rem;border-radius:10px;border:none;width:90%;max-width:300px;margin:10px;text-align:center}
#btnLogin{background:#00ff88;color:#000}
</style>
</head>
<body>

<div id="loginBox">
<h1>RS3 ADMIN - NUOVO</h1>
<p>NPOINT: 91901ede87030225db50</p>
<p>Inserisci password</p>
<input type="password" id="pwdInput" placeholder="Password">
<button id="btnLogin" onclick="checkPwd()">ENTRA</button>
<p id="loginMsg" style="color:#ff5555"></p>
</div>

<h1>RS3 ADMIN - 4 MODI - MANUALE 100%</h1>
<button id="classic" onclick="setMode('classic')">CLASSIC - RADIO SISTEMA 3</button>
<button id="soul" onclick="setMode('soul')">SOUL - SOUL FUNK</button>
<button id="gold" onclick="setMode('gold')">GOLD - RADIO GOLD 60-70</button>
<button id="night" onclick="setMode('night')">NIGHT - DI NOTTE</button>
<div id="status">Carico stato...</div>

<script>
const NPOINT="https://api.npoint.io/91901ede87030225db50";
const PASSWORD="at186dsa";

function checkPwd(){
  let inserita=document.getElementById('pwdInput').value;
  if(inserita===PASSWORD){
    document.getElementById('loginBox').style.display='none';
    getStatus();
  }else{
    document.getElementById('loginMsg').textContent="Password errata!";
  }
}

async function getStatus(){
  try{
    let r=await fetch(NPOINT+"?t="+Date.now(),{cache:'no-store'});
    let d=await r.json();
    document.getElementById('status').textContent="STATO ATTUALE NPOINT:\n"+JSON.stringify(d,null,2)+"\n\nURL: "+NPOINT;
  }catch(e){
    document.getElementById('status').textContent="Errore lettura: "+e;
  }
}

async function setMode(mode){
  document.getElementById('status').textContent="Invio "+mode.toUpperCase()+"...";
  try{
    let body={mode:mode, updated:new Date().toISOString()};
    if(mode==='soul') body={mode:'soul', soul:true, gold:false, night:false, classic:false, retro:false, updated:new Date().toISOString()};
    if(mode==='gold') body={mode:'gold', soul:false, gold:true, night:false, classic:false, retro:true, updated:new Date().toISOString()};
    if(mode==='classic') body={mode:'classic', soul:false, gold:false, night:false, classic:true, retro:false, updated:new Date().toISOString()};
    if(mode==='night') body={mode:'night', soul:false, gold:false, night:true, classic:false, retro:false, updated:new Date().toISOString()};
    let r=await fetch(NPOINT,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(body)
    });
    if(!r.ok) throw "HTTP "+r.status;
    document.getElementById('status').textContent="OK! Inviato "+mode.toUpperCase()+" - RIMANE FINO A PROSSIMO CLICK";
    setTimeout(getStatus,1500);
  }catch(e){
    document.getElementById('status').textContent="ERRORE: "+e;
  }
}

document.getElementById('pwdInput').addEventListener('keyup', e=>{ if(e.key==='Enter') checkPwd(); });
setInterval(()=>{ if(document.getElementById('loginBox').style.display==='none') getStatus(); },5000);
</script>
</body>
</html>
