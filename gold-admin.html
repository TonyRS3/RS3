<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin GOLD 60-70</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:Segoe UI,Arial;color:#fff}
.admin-box{background:#111;border:2px solid #d4af37;border-radius:20px;padding:28px 22px;width:360px;max-width:92%;box-shadow:0 0 40px rgba(212,175,55,.5);text-align:center}
.admin-title{font-size:1.4rem;font-weight:900;color:#d4af37;margin-bottom:4px}
.admin-sub{font-size:0.85rem;color:#aaa;margin-bottom:16px}
.input-wrap{position:relative;margin-bottom:12px}
.input-wrap input{width:100%;background:#000;border:1px solid #333;color:#fff;padding:12px 40px 12px 12px;border-radius:12px;outline:none}
.input-wrap span{position:absolute;right:10px;top:50%;transform:translateY(-50%);cursor:pointer}
.btn{width:100%;padding:12px;border:none;border-radius:12px;font-weight:900;cursor:pointer;margin-top:8px}
.btn-gold{background:linear-gradient(135deg,#8B6914,#d4af37,#ffd700);color:#000}
.btn-classic{background:#222;color:#fff;border:1px solid #555}
.btn-soul{background:linear-gradient(135deg,#7b1fa2,#b388ff);color:#fff}
.msg{margin-top:10px;font-size:0.8rem;color:#ff4444;min-height:18px}
</style>
</head>
<body>
<div class="admin-box" id="loginBox">
  <div class="admin-title">🔒 Accesso Admin</div>
  <div class="admin-sub">Inserisci password per gestire RADIO GOLD</div>
  <div class="input-wrap">
    <input id="pass" type="password" placeholder="Password">
    <span onclick="let i=document.getElementById('pass');i.type=i.type==='password'?'text':'password'">👁️</span>
  </div>
  <button class="btn btn-gold" onclick="login()">ENTRA</button>
  <div class="msg" id="msg"></div>
</div>

<div class="admin-box" id="choiceBox" style="display:none">
  <div class="admin-title">Scegli Modalità</div>
  <div class="admin-sub">Sito: www.rsistema3.eu</div>
  <button class="btn btn-classic" onclick="setMode('classic')">⬜ CLASSICA - Radio normale</button>
  <button class="btn btn-soul" onclick="setMode('soul')">🟪 SOUL FUNK - Viola</button>
  <button class="btn btn-gold" onclick="setMode('gold')">🟨 GOLD 60-70 - Oro Vintage</button>
  <div class="msg" id="msg2" style="color:#00ff88"></div>
</div>

<script>
const PASS = "at186dsa"; // <--- STESSA PASSWORD DI SOUL, CAMBIALA SE VUOI

function login(){
  const p = document.getElementById('pass').value;
  if(p === PASS){
    document.getElementById('loginBox').style.display='none';
    document.getElementById('choiceBox').style.display='block';
    // se già loggato prima, mostra stato attuale
    const cur = localStorage.getItem('rs3_mode') || 'classic';
    document.getElementById('msg2').textContent = 'Modalità attuale: ' + cur.toUpperCase();
  } else {
    document.getElementById('msg').textContent = 'Password errata';
  }
}
function setMode(mode){
  localStorage.setItem('rs3_mode', mode);
  document.getElementById('msg2').textContent = 'Attivato: ' + mode.toUpperCase() + ' - Torno al sito...';
  setTimeout(()=>{
    window.location.href = 'https://www.rsistema3.eu/index.html';
  }, 800);
}
</script>
</body>
</html>
