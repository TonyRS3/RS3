<!-- gold-admin.html v2 - 3 modi stessa scheda -->
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RS3 Admin - 3 Modi</title>
<style>
body{font-family:Segoe UI,Arial;background:#111;color:#fff;text-align:center;padding:20px}
.box{max-width:400px;margin:0 auto;background:#222;padding:20px;border-radius:15px;border:1px solid #444}
h1{color:#ffd966}
input{width:90%;padding:10px;border-radius:8px;border:none;margin:10px 0}
button{width:90%;padding:14px;margin:8px 0;border:none;border-radius:30px;font-weight:900;font-size:1rem;cursor:pointer}
.btn-classic{background:#fff;color:#000}
.btn-soul{background:#b388ff;color:#fff}
.btn-gold{background:linear-gradient(90deg,#8B6914,#ffd700);color:#000}
.status{margin-top:15px;padding:10px;background:#000;border-radius:8px;font-size:0.9rem;color:#0f0}
</style>
</head>
<body>
<div class="box">
<h1>RS3 - 3 MODI</h1>
<div id="loginBox">
<input type="password" id="pwd" placeholder="Password">
<button onclick="login()" style="background:#ffd966">ENTRA</button>
</div>

<div id="menuBox" style="display:none">
<p>Scegli modalità - cambia al volo sulla pagina già aperta:</p>
<button class="btn-classic" onclick="setMode('classic')">⬜ CLASSICA - Radio Sistema 3</button>
<button class="btn-soul" onclick="setMode('soul')">🟪 SOUL FUNK</button>
<button class="btn-gold" onclick="setMode('gold')">🟨 GOLD 60-70 VINTAGE</button>
<div class="status" id="status">In attesa...</div>
<p style="font-size:0.75rem;color:#aaa;margin-top:10px">Non apre schede. Aggiorna https://www.rsistema3.eu in 3 secondi su tutte le schede aperte. Puoi ricliccare se sbagli.</p>
</div>
</div>

<script>
const NPOINT_URL="https://api.npoint.io/9ed90a2b1c3d903bfac6";
const PASS="soul70";

function login(){
  if(document.getElementById('pwd').value===PASS){
    document.getElementById('loginBox').style.display='none';
    document.getElementById('menuBox').style.display='block';
    document.getElementById('status').textContent="Pronto - modo attuale: "+(localStorage.getItem('rs3_mode')||'classic');
  } else alert("Password errata");
}

async function setMode(mode){
  // 1 - salva locale così vedi subito su questo browser
  localStorage.setItem('rs3_mode', mode);
  // 2 - salva su npoint così cambia su TUTTI i dispositivi / schede aperte
  document.getElementById('status').textContent="Imposto "+mode.toUpperCase()+"...";
  try{
    await fetch(NPOINT_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({mode:mode, soul: mode==='soul', gold: mode==='gold'})
    });
    document.getElementById('status').textContent="✅ "+mode.toUpperCase()+" attivo! Il sito si aggiorna in 3 sec. Puoi cambiare ancora se vuoi.";
  }catch(e){
    document.getElementById('status').textContent="⚠️ Salvato locale ("+mode+") ma npoint non risponde - su altre schede non cambia. Riprova.";
  }
}
</script>
</body>
</html>
