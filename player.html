<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Player Radio Sistema 3</title>

<style>

body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
    text-align:center;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.player-box{
    width:90%;
    max-width:500px;
}

.logo{
    width:250px;
    max-width:80%;
    margin-bottom:20px;
}

h1{
    font-size:2rem;
    margin-bottom:10px;
}

.subtitle{
    color:#ccc;
    margin-bottom:25px;
}

audio{
    width:100%;
    margin:20px 0;
}

.back-btn{
    display:inline-block;
    margin-top:20px;
    padding:12px 25px;
    background:#f15a24;
    color:#fff;
    text-decoration:none;
    border-radius:30px;
    font-weight:bold;
}

.back-btn:hover{
    background:#ff733a;
}

.live{
    color:#ff4040;
    font-size:22px;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="player-box">

    <img src="RADIO SISTEMA 3.jpeg"
         alt="Radio Sistema 3"
         class="logo">

    <h1>RADIO SISTEMA 3</h1>

    <div class="live">
        🔴 IN DIRETTA
    </div>

    <p class="subtitle">
        La radio delle tue emozioni
    </p>

    <audio controls autoplay>
        <source src="http://manage.myshoutca.st:8046/stream" type="audio/mpeg">
        Il tuo browser non supporta l'audio HTML5.
    </audio>

    <a href="index.html" class="back-btn">
        ⬅ Torna alla Home
    </a>

</div>

</body>
</html>
