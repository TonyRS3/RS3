const c=document.getElementById('vuCanvas'),x=c.getContext('2d');let l=0,r=0;
function draw(){x.clearRect(0,0,c.width,c.height);x.fillStyle='#0a0a0a';x.fillRect(0,0,c.width,c.height);let bars=30,bw=c.width/bars,g=1.5,rh=c.height/2-2,al=Math.floor((l/100)*bars),ar=Math.floor((r/100)*bars);for(let i=0;i<bars;i++){let lit=i<al;x.fillStyle=lit?(i<18?'#0f0':i<24?'#ff0':'#f00'):'#1a1a1a';x.fillRect(i*bw+g,1,bw-g*2,lit?rh-1:rh*0.4)}x.fillStyle='#333';x.fillRect(0,c.height/2-.5,c.width,1);for(let i=0;i<bars;i++){let lit=i<ar;x.fillStyle=lit?(i<18?'#0af':i<24?'#ff0':'#f00'):'#1a1a1a';x.fillRect(i*bw+g,c.height/2+1,bw-g*2,lit?rh-1:rh*0.4)}requestAnimationFrame(draw)}function upd(){let b=22+Math.random()*30;l+=(b+Math.random()*15-l)*0.3;r+=(b+Math.random()*15-r)*0.3}draw();setInterval(upd,70);
