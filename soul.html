<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOUL FUNK - Radio Sistema 3 - v46 FIX DEFINITIVO</title>
<script>
if(new URLSearchParams(location.search).get('popup')==='1'){
  document.documentElement.classList.add('popup-mode');
  document.addEventListener('DOMContentLoaded',()=>{
    document.body.classList.add('popup-mode');
    const a=document.getElementById('radioAudio');
    if(a){ a.autoplay=true; setTimeout(()=>a.play().catch(()=>{}), 500); }
  });
}
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;color:white;text-align:center;background: linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.6)), url("studio-radio.jpeg");background-size:cover;background-position:center;background-attachment:fixed;background-color:#0d0620}
.overlay{background:rgba(8,0,18,0.35);min-height:100vh;padding:20px;display:flex;align-items:center;justify-content:center}
.container{width:100%;max-width:420px;padding:22px;background:rgba(0,0,0,0.82);border-radius:22px;border:1.5px solid #7b1fa2}
h1{color:#ffe600;font-size:1.9rem;margin-top:6px}
.live{color:#b388ff;font-weight:900;margin-top:2px;animation:pulse 1.4s infinite}
@keyframes pulse{0%{opacity:1}50%{opacity:.5}100%{opacity:1}}
.btns{display:flex;gap:8px;justify-content:center;margin:14px 0}
.btns a{padding:10px 18px;border-radius:22px;text-decoration:none;font-weight:900;font-size:.85rem;flex:1}
.main{background:#fff;color:#555;border:2px solid #ffe600}.soul{background:#7b1fa2;color:#fff;border:2px solid #7b1fa2;box-shadow:0 0 12px #7b1fa266}
.btns a.active{outline:3px solid #ffe600;transform:scale(1.05)}
.box-title{color:#ffe67a;font-size:1.15rem;margin:12px 0 8px;font-weight:700}
.box{background:rgba(20,20,20,.75);padding:14px;border-radius:14px;border:1px solid #333}
audio{width:100%;height:38px;border-radius:20px}
.vu-wrap{margin-top:8px;background:#1e1e28;padding:6px 8px;border-radius:10px;border:1px solid #333;max-width:320px;margin:0 auto}
#vuCanvas{width:100%;height:32px;background:#111118;border-radius:4px;display:block}
.vu-label{display:flex;justify-content:space-between;font-size:.6rem;color:#999;margin-top:4px;font-weight:900;font-family:monospace}
#trackBox{min-height:92px;background:rgba(0,0,0,.45);padding:8px;border-radius:12px;margin-top:6px;display:flex;align-items:center;gap:10px;text-align:left}
#trackBox img{width:76px;height:76px;min-width:76px;object-fit:cover;border-radius:6px;background:#1a0a2a;border:2px solid #7b1fa2}
#trackText{color:white;font-size:.92rem;line-height:1.2;white-space:normal;word-break:break-word}
.footer{margin-top:14px;font-size:.7rem;color:#aaa}.footer a{color:#ffe600;text-decoration:none;font-weight:900}
#popupBrand{display:none}
#btnPopup{display:block !important;margin:12px auto 0 auto !important;width:fit-content !important;max-width:90% !important;background:#00d4ff;color:#000;font-weight:bold;padding:10px 20px;border:none;border-radius:30px;cursor:pointer}
#offAirBox{display:none}
#offAirBox img{width:100%;border-radius:14px;border:1.5px solid #7b1fa2;display:block}
@media (max-width:768px){ #btnPopup{display:none !important;} }
@media (pointer:coarse){ #btnPopup{display:none !important;} }
html.popup-mode, body.popup-mode{ background:#020a18 !important; background-image:linear-gradient(180deg,#0a1830 0%,#020a18 100%) !important; overflow:hidden !important; height:380px !important; }
html.popup-mode .logo, body.popup-mode .logo, html.popup-mode h1, body.popup-mode h1, html.popup-mode .live, body.popup-mode .live, html.popup-mode .footer, body.popup-mode .footer{display:none !important}
html.popup-mode .overlay{background:transparent !important;min-height:auto !important;padding:0 !important;align-items:flex-start !important}
html.popup-mode .container{max-width:360px !important;margin:0 auto !important;padding:8px !important; background:transparent !important;border:none !important; height:380px !important; overflow:hidden !important; border-radius:0 !important}
html.popup-mode #popupBrand{display:block !important; font-size:0.68rem !important; color:#ffd966 !important; letter-spacing:2.5px !important; font-weight:900 !important; margin-bottom:4px !important; text-align:center}
html.popup-mode .box{background:rgba(255,255,255,.10) !important;border:none !important;padding:8px !important;border-radius:14px !important}
</style>
</head>
<body>
<div class="overlay">
<div class="container">
<div id="popupBrand">RADIO SISTEMA 3 - SOUL</div>
<img src="RADIO%20SISTEMA%203.jpeg" class="logo" style="width:70px;border-radius:12px;background:#fff;padding:3px">
<h1>SOUL FUNK</h1>
<div class="live" id="liveLabel">💜 SOUL ON AIR</div>
<div class="btns"><a id="btnMain" class="main" href="index.html">MAIN</a><a id="btnSoul" class="soul active" href="soul.html">SOUL FUNK</a></div>
<div class="box-title">♪ Ascolta in diretta</div>
<div class="box">
<div id="playerLive">
<audio id="radioAudio" controls preload="none" playsinline><source src="https://listentomystream.com:8046/soul" type="audio/mpeg"></audio>
<div class="vu-wrap"><canvas id="vuCanvas" width="600" height="32"></canvas><div class="vu-label"><span>L ● R STEREO</span><span id="vuPeak" style="color:#b388ff">● LIVE</span></div></div>
<button id="btnPopup" onclick="apriPopupPlayer()">⧉ APRI POPUP PLAYER</button>
<div class="box-title" style="margin-top:10px">♪ Brano in onda</div>
<div id="trackBox"><img src="./RS3_SOUL_viola_scuro.jpg"><div id="trackText">SOUL FUNK - Live Non Stop</div></div>
</div>
<div id="offAirBox"><img src="offair-soul.jpg" alt="OFF AIR"></div>
</div>
<div class="footer">© Radio Sistema 3<br><br><a id="footerMain" href="index.html?play=1">⬅ Torna a MAIN</a></div>
</div>
</div>
<script>
let popupWin=null, userPausedManually=false, isOffAir=false, stallTimer=null;
function hidePopupOnMobile(){ const btn=document.getElementById('btnPopup'); if(!btn) return; const isMobile=window.innerWidth<=768||/Mobi|Android|iPhone/i.test(navigator.userAgent); btn.style.display=isMobile?'none':'block'; }
function apriPopupPlayer(){ if(window.innerWidth<=768) return; const a=document.getElementById('radioAudio'); userPausedManually=true; a.pause(); popupWin=window.open(location.href.split('?')[0]+'?popup=1','RS3Soul','width=380,height=380'); let c=setInterval(()=>{ if(popupWin&&popupWin.closed){ clearInterval(c); popupWin=null; userPausedManually=false; if(!isOffAir) a.play().catch(()=>{});} },800); }
function setupChannelNav(){ const isPopup=new URLSearchParams(location.search).get('popup')==='1'||!!window.opener; const bM=document.getElementById('btnMain'),bS=document.getElementById('btnSoul'),fM=document.getElementById('footerMain'); bM.href=isPopup?'index.html?popup=1':'index.html'; bS.href=isPopup?'soul.html?popup=1':'soul.html'; if(fM) fM.href=isPopup?'index.html?popup=1':'index.html?play=1'; }
setupChannelNav(); hidePopupOnMobile();
const radioEl=document.getElementById('radioAudio');
const vuCanvas=document.getElementById('vuCanvas'),vuCtx=vuCanvas.getContext('2d');
let isPlayingVU=false,levelL=0,levelR=0;
function drawStereo(){ const W=vuCanvas.width,H=vuCanvas.height; vuCtx.clearRect(0,0,W,H); vuCtx.fillStyle='#111118'; vuCtx.fillRect(0,0,W,H); let bars=36,barW=W/bars,gap=1.5,rowH=H/2-2; let activeL=Math.floor((levelL/100)*bars); for(let i=0;i<bars;i++){ let x=i*barW; let lit=i<activeL; let c=i<bars*0.6?(lit?'#7b1fa2':'#2a0a1a'):i<bars*0.84?(lit?'#ffe600':'#1a1a00'):(lit?'#ff1a1a':'#1a0000'); vuCtx.fillStyle=c; vuCtx.fillRect(x+gap,1,barW-gap*2,rowH-1); } vuCtx.fillStyle='#333'; vuCtx.fillRect(0,H/2-0.5,W,1); let activeR=Math.floor((levelR/100)*bars); for(let i=0;i<bars;i++){ let x=i*barW; let lit=i<activeR; let c=i<bars*0.6?(lit?'#b388ff':'#1a0a2a'):i<bars*0.84?(lit?'#ffe600':'#1a1a00'):(lit?'#ff1a1a':'#1a0000'); vuCtx.fillStyle=c; vuCtx.fillRect(x+gap,H/2+1,barW-gap*2,rowH-1); } requestAnimationFrame(drawStereo); }
function updateStereo(){ if(!isPlayingVU){ levelL+=(0-levelL)*0.08; levelR+=(0-levelR)*0.08; return; } let base=40+Math.random()*45; levelL+=(base+Math.random()*18-levelL)*0.38; levelR+=(base*0.9+Math.random()*20-levelR)*0.34; }
function goOffAirNow(){ if(isOffAir) return; isOffAir=true; document.getElementById('offAirBox').style.display='block'; document.getElementById('playerLive').style.display='none'; document.getElementById('liveLabel').textContent='🔧 Prove tecniche in corso'; try{ radioEl.pause(); radioEl.src=''; radioEl.load(); radioEl.removeAttribute('src'); }catch(e){} clearTimeout(stallTimer); isPlayingVU=false; }
function goLiveNow(){ if(!isOffAir) return; isOffAir=false; document.getElementById('offAirBox').style.display='none'; document.getElementById('playerLive').style.display='block'; document.getElementById('liveLabel').textContent='💜 SOUL ON AIR'; userPausedManually=false; try{ radioEl.src='https://listentomystream.com:8046/soul'; radioEl.load(); radioEl.play().catch(()=>{}); }catch(e){} }
radioEl.addEventListener('pause', ()=>{ if(!isOffAir) userPausedManually=true; isPlayingVU=false; document.getElementById('vuPeak').textContent='STOP'; document.getElementById('vuPeak').style.color='#ff4444'; });
radioEl.addEventListener('play', ()=>{ userPausedManually=false; isPlayingVU=true; document.getElementById('vuPeak').textContent='● LIVE'; document.getElementById('vuPeak').style.color='#b388ff'; clearTimeout(stallTimer); });
radioEl.addEventListener('stalled', ()=>{ if(!userPausedManually){ clearTimeout(stallTimer); stallTimer=setTimeout(goOffAirNow, 1000); } });
radioEl.addEventListener('error', ()=>{ if(!userPausedManually) goOffAirNow(); });
radioEl.addEventListener('ended', ()=>{ if(!userPausedManually) goOffAirNow(); });
radioEl.addEventListener('emptied', ()=>{ if(!userPausedManually){ clearTimeout(stallTimer); stallTimer=setTimeout(goOffAirNow, 1200); } });
drawStereo(); setInterval(updateStereo,60);
async function checkSoulLive(){ try{ let r=await fetch('https://listentomystream.com:8046/status-json.xsl?cb='+Date.now(),{cache:'no-store'}); let j=await r.json(); let src=j.icestats.source; if(!Array.isArray(src)) src=[src]; let soul=src.find(s=>(s.listenurl||'').includes('/soul')); let live=!!soul; if(live&&isOffAir) goLiveNow(); else if(!live&&!isOffAir) goOffAirNow(); }catch(e){} }
setTimeout(checkSoulLive,2000); setInterval(checkSoulLive,4000);
</script>
<script>
const FALLBACK_COVER="./RS3_SOUL_viola_scuro.jpg"; let lastTitle="";
function pulisciTitoloSoul(raw){ let t=raw||""; t=t.replace(/Radio Sistema 3/gi,'').replace(/SOUL FUNK/gi,'').trim(); t=t.replace(/^\s*\d{1,2}:\d{2}.*?\s*/gi,'').replace(/\s+/g,' ').trim(); if(t.includes('-')||t.includes('–')){ t=t.replace(/\s*–\s*/g,' - ').replace(/\s*-\s*/g,' - '); return t.trim(); } let w=t.split(/\s+/).filter(Boolean); if(w.length>=4) return w.slice(0,-2).join(' ')+' - '+w.slice(-2).join(' '); return t; }
function setTitle(text){ if(!text||text.length<2) return; text=pulisciTitoloSoul(text.trim()); if(text===lastTitle) return; lastTitle=text; document.getElementById('trackText').textContent=text; }
async function fetchTitleDirect(){ if(isOffAir) return; const eps=['https://listentomystream.com:8046/currentsong?sid=2','https://listentomystream.com:8046/status-json.xsl']; for(let b of eps){ try{ let r=await fetch(b+(b.includes('?')?'&':'?')+'cb='+Date.now(),{cache:'no-store'}); if(r.ok){ let txt=await r.text(); if(txt.trim().startsWith('{')){ let j=JSON.parse(txt); let s=j?.icestats?.source; if(Array.isArray(s)){ let soul=s.find(x=>(x.listenurl||'').includes('/soul')); if(soul&&soul.title) { setTitle(soul.title); return; } } } else { let t=txt.trim(); if(t.length>2&&t.length<250&&!t.includes('<html')){ if(!t.toLowerCase().includes('unknown')){ setTitle(t); return; } } } } }catch(e){} } }
setTimeout(fetchTitleDirect,1500); setInterval(fetchTitleDirect,8000);
</script>
</body>
</html>
