<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radio Sistema 3 - SOUL FUNK v37</title>
<script src="https://manage.myshoutca.st/system/recenttracks.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Segoe UI,Arial,sans-serif;color:white;text-align:center;background:linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.55)),url("studio-radio.jpeg");background-size:cover;background-position:center;background-attachment:fixed;}
.container{max-width:900px;margin:25px auto;padding:30px;background:rgba(255,255,255,.08);backdrop-filter:blur(8px);border-radius:25px;border:1px solid #7b1fa2;}
.logo-wrap{display:inline-block;padding:5px;border-radius:26px;background:linear-gradient(135deg,#7b1fa2,#4a148c,#ffb300,#7b1fa2);background-size:300% 300%;animation:gradientMove 4s ease infinite;}
@keyframes gradientMove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.logo{width:260px;height:260px;object-fit:cover;border-radius:20px;display:block;background:#fff;}
h1{margin-top:20px;font-size:3rem;color:#9c27b0;}
.live{margin-top:15px;color:#ce93d8;font-size:1.6rem;font-weight:bold;animation:pulse 1.4s infinite;}
@keyframes pulse{0%{opacity:1}50%{opacity:.4}100%{opacity:1}}
.player-box{margin-top:15px;background:rgba(255,255,255,.10);padding:12px;border-radius:20px;width:400px;max-width:92%;margin:0 auto;}
.section-title{font-size:1.4rem;margin-bottom:8px;color:#ffb300;}
audio{width:100%;max-width:340px;height:44px;}
#btnTap{background:#ffb300;color:#000;font-weight:900;padding:14px 28px;border:none;border-radius:30px;cursor:pointer;font-size:1.15rem;margin-top:12px;width:90%;}
.cc_recenttracks_list{margin-top:8px !important;color:white !important;text-align:left !important;max-width:400px !important;margin:auto !important;background:rgba(0,0,0,0.65) !important;padding:10px 12px !important;border-radius:14px !important;display:flex !important;flex-direction:row !important;align-items:center !important;gap:12px !important;min-height:90px !important;}
.cc_recenttracks_list img{width:82px !important;height:82px !important;min-width:82px !important;object-fit:cover !important;border-radius:8px !important;display:block !important;background:#000 !important;}
.cc_recenttracks_list *{color:white !important;line-height:1.25 !important;font-size:0.92rem !important;text-align:left !important;}
.vu-wrap{margin-top:8px;background:rgba(0,0,0,.75);padding:4px 6px;border-radius:8px;border:1px solid rgba(255,255,255,.2);max-width:320px;margin:auto;}
#vuCanvas{width:100%;height:32px;display:block;border-radius:4px;background:#0a0a0a;}
.vu-label{font-size:.65rem;color:#aaa;margin-top:2px;display:flex;justify-content:space-between;font-family:monospace;}
.ch-chooser{display:flex;gap:8px;justify-content:center;margin-bottom:12px}
.ch-btn{flex:1;padding:10px 0;border-radius:30px;border:none;font-weight:900;font-size:0.85rem;cursor:pointer;text-decoration:none;display:flex;align-items:center;justify-content:center}
.ch-main{background:#fff;color:#222}
.ch-soul{background:#7b1fa2;color:#fff;box-shadow:0 0 12px #7b1fa2}
.ch-btn.active{outline:3px solid #ffb300;transform:scale(1.05)}
@media (max-width:768px){ #btnPopup{display:none !important;} }
</style>
</head>
<body>
<div class="container">
<div class="logo-wrap"><img src="RADIO SISTEMA 3.jpeg" class="logo"></div>
<h1>SOUL FUNK</h1>
<div class="live">💜 SOUL ON AIR</div>
<div class="player-box">
<div class="ch-chooser">
<a class="ch-btn ch-main" href="index.html">MAIN</a>
<a class="ch-btn ch-soul active" href="soul.html">SOUL FUNK</a>
</div>
<div class="section-title">♪ Ascolta in diretta</div>
<audio id="radioAudio" controls playsinline></audio>
<button id="btnTap" onclick="tapPlay()">▶ TAP PER ASCOLTARE SOUL</button>
<div class="vu-wrap"><canvas id="vuCanvas" width="600" height="32"></canvas><div class="vu-label"><span>L ● R STEREO</span><span id="vuPeak">STOP</span></div></div>
<button id="btnPopup" onclick="window.open('soul.html?popup=1','popup','width=380,height=380')" style="margin-top:12px;background:#7b1fa2;color:#fff;font-weight:bold;padding:10px 20px;border:none;border-radius:30px;cursor:pointer;">⧉ APRI POPUP PLAYER</button>
</div>
<div class="section-title" style="margin-top:8px;font-size:1.3rem">♪ Brano in onda</div>
<div class="cc_recenttracks_list" data-username="tbqmsenb"></div>
<div style="margin-top:20px;font-size:0.85rem">© Radio Sistema 3 - Tutti i Diritti Riservati</div>
</div>
<script>
const STREAM = "https://control.myshoutca.st/proxy/tbqmsenb/stream";
const audio = document.getElementById('radioAudio');
const btnTap = document.getElementById('btnTap');
const vuPeak = document.getElementById('vuPeak');

function tapPlay(){
  audio.src = STREAM + "?_=" + Date.now();
  audio.load();
  let p = audio.play();
  if(p){ p.then(()=>{ btnTap.style.display='none'; audio.style.display='block'; vuPeak.textContent='● LIVE'; vuPeak.style.color='#00ff2a'; }).catch(()=>{ btnTap.textContent='▶ RITAPPA QUI'; }); }
}

// VU
const vuCanvas=document.getElementById('vuCanvas'); const ctx=vuCanvas.getContext('2d'); let l=0,r=0, playing=false;
function draw(){ ctx.fillStyle='#0a0a0a'; ctx.fillRect(0,0,600,32); let bars=36; for(let i=0;i<bars;i++){ let lit = i < l/3; ctx.fillStyle = lit ? (i<22?'#00ff2a':i<30?'#ffea00':'#ff1a1a') : '#111'; ctx.fillRect(i*16.6+1,1,14,13); ctx.fillStyle = lit ? (i<22?'#9c27b0':i<30?'#ffb300':'#ff1a1a') : '#111'; ctx.fillRect(i*16.6+1,17,14,13); } requestAnimationFrame(draw); }
setInterval(()=>{ if(!playing){ l*=0.9; r*=0.9; } else { l = 30 + Math.random()*60; r = 30 + Math.random()*60; } }, 70);
audio.addEventListener('play',()=>{ playing=true; });
audio.addEventListener('pause',()=>{ playing=false; vuPeak.textContent='STOP'; });
draw();
</script>
</body>
</html>
