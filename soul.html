<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOUL FUNK</title>
<script src="https://manage.myshoutca.st/system/recenttracks.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;color:white;text-align:center;background: linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.6)), url("studio-radio.jpeg");background-size:cover;background-position:center;background-attachment:fixed;background-color:#0d0620}
.overlay{background:rgba(8,0,18,0.35);min-height:100vh;padding:20px;display:flex;align-items:center;justify-content:center}
.container{width:100%;max-width:420px;padding:22px;background:rgba(0,0,0,0.82);border-radius:22px;border:1.5px solid #ff3b9a}
.logo{width:70px;border-radius:12px;background:#fff;padding:3px}
h1{color:#ffe600;font-size:1.9rem;margin-top:6px}
.live{color:#ff3b9a;font-weight:900;margin-top:2px}
.btns{display:flex;gap:8px;justify-content:center;margin:14px 0}
.btns a{padding:9px 18px;border-radius:20px;text-decoration:none;font-weight:900;font-size:.8rem}
.main{background:#fff;color:#000}.soul{background:#ff3b9a;color:#fff;border:1px solid #ffe600}
.box{background:rgba(20,20,20,.75);padding:14px;border-radius:14px;border:1px solid #333}
audio{width:100%;height:38px}
.vu-wrap{margin-top:10px;background:#0e0e0e;padding:6px;border-radius:8px;border:1px solid #333}
#vuCanvas{width:100%;height:34px;background:#0a0a0a;border-radius:4px}
.vu-label{display:flex;justify-content:space-between;font-size:.6rem;color:#888;margin-top:3px;font-weight:900}

/* COPERTINA + AUTORE FIX */
#trackBox{min-height:96px;background:rgba(0,0,0,.5);padding:10px;border-radius:12px;margin-top:10px}
.cc_recenttracks_list{background:transparent !important;padding:0 !important;display:flex !important;align-items:center !important;gap:12px !important;text-align:left !important}
.cc_recenttracks_list *{color:white !important;line-height:1.2 !important;font-size:.95rem !important;white-space:normal !important;word-break:break-word !important}
.cc_recenttracks_list .ccbuy{display:none !important}
.cc_recenttracks_list img{width:76px !important;height:76px !important;min-width:76px !important;object-fit:cover;border-radius:6px;opacity:0 !important;display:block !important}
.cc_recenttracks_list:nth-of-type(n+2){display:none !important}
.footer{margin-top:14px;font-size:.7rem;color:#aaa}.footer a{color:#ffe600;text-decoration:none;font-weight:900}
</style>
</head>
<body>
<div class="overlay">
<div class="container">
<img src="RADIO SISTEMA 3.jpeg" class="logo">
<h1>SOUL FUNK</h1>
<div class="live">💗 SOUL ON AIR</div>
<div class="btns"><a class="main" href="index.html?play=1">MAIN</a><a class="soul">SOUL FUNK</a></div>
<div class="box">
<audio id="radioAudio" controls autoplay><source src="https://control.myshoutca.st/proxy/tbqmsenb/stream" type="audio/mpeg"></audio>
<div class="vu-wrap"><canvas id="vuCanvas" width="600" height="34"></canvas><div class="vu-label"><span>L ● R STEREO</span><span style="color:#0f0">● LIVE</span></div></div>
<div style="margin-top:10px;color:#ffd966;font-weight:900">♪ Brano in onda</div>
<div id="trackBox"><div class="cc_recenttracks_list" data-username="tbqmsenb"></div></div>
</div>
<div class="footer">© Radio Sistema 3<br><br><a href="index.html?play=1">⬅ Torna a MAIN</a></div>
</div>
</div>

<script>
// FIX COPERTINA + AUTORE - stesso identico del MAIN che funziona
function cleanWhiteBorder(img){
 if(img.dataset.cleaned==="1") return; img.dataset.cleaned="1";
 const finalSize=76;
 const t=new Image(); t.crossOrigin="anonymous";
 t.onload=function(){
  const w=t.width,h=t.height; const c=document.createElement('canvas'); const ctx=c.getContext('2d');
  c.width=w;c.height=h; ctx.drawImage(t,0,0);
  const data=ctx.getImageData(0,0,w,h).data; let top=0,bottom=h,left=0,right=w;
  for(let y=0;y<h;y++){let wr=true;for(let x=0;x<w;x++){let i=(y*w+x)*4;if(data[i]<230||data[i+1]<230||data[i+2]<230){wr=false;break;}}if(!wr){top=y;break;}}
  for(let y=h-1;y>=0;y--){let wr=true;for(let x=0;x<w;x++){let i=(y*w+x)*4;if(data[i]<230||data[i+1]<230||data[i+2]<230){wr=false;break;}}if(!wr){bottom=y+1;break;}}
  for(let x=0;x<w;x++){let wc=true;for(let y=top;y<bottom;y++){let i=(y*w+x)*4;if(data[i]<230||data[i+1]<230||data[i+2]<230){wc=false;break;}}if(!wc){left=x;break;}}
  for(let x=w-1;x>=0;x--){let wc=true;for(let y=top;y<bottom;y++){let i=(y*w+x)*4;if(data[i]<230||data[i+1]<230||data[i+2]<230){wc=false;break;}}if(!wc){right=x+1;break;}}
  const cw=right-left,ch=bottom-top; const o=document.createElement('canvas');o.width=finalSize;o.height=finalSize;const octx=o.getContext('2d');
  octx.drawImage(c,left,top,cw,ch,0,0,finalSize,finalSize);
  img.src=o.toDataURL('image/jpeg',0.92); img.style.opacity="1"; img.style.width=finalSize+"px"; img.style.height=finalSize+"px";
 };
 t.src=img.src;
}
const list=document.querySelector('.cc_recenttracks_list');
if(list){
 new MutationObserver(()=>{document.querySelectorAll('.cc_recenttracks_list img').forEach(cleanWhiteBorder);}).observe(list,{childList:true,subtree:true});
 setInterval(()=>{document.querySelectorAll('.cc_recenttracks_list img').forEach(cleanWhiteBorder);},1000);
}

// VU STEREO
const c=document.getElementById('vuCanvas'),x=c.getContext('2d');let l=0,r=0;
function draw(){x.clearRect(0,0,c.width,c.height);x.fillStyle='#0a0a0a';x.fillRect(0,0,c.width,c.height);let bars=30,bw=c.width/bars,g=1.5,rh=c.height/2-2,al=Math.floor((l/100)*bars),ar=Math.floor((r/100)*bars);for(let i=0;i<bars;i++){let lit=i<al;x.fillStyle=lit?(i<18?'#0f0':i<24?'#ff0':'#f00'):'#1a1a1a';x.fillRect(i*bw+g,1,bw-g*2,lit?rh-1:rh*0.4)}x.fillStyle='#333';x.fillRect(0,c.height/2-.5,c.width,1);for(let i=0;i<bars;i++){let lit=i<ar;x.fillStyle=lit?(i<18?'#0af':i<24?'#ff0':'#f00'):'#1a1a1a';x.fillRect(i*bw+g,c.height/2+1,bw-g*2,lit?rh-1:rh*0.4)}requestAnimationFrame(draw)}function upd(){let b=22+Math.random()*30;l+=(b+Math.random()*15-l)*0.3;r+=(b+Math.random()*15-r)*0.3}draw();setInterval(upd,70);

// FORCE RELOAD TRACK INFO come sul MAIN quando premi play
document.getElementById('radioAudio').addEventListener('play',()=>{
  const s=document.createElement('script');
  s.src='https://manage.myshoutca.st/system/recenttracks.js?now='+Date.now();
  document.head.appendChild(s); setTimeout(()=>s.remove(),3000);
});
</script>
</body>
</html>
