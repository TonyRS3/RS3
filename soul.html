<style>

<body>
<div class="container">
<div class="logo-wrap"><img src="RADIO SISTEMA 3.jpeg" alt="Radio Sistema 3" class="logo"></div>
<h1>SOUL FUNK</h1>
<div class="live">💜 SOUL ON AIR</div>
<div class="player-box">
<div class="ch-chooser">
<a class="ch-btn ch-main" href="index.html">MAIN</a>
<a class="ch-btn ch-soul active" href="soul.html">SOUL FUNK</a>
</div>
<div class="section-title">♪ Ascolta in diretta</div>
<audio id="radioAudio" controls playsinline preload="auto" crossorigin="anonymous"></audio>
<button id="btnTap" onclick="playSoul()">▶ TAP PER ASCOLTARE</button>
<div id="statusLine">Pronto - tocca TAP</div>
<div class="vu-wrap"><canvas id="vuCanvas" width="600" height="32"></canvas><div class="vu-label"><span>L ● R STEREO</span><span id="vuPeak">STOP</span></div></div>
</div>
<div class="section-title" style="margin-top:18px;font-size:1.3rem">♪ Brano in onda</div>
<div class="cc_recenttracks_list" data-username="tbqmsenb"></div>
<button class="btn-novita" onclick="toggleNovita()">🎵 NOVITÀ MUSICALI</button>
<div id="novitaSection"><div id="novitaPlayerMain"></div><div id="novitaList"></div></div>
<div style="margin-top:22px;font-size:0.85rem;opacity:0.7">© Radio Sistema 3</div>
</div>

<script>
// LISTA STREAM - prova in ordine come fa MAIN
const STREAMS = [
  "https://control.myshoutca.st/proxy/tbqmsenb/mp3",
  "https://control.myshoutca.st/proxy/tbqmsenb/stream",
  "http://manage.myshoutca.st:8062/stream"
];
const audio = document.getElementById('radioAudio');
const btnTap = document.getElementById('btnTap');
const statusLine = document.getElementById('statusLine');
const vuPeak = document.getElementById('vuPeak');
let audioCtx, analyser, dataArray;
let playing=false, tryIdx=0;

function initAudioGraph(){
  if(audioCtx) return;
  try{
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let source = audioCtx.createMediaElementSource(audio);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    source.connect(analyser);
    analyser.connect(audioCtx.destination);
    dataArray = new Uint8Array(analyser.frequencyBinCount);
  }catch(e){ console.log("AudioContext non disponibile", e); }
}

function playSoul(){
  initAudioGraph();
  if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  statusLine.textContent = "Connessione " + (tryIdx+1) + "/" + STREAMS.length + "...";
  statusLine.style.color = "#ce93d8";
  let url = STREAMS[tryIdx] + (STREAMS[tryIdx].includes("?") ? "&" : "?") + "_=" + Date.now();
  audio.src = url;
  audio.load();
  audio.play().then(()=>{
    btnTap.style.display='none';
    statusLine.textContent='● LIVE SOUL FUNK';
    statusLine.style.color='#00ff2a';
    vuPeak.textContent='● LIVE';
    vuPeak.style.color='#00ff2a';
    playing=true;
  }).catch(err=>{
    console.log("Play fallito idx "+tryIdx, err);
    tryIdx++;
    if(tryIdx < STREAMS.length){
      statusLine.textContent = "Provo server alternativo...";
      setTimeout(playSoul, 700);
    } else {
      statusLine.textContent = "Errore - tocca di nuovo TAP per riprovare";
      statusLine.style.color = "#ff4444";
      btnTap.innerHTML='▶ RIPROVA TAP';
      btnTap.style.display='block';
      tryIdx=0;
    }
  });
}

audio.addEventListener('error', ()=>{
  if(tryIdx < STREAMS.length-1){ tryIdx++; playSoul(); }
});
audio.addEventListener('pause', ()=>{ playing=false; vuPeak.textContent='PAUSA'; vuPeak.style.color='#aaa'; });
audio.addEventListener('play', ()=>{ playing=true; });

// VU METER VERO - collegato all'audio, non random impazzito
const vuCanvas=document.getElementById('vuCanvas'); const ctx=vuCanvas.getContext('2d');
function drawVU(){
  ctx.fillStyle='#0a0a0a'; ctx.fillRect(0,0,600,32);
  let bars=36;
  let levelL=0, levelR=0;
  if(playing && analyser && dataArray){
    analyser.getByteFrequencyData(dataArray);
    let sum=0; for(let i=0;i<64;i++) sum+=dataArray[i];
    let avg = sum/64; // 0-255
    levelL = avg/255*100;
    levelR = levelL * (0.85 + Math.random()*0.15); // leggero stereo
  }
  // barra calma quando fermo
  for(let i=0;i<bars;i++){
    let lit = i < levelL/2.8;
    ctx.fillStyle = lit ? (i<22?'#00ff2a':i<30?'#ffea00':'#ff1a1a') : '#151515';
    ctx.fillRect(i*16.6+1,2,14,12);
    let litR = i < levelR/2.8;
    ctx.fillStyle = litR ? (i<22?'#9c27b0':i<30?'#ffb300':'#ff1a1a') : '#151515';
    ctx.fillRect(i*16.6+1,17,14,12);
  }
  requestAnimationFrame(drawVU);
}
drawVU();

// NOVITA
function toggleNovita(){
  const sec=document.getElementById('novitaSection');
  sec.style.display = sec.style.display==='none' || sec.style.display==='' ? 'block' : 'none';
  if(sec.style.display==='block' && !sec.dataset.loaded){ buildNovita(); sec.dataset.loaded='1'; }
}
function buildNovita(){
  const list=document.getElementById('novitaList');
  const main=document.getElementById('novitaPlayerMain');
  main.innerHTML=PLACEHOLDER_HTML;
  list.innerHTML='';
  BRANI_NOVITA.forEach((b)=>{
    let row=document.createElement('div');
    row.className='novita-row';
    row.innerHTML=`<img src="https://img.youtube.com/vi/${b.id}/mqdefault.jpg"><div><b>${b.artista}</b><br><span style="color:#aaa;font-size:0.82rem">${b.titolo}</span></div>`;
    row.onclick=()=>{
      document.querySelectorAll('.novita-row').forEach(r=>r.classList.remove('active'));
      row.classList.add('active');
      main.innerHTML=`<iframe src="https://www.youtube.com/embed/${b.id}?autoplay=1&rel=0" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
    };
    list.appendChild(row);
  });
}
</script>
