<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOUL FUNK - Radio Sistema 3 - v46.7 NO SNIPPET</title>
<script>
if(new URLSearchParams(location.search).get('popup')==='1'){
  document.documentElement.classList.add('popup-mode');
  document.addEventListener('DOMContentLoaded',()=>{
    document.body.classList.add('popup-mode');
    const a=document.getElementById('radioAudio');
    if(a){ a.autoplay=true; setTimeout(()=>a.play().catch(()=>{}), 500); }
  });
}
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;color:white;text-align:center;background: linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.6)), url("studio-radio.jpeg");background-size:cover;background-position:center;background-attachment:fixed;background-color:#0d0620}
.overlay{background:rgba(8,0,18,0.35);min-height:100vh;padding:20px;display:flex;align-items:center;justify-content:center}
.container{width:100%;max-width:420px;padding:22px;background:rgba(0,0,0,0.82);border-radius:22px;border:1.5px solid #7b1fa2}
h1{color:#ffe600;font-size:1.9rem;margin-top:6px}
.live{color:#b388ff;font-weight:900;margin-top:2px;animation:pulse 1.4s infinite}
@keyframes pulse{0%{opacity:1}50%{opacity:.5}100%{opacity:1}}
.btns{display:flex;gap:8px;justify-content:center;margin:14px 0}
.btns a{padding:10px 18px;border-radius:22px;text-decoration:none;font-weight:900;font-size:.85rem;flex:1}
.main{background:#fff;color:#555;border:2px solid #ffe600}.soul{background:#7b1fa2;color:#fff;border:2px solid #7b1fa2}
.box-title{color:#ffe67a;font-size:1.15rem;margin:12px 0 8px;font-weight:700}
.box{background:rgba(20,20,20,.75);padding:14px;border-radius:14px;border:1px solid #333}
audio{width:100%;height:38px;border-radius:20px}
.vu-wrap{margin-top:8px;background:#1e1e28;padding:6px 8px;border-radius:10px;border:1px solid #333;max-width:320px;margin:0 auto}
#vuCanvas{width:100%;height:32px;background:#111118;border-radius:4px;display:block}
.vu-label{display:flex;justify-content:space-between;font-size:.6rem;color:#999;margin-top:4px;font-weight:900;font-family:monospace}
#trackBox{min-height:92px;background:rgba(0,0,0,.45);padding:8px;border-radius:12px;margin-top:6px;display:flex;align-items:center;gap:10px;text-align:left}
#trackBox img{width:76px;height:76px;min-width:76px;object-fit:cover;border-radius:6px;border:2px solid #7b1fa2}
#trackText{color:white;font-size:.92rem}
.footer{margin-top:14px;font-size:.7rem;color:#aaa}.footer a{color:#ffe600;text-decoration:none;font-weight:900}
#popupBrand{display:none}
#btnPopup{display:block !important;margin:12px auto 0 auto !important;width:fit-content !important;background:#00d4ff;color:#000;font-weight:bold;padding:10px 20px;border:none;border-radius:30px;cursor:pointer}
#offAirBox{display:none}
#offAirBox img{width:100%;border-radius:14px;border:1.5px solid #7b1fa2;display:block}
@media (max-width:768px){ #btnPopup{display:none !important;} }
html.popup-mode, body.popup-mode{ background:#020a18 !important; height:380px !important; overflow:hidden !important; }
html.popup-mode .logo, body.popup-mode .logo, html.popup-mode h1, body.popup-mode h1, html.popup-mode .live, body.popup-mode .live, html.popup-mode .footer, body.popup-mode .footer{display:none !important}
html.popup-mode .overlay{background:transparent !important;min-height:auto !important;padding:0 !important}
html.popup-mode .container{max-width:360px !important;margin:0 auto !important;padding:8px !important; background:transparent !important;border:none !important; height:380px !important; overflow:hidden !important}
html.popup-mode #popupBrand{display:block !important; font-size:0.68rem !important; color:#ffd966 !important; letter-spacing:2.5px !important; font-weight:900 !important; margin-bottom:4px !important; text-align:center}
html.popup-mode .box{background:rgba(255,255,255,.10) !important;border:none !important;padding:8px !important;border-radius:14px !important}
</style>
</head>
<body>
<div class="overlay">
<div class="container">
<div id="popupBrand">RADIO SISTEMA 3 - SOUL</div>
<img src="RADIO%20SISTEMA%203.jpeg" class="logo" style="width:70px;border-radius:12px;background:#fff;padding:3px">
<h1>SOUL FUNK</h1>
<div class="live" id="liveLabel">⌛ Controllo...</div>
<div class="btns"><a id="btnMain" class="main" href="index.html">MAIN</a><a id="btnSoul" class="soul active" href="soul.html">SOUL FUNK</a></div>
<div class="box-title">♪ Ascolta in diretta</div>
<div class="box">
<div id="playerLive" style="display:none">
<audio id="radioAudio" controls preload="none" playsinline></audio>
<div class="vu-wrap"><canvas id="vuCanvas" width="600" height="32"></canvas><div class="vu-label"><span>L ● R STEREO</span><span id="vuPeak">● LIVE</span></div></div>
<button id="btnPopup" onclick="apriPopupPlayer()">⧉ APRI POPUP PLAYER</button>
<div class="box-title" style="margin-top:10px">♪ Brano in onda</div>
<div id="trackBox"><img src="./RS3_SOUL_viola_scuro.jpg"><div id="trackText">SOUL FUNK</div></div>
</div>
<div id="offAirBox" style="display:none"><img src="offair-soul.jpg" alt="OFF AIR"></div>
</div>
<div class="footer">© Radio Sistema 3<br><br><a href="index.html">⬅ Torna a MAIN</a></div>
</div>
</div>
<script>
let popupWin=null, userPausedManually=false, isOffAir=true;
function hidePopupOnMobile(){ const b=document.getElementById('btnPopup'); if(!b) return; const m=window.innerWidth<=768||/Mobi|Android|iPhone/i.test(navigator.userAgent); b.style.display=m?'none':'block'; }
function apriPopupPlayer(){ if(window.innerWidth<=768) return; const a=document.getElementById('radioAudio'); userPausedManually=true; a.pause(); popupWin=window.open(location.href.split('?')[0]+'?popup=1','RS3Soul','width=380,height=380'); let c=setInterval(()=>{ if(popupWin&&popupWin.closed){ clearInterval(c); popupWin=null; userPausedManually=false; if(!isOffAir) a.play().catch(()=>{});} },800); }
const radioEl=document.getElementById('radioAudio');
const vuCanvas=document.getElementById('vuCanvas'),vuCtx=vuCanvas.getContext('2d');
let isPlayingVU=false,levelL=0,levelR=0;
function drawStereo(){ const W=vuCanvas.width,H=vuCanvas.height; vuCtx.clearRect(0,0,W,H); vuCtx.fillStyle='#111118'; vuCtx.fillRect(0,0,W,H); let bars=36,barW=W/bars; let aL=Math.floor((levelL/100)*bars); for(let i=0;i<bars;i++){ vuCtx.fillStyle=i<aL?'#7b1fa2':'#2a0a1a'; vuCtx.fillRect(i*barW+1,1,barW-2,13); } vuCtx.fillStyle='#333'; vuCtx.fillRect(0,15.5,W,1); let aR=Math.floor((levelR/100)*bars); for(let i=0;i<bars;i++){ vuCtx.fillStyle=i<aR?'#b388ff':'#1a0a2a'; vuCtx.fillRect(i*barW+1,17,barW-2,13); } requestAnimationFrame(drawStereo); }
function updateStereo(){ if(!isPlayingVU){ levelL*=0.92; levelR*=0.92; return; } levelL=40+Math.random()*50; levelR=40+Math.random()*50; }

function goOffAirNow(){
  isOffAir=true;
  document.getElementById('offAirBox').style.display='block';
  document.getElementById('playerLive').style.display='none';
  document.getElementById('liveLabel').textContent='🔧 Prove tecniche in corso';
  try{ radioEl.pause(); radioEl.removeAttribute('src'); radioEl.load(); }catch(e){}
  isPlayingVU=false;
  localStorage.setItem('soulOffAir','1');
}
function goLiveNow(){
  isOffAir=false;
  document.getElementById('offAirBox').style.display='none';
  document.getElementById('playerLive').style.display='block';
  document.getElementById('liveLabel').textContent='💜 SOUL ON AIR';
  userPausedManually=false;
  try{
    if(!radioEl.src || !radioEl.src.includes('/soul')){
      radioEl.src='https://listentomystream.com:8046/soul';
      radioEl.load();
    }
    radioEl.play().catch(()=>{});
  }catch(e){}
  isPlayingVU=true;
  localStorage.setItem('soulOffAir','0');
}

radioEl.addEventListener('play', ()=>{ userPausedManually=false; isPlayingVU=true; });
radioEl.addEventListener('pause', ()=>{ if(!isOffAir) userPausedManually=true; isPlayingVU=false; });

drawStereo(); setInterval(updateStereo,80);

async function checkSoulLive(){
  try{
    let r=await fetch('https://listentomystream.com:8046/status-json.xsl?cb='+Date.now(),{cache:'no-store'});
    let j=await r.json();
    let src=j.icestats.source;
    if(!Array.isArray(src)) src=[src];
    let soul=src.find(s=>(s.listenurl||'').includes('/soul'));
    let live=!!soul;
    if(live && isOffAir) goLiveNow();
    if(!live && !isOffAir) goOffAirNow();
    return live;
  }catch(e){ return null; }
}

hidePopupOnMobile();

// FIX PRINCIPALE: all'apertura BLOCCA tutto, controlla prima di far partire musica
(async function initSoul(){
  // 1. Blocca subito qualsiasi audio
  try{ radioEl.pause(); radioEl.removeAttribute('src'); }catch(e){}
  document.getElementById('playerLive').style.display='none';
  document.getElementById('offAirBox').style.display='none';
  document.getElementById('liveLabel').textContent='⌛ Controllo SOUL...';

  // 2. Se l'ultima volta eravamo OFF, mostra subito OFF senza far partire musica
  let lastOff = localStorage.getItem('soulOffAir');
  if(lastOff==='1'){
    goOffAirNow();
  }

  // 3. Controlla il server
  let live = await checkSoulLive();
  
  if(live===true){
    goLiveNow();
  } else if(live===false){
    goOffAirNow();
  } else {
    // se il check fallisce (CORS), prova a vedere se RadioBOSS è davvero ON provando a suonare
    // se dopo 2 sec non suona, vai OFF
    setTimeout(async ()=>{
      let live2 = await checkSoulLive();
      if(live2===true){
        goLiveNow();
      } else if(live2===false){
        goOffAirNow();
      } else {
        // ultimo tentativo: prova a far partire lo stream, se parte è LIVE
        try{
          radioEl.src='https://listentomystream.com:8046/soul';
          radioEl.load();
          let p = radioEl.play();
          if(p){
            p.then(()=>{
              goLiveNow();
            }).catch(()=>{
              goOffAirNow();
            });
          }
          setTimeout(()=>{
            if(radioEl.paused && isOffAir===false){
              // se ancora in pausa e non siamo OFF, riprova
            }
            if(radioEl.paused && radioEl.currentTime===0){
              // se proprio non parte, considera OFF
              if(document.getElementById('playerLive').style.display==='none' && document.getElementById('offAirBox').style.display==='none'){
                goOffAirNow();
              }
            }
          }, 2000);
        }catch(e){
          goOffAirNow();
        }
      }
    }, 1000);
  }
})();

setInterval(checkSoulLive, 5000);
</script>
<script>
let lastTitle="";
function setTitle(text){ if(!text||text.length<2) return; if(text===lastTitle) return; lastTitle=text; document.getElementById('trackText').textContent=text; }
async function fetchTitleDirect(){ if(isOffAir) return; try{ let r=await fetch('https://listentomystream.com:8046/status-json.xsl?cb='+Date.now(),{cache:'no-store'}); let j=await r.json(); let src=j.icestats.source; if(Array.isArray(src)){ let s=src.find(x=>(x.listenurl||'').includes('/soul')); if(s&&s.title) setTitle(s.title); } }catch(e){} }
setTimeout(fetchTitleDirect,2000); setInterval(fetchTitleDirect,8000);
</script>
</body>
</html>
