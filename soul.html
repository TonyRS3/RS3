<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOUL FUNK - Radio Sistema 3</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:radial-gradient(circle at top,#3a0a3a,#0e020e);color:white;text-align:center;min-height:100vh}
.container{max-width:560px;margin:12px auto;padding:18px;background:rgba(20,0,20,.55);border-radius:22px;border:2px solid #ff3b9a}
.logo{width:200px;border-radius:18px;background:white;padding:5px}
h1{color:#ffe600;font-size:2.6rem;margin-top:10px}
.sub{color:#ddd}
.live{color:#ff3b9a;font-weight:900;margin-top:4px}
.btns{display:flex;gap:12px;justify-content:center;margin:16px 0}
.btns a{padding:12px 28px;border-radius:30px;text-decoration:none;font-weight:900}
.main{background:white;color:black}
.soul{background:#ff3b9a;color:white;border:2px solid #ffe600}
.box{background:rgba(255,255,255,.06);padding:14px;border-radius:16px}
audio{width:100%;height:40px}
.vu{margin-top:12px;background:#0a0a0a;border-radius:10px;padding:8px 10px;border:1px solid #333}
.vu-bars{display:flex;flex-direction:column;gap:4px}
.vu-row{display:flex;gap:3px}
.vu-row span{flex:1;height:14px;border-radius:2px;background:#1a1a1a}
.vu-row.top span.on{background:linear-gradient(#2f2,#0a0)}
.vu-row.bot span.on{background:linear-gradient(#6cf,#09a)}
.vu-row span.on.warn{background:#ff0 !important}
.vu-row span.on.peak{background:#f22 !important}
.vu-labels{display:flex;justify-content:space-between;margin-top:6px;font-size:.65rem;color:#888;font-weight:900}
.vu-labels .live{color:#00ff66}
.track{margin-top:14px;display:flex;gap:14px;align-items:center;background:rgba(0,0,0,.6);padding:12px;border-radius:12px;text-align:left}
.track img{width:90px;height:90px;border-radius:12px;object-fit:cover;background:#222;box-shadow:0 0 10px rgba(0,0,0,.6)}
.track-title{color:#ffe600;font-weight:900;font-size:1.15rem}
.track-artist{color:#ffb3d9;font-size:.95rem;margin-top:3px}
.footer{margin-top:14px;font-size:.7rem;color:#aaa}
.footer a{color:#ffe600}
</style>
</head>
<body>
<div class="container">
<img src="RADIO SISTEMA 3.jpeg" class="logo">
<h1>SOUL FUNK</h1>
<div class="sub">Canale 2 - Radio Sistema 3</div>
<div class="live">💗 SOUL ON AIR</div>

<div class="btns">
<a class="main" href="index.html">MAIN</a>
<a class="soul">SOUL FUNK</a>
</div>

<div class="box">
<audio id="player" controls playsinline autoplay crossorigin="anonymous" preload="auto">
  <source src="https://control.myshoutca.st/proxy/tbqmsenb/stream" type="audio/mpeg">
</audio>

<div class="vu">
<div class="vu-bars">
<div class="vu-row top" id="rowTop"></div>
<div class="vu-row bot" id="rowBot"></div>
</div>
<div class="vu-labels"><div>L • R STEREO</div><div class="live">● LIVE</div></div>
</div>

<div class="track">
<img id="cover" src="RADIO SISTEMA 3.jpeg" alt="cover">
<div>
<div id="title" class="track-title">Radio Sistema 3</div>
<div id="artist" class="track-artist">Soul Funk in onda</div>
</div>
</div>
</div>

<div class="footer">© Radio Sistema 3 - SIAE n°202600000389<br><br><a href="index.html">⬅ Torna a MAIN</a></div>
</div>

<script>
const player=document.getElementById('player');
const titleEl=document.getElementById('title');
const artistEl=document.getElementById('artist');
const coverEl=document.getElementById('cover');
const rowTop=document.getElementById('rowTop');
const rowBot=document.getElementById('rowBot');
const SEG=22;
for(let i=0;i<SEG;i++){ rowTop.appendChild(document.createElement('span')); rowBot.appendChild(document.createElement('span')); }

window.addEventListener('DOMContentLoaded', async()=>{ try{ await player.play(); }catch(e){} });

// LEVEL STEREO UGUALI - non con differenza enorme
let audioCtx, analyser, data;
function initMeter(){
  try{
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    const src=audioCtx.createMediaElementSource(player);
    analyser=audioCtx.createAnalyser(); analyser.fftSize=256;
    src.connect(analyser); analyser.connect(audioCtx.destination);
    data=new Uint8Array(analyser.frequencyBinCount);
    requestAnimationFrame(updateMeter);
  }catch(e){}
}
function updateMeter(){
  requestAnimationFrame(updateMeter);
  if(!analyser) return;
  analyser.getByteFrequencyData(data);
  let avg=data.reduce((a,b)=>a+b,0)/data.length/255;
  // level L e R quasi uguali, piccola variazione stereo
  let left = Math.min(1, avg*1.4 + Math.random()*0.08);
  let right = Math.min(1, avg*1.4 + Math.random()*0.08);
  let l = Math.floor(left*SEG);
  let r = Math.floor(right*SEG);
  rowTop.querySelectorAll('span').forEach((s,i)=>{ s.className = i<l ? (i>18?'on peak':i>15?'on warn':'on') : ''; });
  rowBot.querySelectorAll('span').forEach((s,i)=>{ s.className = i<r ? (i>18?'on peak':i>15?'on warn':'on') : ''; });
}
player.addEventListener('play', ()=>{ if(!audioCtx) initMeter(); if(audioCtx && audioCtx.state==='suspended') audioCtx.resume(); });

// BRANO + COPERTINA sotto il player
async function getTitle(){
  try{
    let r=await fetch('https://api.allorigins.win/get?url='+encodeURIComponent('https://control.myshoutca.st/proxy/tbqmsenb/7.html?_='+Date.now()));
    let j=await r.json(); let txt=j.contents||""; let p=txt.split(','); let brano=p.slice(6).join(',').trim(); if(brano) return brano;
  }catch(e){} return "";
}
async function aggiorna(){
  try{
    let brano=await getTitle(); if(!brano || brano.length<3) return;
    let artista=""; let titolo=brano;
    if(brano.includes(" - ")){ let s=brano.split(" - "); artista=s[0]; titolo=s.slice(1).join(" - "); }
    if(titolo!==titleEl.textContent){
      titleEl.textContent=titolo; artistEl.textContent=artista||"Soul Funk";
      try{
        let q=encodeURIComponent((artista+" "+titolo).trim());
        let ri=await fetch('https://itunes.apple.com/search?term='+q+'&media=music&limit=1');
        let ji=await ri.json();
        if(ji.results && ji.results[0] && ji.results[0].artworkUrl100) coverEl.src=ji.results[0].artworkUrl100.replace('100x100','600x600');
      }catch(e){}
    }
  }catch(e){}
}
aggiorna(); setInterval(aggiorna,10000);
</script>
</body>
</html>
