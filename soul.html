<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOUL FUNK</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:url('soul-funk.jpeg') no-repeat center center fixed;background-size:cover;background-color:#140a2a;font-family:Arial,sans-serif;color:white;text-align:center;min-height:100vh}
.overlay{background:rgba(8,0,20,.55);min-height:100vh;padding:8px;display:flex;align-items:center;justify-content:center}
.container{width:92%;max-width:360px;padding:14px;background:rgba(0,0,0,.62);border-radius:18px;border:1.5px solid #ff3b9a;box-shadow:0 0 18px rgba(255,59,154,.4)}
.logo{width:58px;border-radius:10px;background:white;padding:2px}
h1{color:#ffe600;font-size:1.6rem;margin-top:4px;text-shadow:0 0 8px #ff3b9a;line-height:1}
.sub{font-size:.75rem;color:#ddd;margin-top:2px}
.live{color:#ff3b9a;font-weight:900;font-size:.8rem;margin-top:2px}
.btns{display:flex;gap:8px;justify-content:center;margin:10px 0}
.btns a{padding:7px 16px;border-radius:20px;text-decoration:none;font-weight:900;font-size:.75rem}
.main{background:white;color:black}
.soul{background:#ff3b9a;color:white;border:1.5px solid #ffe600}
.box{background:rgba(0,0,0,.65);padding:10px;border-radius:12px;border:1px solid rgba(255,59,154,.25)}
audio{width:100%;height:32px;border-radius:8px}
.vu{margin-top:8px;background:#0a0a0a;border-radius:8px;padding:6px;border:1px solid #333}
.vu-row{display:flex;gap:2px}
.vu-row span{flex:1;height:10px;border-radius:1px;background:#1e1e1e}
.vu-row.top span.on{background:#0f0}
.vu-row.bot span.on{background:#0af}
.vu-labels{display:flex;justify-content:space-between;margin-top:4px;font-size:.55rem;color:#aaa;font-weight:900}
.vu-labels .live{color:#00ff66}
.track{margin-top:8px;display:flex;gap:8px;align-items:center;background:rgba(20,20,20,.9);padding:8px;border-radius:10px;text-align:left}
.track img{width:54px;height:54px;border-radius:8px;object-fit:cover;background:#222}
.track-title{color:#ffe600;font-weight:900;font-size:.85rem;line-height:1.1}
.track-artist{color:#ffb3d9;font-size:.7rem;margin-top:2px}
.footer{margin-top:8px;font-size:.55rem;color:#ddd}
.footer a{color:#ffe600;text-decoration:none;font-weight:900}
</style>
</head>
<body>
<div class="overlay">
<div class="container">
<img src="RADIO SISTEMA 3.jpeg" class="logo">
<h1>SOUL FUNK</h1>
<div class="sub">Canale 2 - Radio Sistema 3</div>
<div class="live">💗 SOUL ON AIR</div>
<div class="btns"><a class="main" href="index.html">MAIN</a><a class="soul">SOUL FUNK</a></div>
<div class="box">
<audio id="player" controls playsinline autoplay crossorigin="anonymous" preload="auto">
<source src="https://control.myshoutca.st/proxy/tbqmsenb/stream" type="audio/mpeg">
</audio>
<div class="vu"><div class="vu-bars"><div class="vu-row top" id="rowTop"></div><div class="vu-row bot" id="rowBot"></div></div><div class="vu-labels"><div>L • R STEREO</div><div class="live">● LIVE</div></div></div>
<div class="track"><img id="cover" src="RADIO SISTEMA 3.jpeg"><div><div id="title" class="track-title">Soul Funk</div><div id="artist" class="track-artist">Caricamento...</div></div></div>
</div>
<div class="footer">© Radio Sistema 3 - SIAE n°202600000389<br><a href="index.html">⬅ Torna a MAIN</a></div>
</div>
</div>
<script>
const player=document.getElementById('player'),titleEl=document.getElementById('title'),artistEl=document.getElementById('artist'),coverEl=document.getElementById('cover'),rowTop=document.getElementById('rowTop'),rowBot=document.getElementById('rowBot');
const SEG=22; for(let i=0;i<SEG;i++){rowTop.appendChild(document.createElement('span'));rowBot.appendChild(document.createElement('span'));}
let ac,an,d;
function init(){try{ac=new(window.AudioContext||window.webkitAudioContext)();let s=ac.createMediaElementSource(player);an=ac.createAnalyser();an.fftSize=256;s.connect(an);an.connect(ac.destination);d=new Uint8Array(an.frequencyBinCount);loop()}catch(e){}}
function loop(){requestAnimationFrame(loop);if(!an)return;an.getByteFrequencyData(d);let avg=d.reduce((a,b)=>a+b,0)/d.length/255;let l=Math.floor(avg*1.4*SEG),r=Math.floor((avg*1.35+Math.random()*0.1)*SEG);rowTop.querySelectorAll('span').forEach((e,i)=>{e.className=i<l?'on':''});rowBot.querySelectorAll('span').forEach((e,i)=>{e.className=i<r?'on':''})}
player.addEventListener('play',()=>{if(!ac)init();if(ac&&ac.state==='suspended')ac.resume()});

// TITOLO FIX - prova diretto + proxy
async function getSong(){
 const urls=[
  'https://control.myshoutca.st/proxy/tbqmsenb/currentsong?sid=1',
  'https://api.allorigins.win/raw?url=https://control.myshoutca.st/proxy/tbqmsenb/currentsong?sid=1',
  'https://corsproxy.io/?https://control.myshoutca.st/proxy/tbqmsenb/currentsong?sid=1'
 ];
 for(let u of urls){
  try{
   let r=await fetch(u+'&_='+Date.now(),{cache:'no-store'});
   let t=await r.text();
   t=t.trim();
   if(t && t.length>2 && !t.includes('<html') && !t.includes('DOCTYPE')) return t;
  }catch(e){}
 }
 return "";
}
async function up(){
 let b=await getSong();
 if(!b) return;
 let art="",tit=b;
 if(b.includes(" - ")){let s=b.split(" - ");art=s[0];tit=s.slice(1).join(" - ")}
 titleEl.textContent=tit;
 artistEl.textContent=art||"Soul Funk";
 try{
  let q=encodeURIComponent(b);
  let r=await fetch('https://itunes.apple.com/search?term='+q+'&limit=1&media=music');
  let j=await r.json();
  if(j.results[0]&&j.results[0].artworkUrl100) coverEl.src=j.results[0].artworkUrl100.replace('100x100','300x300');
 }catch(e){}
}
up();setInterval(up,6000);
</script>
</body>
</html>
