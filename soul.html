<body>
<div class="container">
<div class="logo-wrap"><img src="RADIO SISTEMA 3.jpeg" alt="Radio Sistema 3" class="logo"></div>

<div class="live">💗 SOUL ON AIR</div>
<div id="popupBrand">RADIO SISTEMA 3 - SOUL FUNK</div>

<a id="btnMain" class="ch-btn ch-main" href="index.html">MAIN</a>

</div>

<div class="vu-wrap"><canvas id="vuCanvas" width="600" height="32"></canvas><div class="vu-label"><span>L ● R STEREO</span><span id="vuPeak" style="color:#ff3b9a">STOP</span></div></div>
<button id="btnPopup" onclick="apriPopupPlayer()" style="margin-top:12px;background:#ff3b9a;color:#fff;font-weight:bold;padding:10px 20px;border:none;border-radius:30px;cursor:pointer;">⧉ APRI POPUP PLAYER</button>

<div id="novitaSection"><div class="section-title" style="text-align:center">🔥 Playlist Soul</div><div id="novitaPlayerMain"></div><div id="novitaList"></div><div style="text-align:center"><button style="background:#2a2a2a;color:#fff;margin-top:14px;padding:8px 20px;border:none;border-radius:20px;cursor:pointer;font-weight:bold" onclick="chiudiNovita()">✕ Chiudi</button></div></div>

</div>
<script>
let popupWin = null;
const STREAM_URL = "https://control.myshoutca.st/proxy/tbqmsenb/stream";
function apriNovita(){ document.getElementById('radioAudio').pause(); document.getElementById('novitaSection').style.display='block'; document.getElementById('btnNovita').style.display='none'; document.getElementById('novitaPlayerMain').innerHTML = PLACEHOLDER_HTML; renderNovita(); }
function chiudiNovita(){ document.getElementById('novitaPlayerMain').innerHTML = PLACEHOLDER_HTML; document.getElementById('novitaList').innerHTML = ""; document.getElementById('novitaList').dataset.done = "0"; document.getElementById('novitaSection').style.display='none'; document.getElementById('btnNovita').style.display='inline-block'; document.getElementById('radioAudio').play().catch(()=>{}); }
function playNovita(id, el){ document.getElementById('radioAudio').pause(); document.querySelectorAll('.novita-row').forEach(x=>x.classList.remove('active')); el.classList.add('active'); document.getElementById('novitaPlayerMain').innerHTML='<iframe src="https://www.youtube.com/embed/'+id+'?autoplay=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>'; }
function renderNovita(){ const c=document.getElementById('novitaList'); if(c.dataset.done=="1") return; c.dataset.done="1"; c.innerHTML = BRANI_NOVITA.map(b=>`<div class="novita-row" onclick="playNovita('${b.id}', this)"><img src="https://i.ytimg.com/vi/${b.id}/hqdefault.jpg"><div><b>${b.artista}</b><br><span>${b.titolo}</span></div><div style="margin-left:auto;color:#ff2040;font-size:1.1rem">▶</div></div>`).join(''); }
function setupChannelNav(){
  const isPopup = window.location.search.includes('popup=1');
  const btnMain = document.getElementById('btnMain');
  const btnSoul = document.getElementById('btnSoul');
  if(isPopup){
    btnMain.href = 'index.html?popup=1';
    btnSoul.href = 'soul.html?popup=1';
    [btnMain, btnSoul].forEach(btn=>{
      btn.addEventListener('click', function(e){
        e.preventDefault();
        window.location.href = this.getAttribute('href');
      });
    });
  }
}
function apriPopupPlayer(){ if(window.innerWidth <= 768) return; document.getElementById('radioAudio').pause(); popupWin = window.open(window.location.href.split('?')[0] + '?popup=1&v=32', 'RadioSistema3SoulPopup', 'width=380,height=380,top=50,left=50,resizable=yes,scrollbars=no'); let checkChiuso = setInterval(()=>{ if(popupWin && popupWin.closed){ clearInterval(checkChiuso); popupWin = null; document.getElementById('radioAudio').play().catch(()=>{}); } }, 800); }
function cleanWhiteBorder(img){
  if(img.dataset.cleaned==="1") return;
  const finalSize=window.location.search.includes('popup=1')?62:82;
  img.dataset.cleaned="1";
  img.style.width=finalSize+"px";img.style.height=finalSize+"px";img.style.minWidth=finalSize+"px";img.style.maxWidth=finalSize+"px";img.style.objectFit="cover";img.style.borderRadius="8px";img.style.display="block";img.style.opacity="1";img.style.background="#000";
  if(img.src.includes('shoutca') || img.src.startsWith('http')) return;
}
const list=document.querySelector('.cc_recenttracks_list');
if(list){
  const observer=new MutationObserver(()=>{
    const imgs=document.querySelectorAll('.cc_recenttracks_list img');
    imgs.forEach(cleanWhiteBorder);
    const container=document.querySelector('.cc_recenttracks_list');
    if(container) container.style.flexDirection='row';
  });
  observer.observe(list,{childList:true,subtree:true,attributes:true});
  setInterval(()=>{document.querySelectorAll('.cc_recenttracks_list img').forEach(cleanWhiteBorder);},800);
}
const vuCanvas = document.getElementById('vuCanvas'); const vuCtx = vuCanvas.getContext('2d'); const radioEl = document.getElementById('radioAudio'); const vuPeakEl = document.getElementById('vuPeak');
let isPlayingVU=false, levelL=0, levelR=0;
function drawStereo(){ const W=vuCanvas.width, H=vuCanvas.height; vuCtx.clearRect(0,0,W,H); vuCtx.fillStyle='#0a0a0a'; vuCtx.fillRect(0,0,W,H); let bars=36, barW=W/bars, gap=1.5, rowH=H/2-2; let activeL=Math.floor((levelL/100)*bars); for(let i=0;i<bars;i++){ let x=i*barW; let lit=i<activeL; let color=i<bars*0.6?(lit?'#00ff2a':'#001a05'):i<bars*0.84?(lit?'#ffea00':'#1a1a00'):(lit?'#ff1a1a':'#1a0000'); vuCtx.fillStyle=color; let y=1; let bh=lit?rowH-1:rowH*0.4; vuCtx.fillRect(x+gap, y+(rowH-bh)/2, barW-gap*2, bh); } vuCtx.fillStyle='#333'; vuCtx.fillRect(0, H/2-0.5, W, 1); let activeR=Math.floor((levelR/100)*bars); for(let i=0;i<bars;i++){ let x=i*barW; let lit=i<activeR; let color=i<bars*0.6?(lit?'#ff3b9a':'#1a0010'):i<bars*0.84?(lit?'#ffea00':'#1a1a00'):(lit?'#ff1a1a':'#1a0000'); vuCtx.fillStyle=color; let y=H/2+1; let bh=lit?rowH-1:rowH*0.4; vuCtx.fillRect(x+gap, y+(rowH-bh)/2, barW-gap*2, bh); } requestAnimationFrame(drawStereo); }
function updateStereo(){ 
  if(!isPlayingVU){ levelL+=(0-levelL)*0.08; levelR+=(0-levelR)*0.08; return; } 
  const isPopup = window.location.search.includes('popup=1');
  if(isPopup){
    let isPeak = Math.random() < 0.07;
    if(isPeak){ levelL = 78 + Math.random()*18; levelR = 76 + Math.random()*18; }
    else { let base = 32 + Math.random()*18; let targetL = base + Math.random()*10; let targetR = base*0.9 + Math.random()*10; levelL += (targetL - levelL) * 0.20; levelR += (targetR - levelR) * 0.18; }
    return;
  }
  let base = 40 + Math.random()*45;
  let isPeak = Math.random() < 0.18;
  let targetL = isPeak ? 88 + Math.random()*12 : base + Math.random()*18;
  let targetR = isPeak ? 85 + Math.random()*15 : base*0.9 + Math.random()*20;
  levelL+=(targetL-levelL)*0.38; levelR+=(targetR-levelR)*0.34; 
}
let lastPause = 0; let isForcing = false;
function forzaLive(){ if(isForcing) return; isForcing = true; radioEl.pause(); radioEl.src = STREAM_URL + "?live=" + Date.now(); radioEl.load(); radioEl.play().catch(()=>{}).finally(()=>{ setTimeout(()=>{ isForcing=false; }, 1200); }); }
radioEl.addEventListener('pause', ()=>{ lastPause = Date.now(); isPlayingVU=false; vuPeakEl.textContent="STOP"; });
radioEl.addEventListener('play', ()=>{ isPlayingVU=true; vuPeakEl.textContent="● LIVE"; if(popupWin && !popupWin.closed){ popupWin.close(); popupWin = null; } if(!isForcing && lastPause > 0 && (Date.now() - lastPause > 15000)){ forzaLive(); return; } const s = document.createElement('script'); s.src = 'https://manage.myshoutca.st/system/recenttracks.js?play_now=' + Date.now(); document.head.appendChild(s); setTimeout(()=>s.remove(), 3000); });
drawStereo(); setInterval(updateStereo, 70);
document.getElementById('novitaPlayerMain').innerHTML = PLACEHOLDER_HTML;
if(window.location.search.includes('play=1')){ setTimeout(()=>{ radioEl.play().catch(()=>{}); }, 500); }
document.addEventListener('DOMContentLoaded', setupChannelNav);
setupChannelNav();
</script>
</body>
