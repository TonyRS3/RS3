<script>
// STESSO CODICE PULIZIA COPERTINA DEL MAIN - funziona identico
function cleanWhiteBorder(img){
 if(img.dataset.cleaned==="1") return; img.dataset.cleaned="1";
 const finalSize=82;
 const tempImg=new Image(); tempImg.crossOrigin="anonymous";
 tempImg.onload=function(){
  const w=tempImg.width,h=tempImg.height;
  const canvas=document.createElement('canvas');const ctx=canvas.getContext('2d');
  canvas.width=w;canvas.height=h;ctx.drawImage(tempImg,0,0);
  const data=ctx.getImageData(0,0,w,h).data;
  let top=0,bottom=h,left=0,right=w;
  for(let y=0;y<h;y++){let whiteRow=true;for(let x=0;x<w;x++){const i=(y*w+x)*4;if(data[i]<230||data[i+1]<230||data[i+2]<230){whiteRow=false;break;}}if(!whiteRow){top=y;break;}}
  for(let y=h-1;y>=0;y--){let whiteRow=true;for(let x=0;x<w;x++){const i=(y*w+x)*4;if(data[i]<230||data[i+1]<230||data[i+2]<230){whiteRow=false;break;}}if(!whiteRow){bottom=y+1;break;}}
  for(let x=0;x<w;x++){let whiteCol=true;for(let y=top;y<bottom;y++){const i=(y*w+x)*4;if(data[i]<230||data[i+1]<230||data[i+2]<230){whiteCol=false;break;}}if(!whiteCol){left=x;break;}}
  for(let x=w-1;x>=0;x--){let whiteCol=true;for(let y=top;y<bottom;y++){const i=(y*w+x)*4;if(data[i]<230||data[i+1]<230||data[i+2]<230){whiteCol=false;break;}}if(!whiteCol){right=x+1;break;}}
  const cw=right-left,ch=bottom-top;
  const out=document.createElement('canvas');out.width=finalSize;out.height=finalSize;const octx=out.getContext('2d');
  octx.drawImage(canvas,left,top,cw,ch,0,0,finalSize,finalSize);
  img.src=out.toDataURL('image/jpeg',0.92);
  img.style.width=finalSize+"px";img.style.height=finalSize+"px";img.style.objectFit="cover";img.style.borderRadius="6px";img.style.display="inline-block";img.style.opacity="1";
 };
 tempImg.src=img.src;
}
const list=document.querySelector('.cc_recenttracks_list');
if(list){
 new MutationObserver(()=>{document.querySelectorAll('.cc_recenttracks_list img').forEach(cleanWhiteBorder);}).observe(list,{childList:true,subtree:true});
 setInterval(()=>{document.querySelectorAll('.cc_recenttracks_list img').forEach(cleanWhiteBorder);},1200);
}

// VU STEREO UGUALE - come MAIN, non più mono sbilanciato
const vuCanvas=document.getElementById('vuCanvas');const vuCtx=vuCanvas.getContext('2d');
let levelL=0,levelR=0,isPlayingVU=true;
function drawStereo(){
 const W=vuCanvas.width,H=vuCanvas.height;vuCtx.clearRect(0,0,W,H);vuCtx.fillStyle='#0a0a0a';vuCtx.fillRect(0,0,W,H);
 let bars=32,barW=W/bars,gap=1.5,rowH=H/2-2;
 let activeL=Math.floor((levelL/100)*bars);
 for(let i=0;i<bars;i++){let x=i*barW;let lit=i<activeL;let color=i<bars*0.6?(lit?'#00ff2a':'#001a05'):i<bars*0.84?(lit?'#ffea00':'#1a1a00'):(lit?'#ff1a1a':'#1a0000');vuCtx.fillStyle=color;vuCtx.fillRect(x+gap,1,barW-gap*2,lit?rowH-1:rowH*0.4);}
 vuCtx.fillStyle='#333';vuCtx.fillRect(0,H/2-0.5,W,1);
 let activeR=Math.floor((levelR/100)*bars);
 for(let i=0;i<bars;i++){let x=i*barW;let lit=i<activeR;let color=i<bars*0.6?(lit?'#00d4ff':'#001a1a'):i<bars*0.84?(lit?'#ffea00':'#1a1a00'):(lit?'#ff1a1a':'#1a0000');vuCtx.fillStyle=color;vuCtx.fillRect(x+gap,H/2+1,barW-gap*2,lit?rowH-1:rowH*0.4);}
 requestAnimationFrame(drawStereo);
}
function updateStereo(){
 let base=22+Math.random()*30;
 let targetL=base+Math.random()*18;
 let targetR=base+Math.random()*18; // UGUALE, non sbilanciato
 levelL+=(targetL-levelL)*0.3; levelR+=(targetR-levelR)*0.3;
}
drawStereo();setInterval(updateStereo,70);
</script>
