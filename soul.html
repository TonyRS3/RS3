<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOUL FUNK - Radio Sistema 3</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial;background:#1a0a1a;color:white;text-align:center}
.container{max-width:520px;margin:10px auto;padding:15px;background:rgba(0,0,0,.4);border-radius:20px;border:2px solid #ff3b9a}
.logo{width:200px;border-radius:15px}
h1{color:#ffe600;margin-top:8px}
.track{display:flex;gap:12px;align-items:center;background:rgba(0,0,0,.7);padding:12px;border-radius:14px;text-align:left;margin-top:12px}
.track img{width:75px;height:75px;border-radius:10px;object-fit:cover;background:#333}
.track-title{color:#ffe600;font-weight:900}
.track-artist{color:#ffb3d9;font-size:.9rem}
.play-btn{width:100%;padding:18px;background:#ff3b9a;color:white;border:none;border-radius:40px;font-weight:900;font-size:1.3rem;margin:14px 0}
audio{width:100%}
#msg{color:#ffe600;font-size:.85rem;margin-top:8px;min-height:18px}
</style>
</head>
<body>
<div class="container">
<img src="RADIO SISTEMA 3.jpeg" class="logo">
<h1>SOUL FUNK</h1>
<p>Canale 2 - Radio Sistema 3</p>
<p style="color:#ff3b9a;font-weight:900">💗 SOUL ON AIR</p>

<div style="margin:12px"><a href="index.html" style="background:white;color:black;padding:10px 22px;border-radius:25px;text-decoration:none;font-weight:900">MAIN</a> <span style="background:#ff3b9a;padding:10px 22px;border-radius:25px;font-weight:900;border:2px solid yellow">SOUL FUNK</span></div>

<div class="track">
<img id="cover" src="RADIO SISTEMA 3.jpeg">
<div><div id="title" class="track-title">Tocca PLAY qui sotto</div><div id="artist" class="track-artist">Caricamento...</div></div>
</div>

<button id="playBtn" class="play-btn">▶ TAPPA PER ASCOLTARE</button>

<audio id="player" controls playsinline crossorigin="anonymous" preload="none"></audio>
<div id="msg">Pronto - Tappa il bottone rosa</div>

<p style="margin-top:14px;font-size:.7rem;color:#aaa">© Radio Sistema 3 - SIAE 202600000389<br><a href="index.html" style="color:#ffe600">⬅ Torna a MAIN</a></p>
</div>

<script>
const player = document.getElementById('player');
const btn = document.getElementById('playBtn');
const msg = document.getElementById('msg');
const titleEl = document.getElementById('title');
const artistEl = document.getElementById('artist');
const coverEl = document.getElementById('cover');

// LINK HTTPS che funzionano su PC e telefonino (in ordine)
const STREAMS = [
  "https://control.myshoutca.st/proxy/tbqmsenb/stream?mp3",
  "https://control.myshoutca.st/proxy/tbqmsenb/stream",
  "https://control.myshoutca.st/proxy/tbqmsenb/;stream.mp3",
  "https://control.myshoutca.st/proxy/tbqmsenb/mp3"
];
let idx = 0;

function loadStream(i){
  idx = i;
  player.src = STREAMS[idx] + "&_=" + Date.now();
  player.load();
  msg.textContent = "Collego al server Soul... " + (idx+1) + "/" + STREAMS.length;
}

loadStream(0);

btn.onclick = async () => {
  try{
    await player.play();
    btn.textContent = "● IN ONDA";
    btn.style.background = "green";
    msg.textContent = "In riproduzione - Soul Funk";
  }catch(e){
    msg.textContent = "Tocca di nuovo PLAY - il browser ha bloccato";
    setTimeout(()=>player.play().catch(()=>{}), 300);
  }
};

player.addEventListener('play', ()=>{ btn.textContent="● IN ONDA"; btn.style.background="green"; msg.textContent="In riproduzione"; });
player.addEventListener('pause', ()=>{ btn.textContent="▶ TAPPA PER ASCOLTARE"; btn.style.background="#ff3b9a"; });

player.addEventListener('error', ()=>{
  if(idx < STREAMS.length-1){
    msg.textContent = "Link " + (idx+1) + " bloccato, provo il prossimo...";
    loadStream(idx+1);
    player.play().catch(()=>{});
  } else {
    msg.textContent = "⚠️ Nessun link https risponde. Apri: " + STREAMS[0];
  }
});

async function aggiorna(){
  try{
    let r = await fetch('https://api.allorigins.win/get?url='+encodeURIComponent('https://control.myshoutca.st/proxy/tbqmsenb/7.html?_='+Date.now()));
    let j = await r.json(); let txt = j.contents||""; let p = txt.split(','); let brano = p.slice(6).join(',').trim();
    if(!brano) return;
    let artista=""; let titolo=brano;
    if(brano.includes(" - ")){ let s=brano.split(" - "); artista=s[0]; titolo=s.slice(1).join(" - "); }
    if(titolo !== titleEl.textContent && titolo.length>2){
      titleEl.textContent = titolo;
      artistEl.textContent = artista || "Soul Funk";
      try{
        let q = encodeURIComponent(artista+" "+titolo);
        let ri = await fetch('https://itunes.apple.com/search?term='+q+'&media=music&limit=1');
        let ji = await ri.json();
        if(ji.results && ji.results[0] && ji.results[0].artworkUrl100){
          coverEl.src = ji.results[0].artworkUrl100.replace('100x100','600x600');
        }
      }catch(e){}
    }
  }catch(e){}
}
aggiorna(); setInterval(aggiorna, 10000);
</script>
</body>
</html>
