<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOUL FUNK</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial;color:white;text-align:center;background:#111}
.container{max-width:500px;margin:15px auto;padding:20px;background:rgba(255,59,154,.15);border-radius:20px;border:2px solid #ff3b9a}
.logo{width:150px;border-radius:15px}
h1{color:#ffe600;margin-top:10px}
#playBtn{width:100%;padding:18px;background:#ff3b9a;color:white;border:none;border-radius:40px;font-weight:900;font-size:1.3rem;margin:15px 0}
.track-box{display:flex;gap:10px;align-items:center;background:rgba(0,0,0,.5);padding:10px;border-radius:10px;text-align:left;margin-bottom:10px}
.track-box img{width:60px;height:60px;border-radius:8px}
audio{width:100%;margin-top:10px}
</style>
</head>
<body>
<div class="container">
<img src="RADIO SISTEMA 3.jpeg" class="logo">
<h1>SOUL FUNK</h1>
<p>Canale 2 - Radio Sistema 3</p>
<p style="color:#ff3b9a;font-weight:bold;margin-top:8px">💗 SOUL ON AIR</p>

<div style="margin:20px 0">
<a href="index.html" style="background:white;color:black;padding:10px 20px;border-radius:20px;text-decoration:none;font-weight:bold">MAIN</a>
<a style="background:#ff3b9a;color:white;padding:10px 20px;border-radius:20px;font-weight:bold;margin-left:10px;border:2px solid yellow">SOUL FUNK</a>
</div>

<div class="track-box">
<img id="cover" src="RADIO SISTEMA 3.jpeg">
<div>
<div id="npTitle" style="color:#ffe600;font-weight:bold">Tocca PLAY qui sotto</div>
<div id="npArtist" style="color:#ffb3d9;font-size:.8rem">Radio Sistema 3</div>
</div>
</div>

<button id="playBtn">▶ TAPPA QUI PER ASCOLTARE</button>

<audio id="radioAudio" controls playsinline preload="none"></audio>

<p id="status" style="font-size:.8rem;color:#aaa;margin-top:10px">Pronto</p>
</div>

<script>
const aud = document.getElementById('radioAudio');
const btn = document.getElementById('playBtn');
const status = document.getElementById('status');
const titleEl = document.getElementById('npTitle');
const artistEl = document.getElementById('npArtist');
const cover = document.getElementById('cover');

// LISTA LINK - prova uno dopo l'altro
const LINKS = [
  "https://control.myshoutca.st/proxy/tbqmsenb/stream",
  "https://control.myshoutca.st/proxy/tbqmsenb/mp3",
  "https://control.myshoutca.st/proxy/tbqmsenb/;stream.mp3",
  "http://manage.myshoutca.st:8060/stream/1/"
];
let current = 0;

function setStream(n){
  current = n;
  aud.src = LINKS[current] + "?t=" + Date.now();
  aud.load();
  status.textContent = "Provo connessione " + (current+1) + "/" + LINKS.length + "...";
}

setStream(0);

btn.onclick = async () => {
  try{
    await aud.play();
    btn.textContent = "● IN ONDA - TOCCA PER FERMAR";
    btn.style.background = "green";
    status.textContent = "In riproduzione";
  }catch(e){
    status.textContent = "Tocca di nuovo, il telefono blocca l'audio";
  }
};

aud.onpause = () => { btn.textContent="▶ TAPPA QUI PER ASCOLTARE"; btn.style.background="#ff3b9a"; }
aud.onplay = () => { btn.textContent="● IN ONDA"; btn.style.background="green"; }

// Se gira a vuoto o errore, cambia link da solo
aud.addEventListener('error', () => {
  status.textContent = "Link bloccato, provo altro...";
  if(current < LINKS.length-1){ setStream(current+1); aud.play().catch(()=>{}); }
  else { status.textContent = "Nessun link funziona, ricarica pagina"; }
});
aud.addEventListener('stalled', () => {
  if(aud.currentTime < 1 && current < LINKS.length-1){
    setStream(current+1);
    aud.play().catch(()=>{});
  }
});

// Brano
async function brano(){
  try{
    let r = await fetch('https://control.myshoutca.st/proxy/tbqmsenb/7.html',{cache:'no-store'});
    let t = await r.text();
    let p = t.split(',');
    let br = p.slice(6).join(',').trim();
    if(br){
      if(br.includes(" - ")){ let s=br.split(" - "); artistEl.textContent=s[0]; titleEl.textContent=s.slice(1).join(" - "); }
      else titleEl.textContent=br;
    }
  }catch(e){}
}
brano(); setInterval(brano,15000);
</script>
</body>
</html>
