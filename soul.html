</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Segoe UI,Arial,sans-serif;color:white;text-align:center;background:linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.55)),url("studio-radio.jpeg");background-size:cover;background-position:center;background-attachment:fixed;}
.container{max-width:900px;margin:25px auto;padding:30px;background:rgba(255,255,255,.08);backdrop-filter:blur(8px);border-radius:25px;border:1px solid #7b1fa2;}
.logo-wrap{display:inline-block;padding:5px;border-radius:26px;background:linear-gradient(135deg,#7b1fa2,#4a148c,#ffb300,#7b1fa2);background-size:300% 300%;animation:gradientMove 4s ease infinite;}
@keyframes gradientMove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.logo{width:260px;height:260px;object-fit:cover;border-radius:20px;display:block;background:#fff;}
h1{margin-top:20px;font-size:3rem;color:#9c27b0;}
.live{margin-top:15px;color:#ce93d8;font-size:1.6rem;font-weight:bold;animation:pulse 1.4s infinite;}
@keyframes pulse{0%{opacity:1}50%{opacity:.4}100%{opacity:1}}
.player-box{margin-top:15px;background:rgba(255,255,255,.10);padding:12px;border-radius:20px;width:400px;max-width:92%;margin:0 auto;}
.section-title{font-size:1.4rem;margin-bottom:8px;color:#ffb300;}
audio{width:100%;max-width:340px;height:44px;background:#000;border-radius:8px;}
.cc_recenttracks_list{margin-top:8px !important;color:white !important;text-align:left !important;max-width:400px !important;margin-left:auto !important;margin-right:auto !important;background:rgba(0,0,0,0.65) !important;padding:10px 12px !important;border-radius:14px !important;display:flex !important;flex-direction:row !important;align-items:center !important;gap:12px !important;min-height:90px !important;}
.cc_recenttracks_list img{width:82px !important;height:82px !important;min-width:82px !important;max-width:82px !important;object-fit:cover !important;border-radius:8px !important;display:block !important;opacity:1 !important;background:#000 !important;border:none !important;}
.cc_recenttracks_list *{color:white !important;line-height:1.25 !important;font-size:0.92rem !important;text-align:left !important;}
.cc_recenttracks_list .ccbuy{display:none !important;}
.btn-novita{margin-top:20px;background:#7b1fa2;color:#fff;font-weight:900;padding:14px 26px;border:none;border-radius:50px;font-size:1.1rem;cursor:pointer;box-shadow:0 0 15px rgba(123,31,162,.4)}
.vu-wrap{margin-top:10px;background:rgba(0,0,0,.75);padding:4px 6px;border-radius:8px;border:1px solid rgba(255,255,255,.2);max-width:320px;margin:auto;}
#vuCanvas{width:100%;height:32px;display:block;border-radius:4px;background:#0a0a0a;}
.vu-label{font-size:.65rem;color:#aaa;margin-top:2px;display:flex;justify-content:space-between;font-family:monospace;}
.ch-chooser{display:flex;gap:8px;justify-content:center;margin-bottom:12px}
.ch-btn{flex:1;padding:10px 0;border-radius:30px;border:none;font-weight:900;font-size:0.85rem;cursor:pointer;text-decoration:none;display:flex;align-items:center;justify-content:center}
.ch-main{background:#fff;color:#222}
.ch-soul{background:#7b1fa2;color:#fff;box-shadow:0 0 12px #7b1fa2}
.ch-btn.active{outline:3px solid #ffb300;transform:scale(1.05)}
#novitaSection{display:none;margin-top:20px;background:rgba(0,0,0,.60);padding:16px;border-radius:20px;border:1px solid rgba(255,255,255,.15);text-align:left}
#novitaPlayerMain{margin:0 auto 16px auto;max-width:520px}
#novitaPlayerMain iframe{width:100%;height:292px;border:none;border-radius:12px}
#novitaList{display:flex;flex-direction:column;gap:8px}
.novita-row{display:flex !important;flex-direction:row !important;align-items:center !important;gap:12px !important;background:rgba(0,0,0,.75) !important;padding:10px 14px !important;border-radius:12px !important;cursor:pointer !important;width:100% !important;border:1px solid rgba(255,255,255,.08) !important}
.novita-row:hover{background:rgba(123,31,162,.30) !important}
.novita-row.active{background:#7b1fa2 !important}
.novita-row img{width:56px !important;height:38px !important;border-radius:6px !important;object-fit:cover !important;flex-shrink:0 !important}
.novita-row b{color:#fff !important;font-size:1rem !important;font-weight:800 !important}
.novita-row span{color:#aaa !important;font-size:.82rem !important}
#btnTap{background:#ffb300;color:#000;font-weight:900;padding:14px 28px;border:none;border-radius:30px;cursor:pointer;font-size:1.1rem;margin-top:12px;width:92%;display:block;margin-left:auto;margin-right:auto;animation:pulse 1s infinite}
#statusLine{font-size:0.8rem;color:#ce93d8;margin-top:6px}
@media (max-width:768px){ #btnPopup{display:none !important;} }

<body>
<div class="container">
<div class="logo-wrap"><img src="RADIO SISTEMA 3.jpeg" alt="Radio Sistema 3" class="logo"></div>
<h1>SOUL FUNK</h1>
<div class="live">💜 SOUL ON AIR</div>

<div class="player-box">
<div class="ch-chooser">
<a class="ch-btn ch-main" href="index.html">MAIN</a>
<a class="ch-btn ch-soul active" href="soul.html">SOUL FUNK</a>
</div>
<div class="section-title">♪ Ascolta in diretta</div>
<audio id="radioAudio" controls playsinline preload="none"></audio>
<button id="btnTap" onclick="playSoul()">▶ TAP PER ASCOLTARE SOUL</button>
<div id="statusLine">Tocca TAP - obbligatorio su iPhone/Android</div>
<div class="vu-wrap"><canvas id="vuCanvas" width="600" height="32"></canvas><div class="vu-label"><span>L ● R STEREO</span><span id="vuPeak">STOP</span></div></div>
<button id="btnPopup" onclick="window.open('soul.html?popup=1','soulpopup','width=400,height=400')" style="margin-top:10px;background:#7b1fa2;color:#fff;font-weight:bold;padding:8px 16px;border:none;border-radius:20px;cursor:pointer;font-size:0.8rem">⧉ APRI POPUP PLAYER</button>
</div>

<div class="section-title" style="margin-top:18px;font-size:1.3rem">♪ Brano in onda</div>
<div class="cc_recenttracks_list" data-username="tbqmsenb"></div>

<button class="btn-novita" onclick="toggleNovita()">🎵 NOVITÀ MUSICALI</button>

<div id="novitaSection">
<div id="novitaPlayerMain"></div>
<div id="novitaList"></div>
</div>

<div style="margin-top:22px;font-size:0.85rem;opacity:0.7">© Radio Sistema 3 - Tutti i Diritti Riservati</div>
</div>

<script>
// STREAM FIX IPHONE - usa formato MP3 puro con ; per Shoutcast v1
const STREAMS = [
  "https://control.myshoutca.st/proxy/tbqmsenb/stream/;?type=mp3",
  "https://control.myshoutca.st/proxy/tbqmsenb/mp3"
];
const audio = document.getElementById('radioAudio');
const btnTap = document.getElementById('btnTap');
const statusLine = document.getElementById('statusLine');
const vuPeak = document.getElementById('vuPeak');
let playing=false;
let tryIdx=0;

function playSoul(){
  statusLine.textContent = "Connessione... tentativo " + (tryIdx+1);
  audio.src = STREAMS[tryIdx] + "&_=" + Date.now();
  audio.load();
  let p = audio.play();
  if(p){
    p.then(()=>{
      btnTap.style.display='none';
      statusLine.textContent='● LIVE SOUL FUNK';
      statusLine.style.color='#00ff2a';
      vuPeak.textContent='● LIVE';
      vuPeak.style.color='#00ff2a';
      playing=true;
    }).catch(err=>{
      console.log(err);
      tryIdx++;
      if(tryIdx < STREAMS.length){
        setTimeout(playSoul, 600);
      } else {
        statusLine.textContent='Errore stream - riprova TAP';
        btnTap.innerHTML='▶ RIPROVA TAP';
        tryIdx=0;
      }
    });
  }
}
audio.addEventListener('error', ()=>{
  if(tryIdx < STREAMS.length-1){ tryIdx++; playSoul(); }
});
audio.addEventListener('pause', ()=>{ playing=false; vuPeak.textContent='PAUSA'; });
audio.addEventListener('play', ()=>{ playing=true; });

// VU METER
const vuCanvas=document.getElementById('vuCanvas'); const ctx=vuCanvas.getContext('2d');
function drawVU(){
  ctx.fillStyle='#0a0a0a'; ctx.fillRect(0,0,600,32);
  let bars=36;
  let level = playing ? 30+Math.random()*65 : 0;
  for(let i=0;i<bars;i++){
    let lit = i < level/2.8;
    ctx.fillStyle = lit ? (i<22?'#00ff2a':i<30?'#ffea00':'#ff1a1a') : '#151515';
    ctx.fillRect(i*16.6+1,2,14,12);
    ctx.fillStyle = lit ? (i<22?'#9c27b0':i<30?'#ffb300':'#ff1a1a') : '#151515';
    ctx.fillRect(i*16.6+1,17,14,12);
  }
  requestAnimationFrame(drawVU);
}
drawVU();

// NOVITA'
function toggleNovita(){
  const sec=document.getElementById('novitaSection');
  sec.style.display = sec.style.display==='none' || sec.style.display==='' ? 'block' : 'none';
  if(sec.style.display==='block' && !sec.dataset.loaded){ buildNovita(); sec.dataset.loaded='1'; }
}
function buildNovita(){
  const list=document.getElementById('novitaList');
  const main=document.getElementById('novitaPlayerMain');
  main.innerHTML=PLACEHOLDER_HTML;
  list.innerHTML='';
  BRANI_NOVITA.forEach((b, idx)=>{
    let row=document.createElement('div');
    row.className='novita-row';
    row.innerHTML=`<img src="https://img.youtube.com/vi/${b.id}/mqdefault.jpg"><div><b>${b.artista}</b><br><span>${b.titolo}</span></div>`;
    row.onclick=()=>{
      document.querySelectorAll('.novita-row').forEach(r=>r.classList.remove('active'));
      row.classList.add('active');
      main.innerHTML=`<iframe src="https://www.youtube.com/embed/${b.id}?autoplay=1&rel=0" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
      window.scrollTo({top:main.offsetTop-20, behavior:'smooth'});
    };
    list.appendChild(row);
  });
}

// Popup mode
if(window.location.search.includes('popup=1')){
  document.body.style.background='#1a0a2e';
  document.querySelectorAll('.logo-wrap, h1, .live, #novitaSection, .btn-novita').forEach(e=>e.style.display='none');
  document.querySelector('.container').style.margin='5px auto';
}
</script>
</body>
</html>
