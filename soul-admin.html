<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOUL ADMIN</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:white;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center}
.box{width:90%;max-width:420px}
h1{color:#d8a4ff;font-size:2rem;letter-spacing:1px}
.sub{color:#aaa;margin:12px 0 28px;font-size:0.95rem}
.btn{width:100%;padding:22px;border-radius:30px;border:none;font-weight:900;font-size:1.3rem;cursor:pointer;transition:all 0.3s;display:block;margin-bottom:18px}
#btnViola{background:linear-gradient(90deg,#7b1fa2,#d1a3ff);color:white;box-shadow:0 0 25px #7b1fa2aa}
#btnNormale{background:white;color:#111}
.btn:active{transform:scale(0.96)}
#status{margin-top:20px;padding:12px;background:#111;border-radius:10px;font-weight:900;color:#ffd966;min-height:48px;display:flex;align-items:center;justify-content:center}
/* ===== PASSWORD GATE ===== */
#loginGate{position:fixed;top:0;left:0;width:100%;height:100%;background:#050505;display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px}
.login-card{background:#111;border:1px solid #b388ff;border-radius:20px;padding:28px;width:100%;max-width:380px;box-shadow:0 0 30px rgba(179,136,255,.25)}
.login-card h2{color:#d1a3ff;margin-bottom:8px}
.login-card p{color:#888;font-size:.9rem;margin-bottom:18px}
.login-card input{width:100%;padding:14px 16px;border-radius:12px;border:1px solid #333;background:#000;color:#fff;font-size:1rem;outline:none;margin-bottom:12px}
.login-card input:focus{border-color:#b388ff}
.login-btn{width:100%;padding:14px;border-radius:12px;border:none;background:linear-gradient(90deg,#7b1fa2,#d1a3ff);color:white;font-weight:900;font-size:1rem;cursor:pointer}
.login-err{margin-top:12px;color:#ff4444;font-size:.85rem;font-weight:700;display:none}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginGate">
  <div class="login-card">
    <h2>🔒 Accesso Admin</h2>
    <p>Inserisci password per gestire SOUL FUNK</p>
    <input type="password" id="pwdInput" placeholder="Password" autocomplete="off">
    <button class="login-btn" onclick="checkPwd()">ENTRA</button>
    <div id="loginErr" class="login-err">❌ Password errata!</div>
  </div>
</div>

<div class="box" id="adminBox" style="display:none">
<h1>💜 SOUL ADMIN</h1>
<div class="sub">Controllo per rsistema3.eu - 1 click</div>
<button id="btnViola" class="btn" onclick="setSoul(true)">💜 ATTIVA FUNK SOUL</button>
<button id="btnNormale" class="btn" onclick="setSoul(false)">⬛ DISATTIVA FUNK SOUL</button>
<div id="status">Pronto...</div>
<div style="margin-top:18px"><button onclick="logout()" style="background:none;border:none;color:#555;font-size:.8rem;text-decoration:underline;cursor:pointer">Esci</button></div>
</div>

<script>
// ===== CAMBIA PASSWORD QUI =====
const PASSWORD_CORRETTA = "at186dsa";

function checkPwd(){
  const val = document.getElementById('pwdInput').value;
  if(val === PASSWORD_CORRETTA){
    sessionStorage.setItem('s3_admin_auth','ok');
    sblocca();
  } else {
    document.getElementById('loginErr').style.display='block';
    document.getElementById('pwdInput').value='';
    document.getElementById('pwdInput').focus();
  }
}
function sblocca(){
  document.getElementById('loginGate').style.display='none';
  document.getElementById('adminBox').style.display='block';
}
function logout(){
  sessionStorage.removeItem('s3_admin_auth');
  location.reload();
}
document.getElementById('pwdInput').addEventListener('keydown', (e)=>{ if(e.key==='Enter') checkPwd(); });

// Auto-login se già autenticato
if(sessionStorage.getItem('s3_admin_auth')==='ok'){
  sblocca();
} else {
  document.getElementById('adminBox').style.display='none';
}

// ===== IL TUO CODICE ORIGINALE - NON TOCCATO =====
const NPOINT_URL = "https://api.npoint.io/9ed90a2b1c3d903bfac6";
async function setSoul(isSoul){
  const status = document.getElementById('status');
  status.innerHTML = "⏳ Invio...";
  try{
    let res = await fetch(NPOINT_URL, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({soul: isSoul})
    });
    if(res.ok){
      if(isSoul){
        status.innerHTML = "💜 FATTO! Ora è VIOLA per tutti! Tra 10 sec si aggiorna da solo";
        document.body.style.background = "#1a0a2a";
      } else {
        status.innerHTML = "⬛ FATTO! Tornato NORMALE giallo! Tra 10 sec si aggiorna";
        document.body.style.background = "#0a0a0a";
      }
    } else {
      status.innerHTML = "❌ Errore: " + res.status;
    }
  }catch(e){
    status.innerHTML = "❌ Errore connessione: " + e.message + "<br>Prova a mano su npoint.io";
  }
}
</script>
</body>
</html>
