<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOUL ADMIN - Radio Sistema 3</title>
<style>
body{background:#0d0620;color:white;font-family:Arial;text-align:center;padding:20px}
h1{color:#ffe600}
.btn{width:90%;max-width:400px;padding:30px;margin:15px auto;display:block;border:none;border-radius:25px;font-size:1.8rem;font-weight:900;cursor:pointer}
#btnViola{background:#7b1fa2;color:white;box-shadow:0 0 25px #7b1fa2}
#btnNormale{background:#222;color:#aaa;border:2px solid #444}
#status{margin-top:20px;font-size:1.2rem;color:#b388ff;min-height:30px}
</style>
</head>
<body>
<h1>👑 SOUL CONTROL</h1>
<p>rsistema3.eu - Controllo Remoto</p>
<button id="btnViola" class="btn" onclick="setSoul(true)">💜 ATTIVA VIOLA</button>
<button id="btnNormale" class="btn" onclick="setSoul(false)">⬛ TORNA NORMALE</button>
<div id="status">Pronto...</div>
<script>
const NPOINT_URL = "https://api.npoint.io/9ed90a2b1c3d903bfac6";
async function setSoul(active){
  const status = document.getElementById('status');
  status.textContent = active ? "Attivo viola... 💜" : "Torno normale... ⬛";
  try{
    let r = await fetch(NPOINT_URL, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({soul: active})
    });
    if(r.ok){
      status.textContent = active ? "✅ ORA TUTTI VEDONO VIOLA! + copertina viola + audio soul" : "✅ ORA TUTTI TORNANO NORMALI!";
    } else {
      status.textContent = "❌ Errore: " + r.status + " - vai su npoint.io e verifica";
    }
  }catch(e){
    status.textContent = "❌ Errore connessione: " + e;
  }
}
async function checkCurrent(){
  try{
    let r = await fetch(NPOINT_URL+"?t="+Date.now(), {cache:'no-store'});
    let d = await r.json();
    document.getElementById('status').textContent = d.soul ? "Stato attuale: 💜 VIOLA ATTIVO" : "Stato attuale: ⬛ NORMALE";
  }catch(e){}
}
checkCurrent();
</script>
</body>
</html>
