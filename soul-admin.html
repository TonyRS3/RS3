<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soul Admin</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:Arial;text-align:center;padding:30px 15px}
h1{color:#d8b4fe}
button{width:90%;max-width:360px;padding:22px;border:none;border-radius:30px;font-size:1.6rem;font-weight:900;margin:15px;cursor:pointer}
.on{background:linear-gradient(135deg,#7b1fa2,#d8b4fe);color:#fff;box-shadow:0 0 20px #a855f7}
.off{background:#fff;color:#111}
#status{margin-top:25px;background:#111;padding:15px;border-radius:15px;color:#ffd966;font-weight:900;min-height:20px}
small{color:#888}
</style>
</head>
<body>
<h1>💜 SOUL ADMIN</h1>
<p><small>Controllo per rsistema3.eu - 1 click</small></p>

<button class="on" onclick="setSoul(true)">💜 ATTIVA VIOLA</button><br>
<button class="off" onclick="setSoul(false)">⬛ TORNA NORMALE</button>

<div id="status">Pronto capo</div>

<script>
const BIN_ID = "9ed90a2b1c3d903bfac6";
const URL_API = "https://api.npoint.io/"+BIN_ID;

async function setSoul(on){
  const st=document.getElementById('status');
  st.textContent="Sto cambiando... attendi 2 sec";
  try{
    const r = await fetch(URL_API,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({soul:on})
    });
    if(r.ok){
      st.textContent = on ? "💜 FATTO! Ora è VIOLA per tutti! Tra 10 sec si aggiorna da solo" : "⬛ FATTO! Tornato MAIN normale";
    }else{
      st.textContent="Errore: "+r.status;
    }
  }catch(e){
    st.textContent="Errore rete: "+e;
  }
}
</script>
</body>
</html>
