<!DOCTYPE html>
<html lang="it">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Radio Sistema 3</title>

<style>

body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:Arial, sans-serif;
    text-align:center;
}

.container{
    padding:20px;
}

.logo{
    width:250px;
    max-width:80%;
    margin-top:10px;
}

h1{
    font-size:55px;
    margin:20px 0 10px;
    color:white;
}

.slogan{
    font-size:24px;
    margin-bottom:20px;
}

.live{
    color:#ff3b3b;
    font-size:28px;
    font-weight:bold;
    margin:20px 0;
}

.btn{
    display:inline-block;
    margin-top:20px;
    padding:18px 40px;
    background:#f15a24;
    color:white;
    text-decoration:none;
    border-radius:40px;
    font-size:26px;
    font-weight:bold;
}

.btn:hover{
    background:#ff6d35;
}

.footer{
    margin:20px 0 40px;
    font-size:22px;
}

/* COPERTINA */

.cc_streaminfo[data-type="trackimageurl"]{
    display:block !important;
    width:320px !important;
    max-width:90%;
    margin:20px auto !important;
    border-radius:15px;
    box-shadow:0 0 30px #f15a24;
}

/* TITOLO */

.song-title,
.cc_streaminfo[data-type="tracktitle"]{

    display:block !important;

    color:#ffffff !important;

    font-size:54px !important;

    font-weight:900 !important;

    line-height:1.2 !important;

    text-shadow:
        0 0 10px #ffffff,
        0 0 20px #ffffff,
        0 0 30px #ffffff;

    margin:20px auto 10px auto !important;
}

/* ARTISTA */

.song-artist,
.cc_streaminfo[data-type="trackartist"]{

    display:block !important;

    color:#ff6a2a !important;

    font-size:38px !important;

    font-weight:bold !important;

    text-shadow:
        0 0 10px #ff6a2a,
        0 0 20px #ff6a2a;

    margin-bottom:20px !important;
}

/* ELIMINA BUY THIS ALBUM */

a,
.cc_streaminfo[data-type="trackbuyurl"]{
    display:none !important;
}

</style>
</head>

<body>

<div class="container">

<img src="RADIO SISTEMA 3.jpeg"
alt="Radio Sistema 3"
class="logo">

<h1>RADIO SISTEMA 3</h1>

<div class="slogan">
Musica, informazione e intrattenimento
</div>

<div class="live">
🔴 IN DIRETTA
</div>

<a class="btn"
href="http://manage.myshoutca.st:8046/stream"
target="_blank">
▶ ASCOLTA LIVE
</a>

<div class="footer">
La radio delle tue emozioni
</div>

<!-- COPERTINA -->

<img
class="cc_streaminfo"
data-type="trackimageurl"
data-username="bomyydij">

<!-- TITOLO -->

<div
class="cc_streaminfo song-title"
data-type="tracktitle"
data-username="bomyydij">
</div>

<!-- ARTISTA -->

<div
class="cc_streaminfo song-artist"
data-type="trackartist"
data-username="bomyydij">
</div>

</div>

</body>
</html>
