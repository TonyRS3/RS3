<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Radio - Finestra Top-Charts</title>
<style>
body{background:#0a0a0a; color:#fff; font-family:system-ui; padding:20px}
.window{background:#1a1a1a; border-radius:20px; padding:20px; max-width:950px; margin:auto; border:1px solid #333}
.grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:18px}
.card{background:#222; border-radius:12px; overflow:hidden; text-decoration:none; color:#fff; position:relative}
.card img{width:100%; aspect-ratio:1; object-fit:cover}
.card .info{padding:10px} .card:hover{transform:scale(1.04)}
.play-icon{position:absolute; bottom:48px; right:8px; background:#ffcc00; color:#000; width:32px; height:32px; border-radius:50%; text-align:center; line-height:32px}
.tool{background:#222; border-radius:12px; padding:16px; margin-bottom:20px}
.tool input{width:100%; padding:10px; margin:6px 0; border-radius:8px; border:1px solid #444; background:#111; color:#fff}
.tool button{background:#ffcc00; color:#000; border:none; padding:12px; border-radius:20px; font-weight:bold; width:100%; cursor:pointer}
</style>
</head>
<body>
<h1 style="text-align:center; color:#ffcc00">🎧 In Onda Ora - Clicca la Cover per Ascoltare</h1>
<div class="window">
  <div class="tool">
    <h3>➕ Inserisci la TUA copertina</h3>
    <input type="file" id="fileInput" accept="image/*">
    <input type="text" id="branoInput" placeholder="Nome Brano es: Lontano">
    <input type="text" id="autoreInput" placeholder="Autore es: Sfera Ebbasta">
    <button onclick="aggiungiCopertina()">Aggiungi alla finestra</button>
  </div>
  <div class="grid" id="grid"></div>
</div>
<script>
function aggiungiCopertina(){
  const file = document.getElementById('fileInput').files[0];
  const brano = document.getElementById('branoInput').value || 'Nuovo Brano';
  const autore = document.getElementById('autoreInput').value || 'Artista';
  if(!file){ alert('Scegli una copertina!'); return; }
  const reader = new FileReader();
  reader.onload = function(e){
    const imgData = e.target.result;
    const query = encodeURIComponent(autore + ' ' + brano);
    const link = 'https://www.top-charts.com/search?q=' + query;
    const card = document.createElement('a');
    card.className = 'card'; card.href = link; card.target = '_blank';
    card.innerHTML = `<img src="${imgData}"><div class="play-icon">▶</div><div class="info"><b>${brano}</b><span>${autore}</span></div>`;
    document.getElementById('grid').prepend(card);
  };
  reader.readAsDataURL(file);
}
</script>
</body>
</html>
