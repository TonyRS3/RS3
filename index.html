<!DOCTYPE html>
<html lang="it">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Radio Sistema 3</title>

<style>

body{
    margin:0;
    color:#fff;
    font-family:Arial,sans-serif;
    text-align:center;
    background:
        linear-gradient(
            rgba(0,0,0,0.35),
            rgba(0,0,0,0.35)
        ),
        url("studio-radio.jpeg");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;
}

.container{
    max-width:900px;
    margin:20px auto;
    padding:20px;
}

.logo{
    width:220px;
    max-width:85%;
    height:auto;
}

h1{
    margin:20px 0 10px;
    font-size:3rem;
    color:#fff;
}

.slogan{
    font-size:18px;
    margin-bottom:20px;
}

.live{
    color:#ff4040;
    font-size:28px;
    font-weight:bold;
    margin:20px 0;
}

.player-box{
    max-width:700px;
    margin:30px auto;
    padding:20px;
    background:rgba(0,0,0,0.45);
    border-radius:15px;
    box-shadow:0 0 20px rgba(0,0,0,.4);
}

.footer{
    margin:30px 0;
    font-size:18px;
}

/* Widget Tracce Recenti */

.cc_recenttracks_list{
    margin-top:20px !important;
    color:#fff !important;
    font-weight:bold !important;
}

.cc_recenttracks_list *{
    color:#fff !important;
}

.cc_recenttracks_list img{
    display:block !important;
    margin:15px auto !important;
    width:100px !important;
    height:auto !important;
    border-radius:10px;
}

.cc_recenttracks_list .ccbuy{
    display:none !important;
}

/* Centova Player */

.centovaplayer{
    margin:auto !important;
}

</style>

<link rel="stylesheet"
      href="https://manage.myshoutca.st/system/centovaplayer.standalone.css">

<script src="https://manage.myshoutca.st/system/player.js"></script>
<script src="https://manage.myshoutca.st/system/recenttracks.js"></script>

</head>

<body>

<div class="container">

    <img src="RADIO SISTEMA 3.jpeg"
         alt="Radio Sistema 3"
         class="logo">

    <h1>RADIO SISTEMA 3</h1>

    <div class="slogan">
        Musica, informazione e intrattenimento
    </div>

    <div class="live">
        🔴 IN DIRETTA
    </div>

    <div class="player-box">

        <div class="cc_player"
             data-username="bomyydij"
             data-size="sm"
             data-style="light">
             Loading...
        </div>

    </div>

    <div class="footer">
        La radio delle tue emozioni
    </div>

    <h2>🎵 Ultimi brani trasmessi</h2>

    <div class="cc_recenttracks_list"
         data-username="bomyydij">
    </div>

</div>

</body>
</html>
