<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radio Sistema 3</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#111;
    color:#fff;
    text-align:center;
}

.hero{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:
        linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)),
        url("RADIO SISTEMA 3.jpeg") center center no-repeat;
    background-size:cover;
}

img{
    max-width:280px;
    width:80%;
    height:auto;
    border-radius:12px;
}

h1{
    font-size:3rem;
    margin:20px 0 10px;
}

p{
    font-size:1.2rem;
    max-width:700px;
    margin:0 auto;
}

.btn{
    display:inline-block;
    margin-top:25px;
    padding:18px 40px;
    background:#f15a24;
    color:#fff;
    text-decoration:none;
    border-radius:40px;
    font-weight:bold;
    font-size:1.4rem;
}

.note{
    margin-top:15px;
    color:#ddd;
}

@media (max-width:768px){
    h1{
        font-size:2.2rem;
    }

    p{
        font-size:1rem;
    }

    .btn{
        font-size:1.2rem;
        padding:15px 30px;
    }
}
</style>
</head>

<body>

<div class="hero">

<img src="RADIO SISTEMA 3.jpeg" alt="Radio Sistema 3 Logo">

<h1>RADIO SISTEMA 3</h1>

<p>
Musica, informazione e intrattenimento.
La tua radio sempre con te.
</p>

<a class="btn" href="#">
▶ ASCOLTA LIVE
</a>

<div class="note">
Streaming online disponibile a breve.
</div>

</div>

</body>
</html>
