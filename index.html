<script>
let popupWin=null,userPausedManually=false,autoResumeTimer=null,lastUserClickOnAudio=0,resumeAttempts=0,interruptedBySystem=false;
function apriNovita(){userPausedManually=true;document.getElementById('radioAudio').pause();document.getElementById('novitaSection').style.display='block';document.getElementById('btnNovita').style.display='none';document.getElementById('novitaPlayerMain').innerHTML=PLACEHOLDER_HTML;renderNovita();}
function chiudiNovita(){document.getElementById('novitaPlayerMain').innerHTML=PLACEHOLDER_HTML;document.getElementById('novitaList').innerHTML="";document.getElementById('novitaList').dataset.done="0";document.getElementById('novitaSection').style.display='none';document.getElementById('btnNovita').style.display='inline-block';userPausedManually=false;interruptedBySystem=false;document.getElementById('radioAudio').play().catch(()=>{});}
function playNovita(id,el){userPausedManually=true;document.getElementById('radioAudio').pause();document.querySelectorAll('.novita-row').forEach(x=>x.classList.remove('active'));el.classList.add('active');document.getElementById('novitaPlayerMain').innerHTML='<iframe src="https://www.youtube.com/embed/'+id+'?autoplay=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>';}
function renderNovita(){const c=document.getElementById('novitaList');if(c.dataset.done=="1")return;c.dataset.done="1";c.innerHTML=BRANI_NOVITA.map(b=>{const bb=normalizzaBrano(b);const displayTitle=bb.titolo||bb.id;const displayArtista=bb.artista||'YouTube';return `<div class="novita-row" onclick="playNovita('${bb.id}', this)"><img src="https://i.ytimg.com/vi/${bb.id}/hqdefault.jpg" style="width:50px;height:38px;border-radius:4px"><div><b style="font-size:0.9rem">${displayArtista}</b><br><span style="color:#aaa;font-size:.75rem">${displayTitle}</span></div><div style="margin-left:auto;color:#ff0033">▶</div></div>`;}).join('');}

async function fetchAnsaNotizie(rssUrl){
  const noCacheOpt={cache:'no-store'};
  try{
    const r=await fetch('https://api.allorigins.win/raw?url='+encodeURIComponent(rssUrl)+'%3F_t%3D'+Date.now(), noCacheOpt);
    const txt=await r.text();
    if(txt && txt.includes('<item')){
      const xml=new DOMParser().parseFromString(txt,"text/xml");
      const items=[...xml.querySelectorAll("item")].slice(0,4);
      if(items.length>0) return items.map(it=>({title:it.querySelector("title")?.textContent||"", link:it.querySelector("link")?.textContent||"#"}));
    }
    throw new Error('raw empty');
  }catch(e1){
    try{
      const r2=await fetch('https://corsproxy.io/?'+encodeURIComponent(rssUrl+'?_t='+Date.now()), noCacheOpt);
      const txt2=await r2.text();
      const xml2=new DOMParser().parseFromString(txt2,"text/xml");
      const items2=[...xml2.querySelectorAll("item")].slice(0,4);
      if(items2.length>0) return items2.map(it=>({title:it.querySelector("title")?.textContent||"", link:it.querySelector("link")?.textContent||"#"}));
      throw new Error('corsproxy empty');
    }catch(e2){
      const r3=await fetch('https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(rssUrl)+'&_t='+Date.now(), noCacheOpt);
      const data=await r3.json();
      return data.items.slice(0,4).map(n=>({title:n.title, link:n.link}));
    }
  }
}

async function caricaCronacaNord(){
  const box=document.getElementById('newsListNord'); const timeEl=document.getElementById('newsTime');
  try{
    const notizie=await fetchAnsaNotizie('https://www.ansa.it/sito/notizie/cronaca/cronaca_rss.xml');
    box.innerHTML=notizie.map(n=>`<div class="news-item"><a href="${n.link}" target="_blank">• ${n.title}</a></div>`).join('');
    if(timeEl) timeEl.textContent='agg. '+new Date().toLocaleTimeString();
  }catch(e){ 
    box.innerHTML='<div class="news-item" style="color:#aaa">Riprovo tra 1 min... ('+new Date().toLocaleTimeString()+')</div>';
    setTimeout(caricaCronacaNord,60000);
  }
}

}
function setupChannelNav(){const isPopup=window.location.search.includes('popup=1');const btnMain=document.getElementById('btnMain');const btnSoul=document.getElementById('btnSoul');if(isPopup){btnMain.href='index.html?popup=1';btnSoul.href='soul.html?popup=1';[btnMain,btnSoul].forEach(btn=>{btn.addEventListener('click',function(e){e.preventDefault();window.location.href=this.getAttribute('href');});});}else{btnMain.href='index.html';btnSoul.href='soul.html';}}
function apriPopupPlayer(){if(window.innerWidth<=768)return;userPausedManually=true;document.getElementById('radioAudio').pause();popupWin=window.open(window.location.href.split('?')[0]+'?popup=1','RadioSistema3Popup','width=380,height=380,top=50,left=50,resizable=yes,scrollbars=no');let checkChiuso=setInterval(()=>{if(popupWin&&popupWin.closed){clearInterval(checkChiuso);popupWin=null;userPausedManually=false;interruptedBySystem=false;document.getElementById('radioAudio').play().catch(()=>{});}},800);}
function pulisciTitolo(raw){
  let t=raw||"";
  t=t.replace(/Radio Sistema 3/gi,'');
  t=t.replace(/\s+/g,' ').trim();
  t=t.replace(/^\s*\d{1,2}:\d{2}\s*(AM|PM)?\s*[-–—]?\s*/i,'');
  t=t.replace(/^\s*\d{1,2}:\d{2}\s*[-–—]\s*(AM|PM)?\s*/i,'');
  t=t.replace(/^\s*(AM|PM)\s*[-–—]?\s*/i,'');
  t=t.replace(/^\s*[-–—]\s*/,'');
  t=t.replace(/^PM(?=[A-Z0-9])/i,'');
  t=t.replace(/^AM(?=[A-Z0-9])/i,'');
  t=t.trim();
  t=t.replace(/([a-z])([A-Z])/g,'$1 $2');
  t=t.replace(/([A-Z])([A-Z][a-z])/g,'$1 $2');
  t=t.replace(/\s{2,}/g,' ').trim();
  if(t.includes(' - ')||t.includes(' – ')||t.includes('-')||t.includes('–')){
    t=t.replace(/\s*[–—]\s*/g,' - ');
    t=t.replace(/\s*-\s*/g,' - ');
    t=t.replace(/\s+/g,' ').trim();
  }
  return t;
}
function rebuildTrackBox(){
  const wrap=document.querySelector('.cc_recenttracks_list');
  if(!wrap)return;
  let existingBox=wrap.querySelector('.rs3-trackbox');
  let rawText="";let rawImgSrc=getLogoAssoluto();
  const imgs=wrap.querySelectorAll('img');
  if(imgs.length>0){for(let im of imgs){if(im.src&&im.src.trim()!=""){rawImgSrc=im.src.includes('RADIO%20SISTEMA')?im.src:getLogoAssoluto();}}}
  let tempDiv=document.createElement('div');
  tempDiv.innerHTML=wrap.innerHTML;
  tempDiv.querySelectorAll('img, .ccbuy, a').forEach(el=>el.remove());
  let txt=tempDiv.innerText.trim();
  rawText=pulisciTitolo(txt);

  let artista="", titolo="";
  if(rawText.includes(' - ')){
    let p=rawText.split(' - ');
    if(p.length>=2){ artista=p[0].trim(); titolo=p.slice(1).join(' - ').trim(); }
  } else { titolo=rawText; }
  if(!existingBox){
    wrap.innerHTML='';
    const box=document.createElement('div');box.className='rs3-trackbox';
    const imgEl=document.createElement('img');imgEl.className='rs3-cover';imgEl.src=rawImgSrc;
    const infoEl=document.createElement('div');infoEl.className='rs3-info';
    if(artista && titolo){
      infoEl.innerHTML='<div style="font-weight:900;color:#fff">'+artista+'</div><div style="color:#ffd966;font-weight:700">'+titolo+'</div>';
    } else {
      infoEl.textContent=rawText;
    }
    box.appendChild(imgEl);box.appendChild(infoEl);wrap.appendChild(box);
    aggiornaMediaSessionCover(rawImgSrc,rawText);
  }else{
    const infoEl=existingBox.querySelector('.rs3-info');
    if(infoEl && infoEl.dataset.lastText!==rawText){
      if(artista && titolo){
        infoEl.innerHTML='<div style="font-weight:900;color:#fff">'+artista+'</div><div style="color:#ffd966;font-weight:700">'+titolo+'</div>';
      } else {
        infoEl.textContent=rawText;
      }
      infoEl.dataset.lastText=rawText;
    }
    const imgEl=existingBox.querySelector('.rs3-cover');
    if(imgEl&&imgEl.src!==rawImgSrc){imgEl.src=rawImgSrc;}
    aggiornaMediaSessionCover(rawImgSrc,rawText);
  }
}

const METEO_API_KEY="cf67ed7472bdfb3087a25f37627f5d74";
const LEFT_CITIES=[{q:"Torino,IT",label:"Torino"},{q:"Milano,IT",label:"Milano"},{q:"Venezia,IT",label:"Venezia"},{q:"Bologna,IT",label:"Bologna"},{q:"Firenze,IT",label:"Firenze"}];
const RIGHT_CITIES=[{q:"Roma,IT",label:"Roma"},{q:"Ancona,IT",label:"Ancona"},{q:"Napoli,IT",label:"Napoli"},{q:"Palermo,IT",label:"Palermo"},{q:"Brindisi,IT",label:"Brindisi"}];
async function renderMeteoSide(cities,elementId){
  const grid=document.getElementById(elementId);
  if(!grid) return;
  let html="";
  for(let c of cities){
    try{
      const r=await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${c.q}&appid=${METEO_API_KEY}&units=metric&lang=it&bust=${Date.now()}`, {cache:'no-store'});
      const d=await r.json();
      if(d.cod!==200) throw new Error(d.message);
      const temp=Math.round(d.main.temp);
      const icon=d.weather[0].icon;
      html+=`<div class="meteo-mini"><b>${c.label}</b><img src="https://openweathermap.org/img/wn/${icon}.png"><div class="temp">${temp}°C</div></div>`;
    }catch(e){
      html+=`<div class="meteo-mini"><b>${c.label}</b><div class="temp">--°</div></div>`;
    }
  }
  grid.innerHTML=html;
}

const vuCanvas=document.getElementById('vuCanvas');const vuCtx=vuCanvas.getContext('2d');const radioEl=document.getElementById('radioAudio');const vuPeakEl=document.getElementById('vuPeak');

function drawStereo(){const W=vuCanvas.width,H=vuCanvas.height;vuCtx.clearRect(0,0,W,H);vuCtx.fillStyle='#0a0a0a';vuCtx.fillRect(0,0,W,H);let bars=36,barW=W/bars,gap=1.5,rowH=H/2-2;let activeL=Math.floor((levelL/100)*bars);for(let i=0;i<bars;i++){let x=i*barW;let lit=i<activeL;let color=i<bars*0.6?(lit?'#00ff2a':'#001a05'):i<bars*0.84?(lit?'#ffea00':'#1a1a00'):(lit?'#ff1a1a':'#1a0000');vuCtx.fillStyle=color;let y=1;let bh=lit?rowH-1:rowH*0.4;vuCtx.fillRect(x+gap,y+(rowH-bh)/2,barW-gap*2,bh);}vuCtx.fillStyle='#333';vuCtx.fillRect(0,H/2-0.5,W,1);let activeR=Math.floor((levelR/100)*bars);for(let i=0;i<bars;i++){let x=i*barW;let lit=i<activeR;let color=i<bars*0.6?(lit?'#00d4ff':'#001a1a'):i<bars*0.84?(lit?'#ffea00':'#1a1a00'):(lit?'#ff1a1a':'#1a0000');vuCtx.fillStyle=color;let y=H/2+1;let bh=lit?rowH-1:rowH*0.4;vuCtx.fillRect(x+gap,y+(rowH-bh)/2,barW-gap*2,bh);}requestAnimationFrame(drawStereo);}
function updateStereo(){if(!isPlayingVU){levelL+=(0-levelL)*0.08;levelR+=(0-levelR)*0.08;return;}let base=40+Math.random()*45;let isPeak=Math.random()<0.18;let targetL=isPeak?88+Math.random()*12:base+Math.random()*18;let targetR=isPeak?85+Math.random()*15:base*0.9+Math.random()*20;levelL+=(targetL-levelL)*0.38;levelR+=(targetR-levelR)*0.34;if(levelL>100)levelL=100;if(levelR>100)levelR=100;}
function scheduleAutoResume(reason){if(userPausedManually)return;if(document.hidden)return;clearTimeout(autoResumeTimer);resumeAttempts=0;const tryPlay=()=>{if(userPausedManually)return;if(document.hidden)return;if(radioEl.paused){radioEl.volume=1.0;radioEl.play().then(()=>{resumeAttempts=0;interruptedBySystem=false;}).catch(()=>{if(resumeAttempts<8){resumeAttempts++;autoResumeTimer=setTimeout(tryPlay,1500);}});}};autoResumeTimer=setTimeout(tryPlay,800);}

radioEl.addEventListener('pause',()=>{radioEl.volume=1.0;const isUserClick=(Date.now()-lastUserClickOnAudio)<1000;if(isUserClick){userPausedManually=true;interruptedBySystem=false;clearTimeout(autoResumeTimer);}else{if(!userPausedManually){interruptedBySystem=true;clearTimeout(autoResumeTimer);}}isPlayingVU=false;vuPeakEl.textContent="STOP";vuPeakEl.style.color="#ff4444";if('mediaSession' in navigator)try{navigator.mediaSession.playbackState="paused";}catch(e){}});
radioEl.addEventListener('play',()=>{userPausedManually=false;interruptedBySystem=false;clearTimeout(autoResumeTimer);resumeAttempts=0;radioEl.volume=1.0;isPlayingVU=true;vuPeakEl.textContent="● LIVE";vuPeakEl.style.color="#00ff2a";if(popupWin&&!popupWin.closed){popupWin.close();popupWin=null;}if('mediaSession' in navigator)try{navigator.mediaSession.playbackState="playing";}catch(e){}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(interruptedBySystem&&!userPausedManually&&radioEl.paused){scheduleAutoResume('visible-after-call');}}});
radioEl.addEventListener('stalled',()=>{if(!interruptedBySystem&&!document.hidden)scheduleAutoResume('stalled');});radioEl.addEventListener('error',()=>{if(!interruptedBySystem&&!document.hidden)scheduleAutoResume('error');});radioEl.addEventListener('emptied',()=>{if(!interruptedBySystem&&!document.hidden)scheduleAutoResume('emptied');});
if('mediaSession' in navigator){try{navigator.mediaSession.setActionHandler('play',()=>{userPausedManually=false;interruptedBySystem=false;radioEl.play().catch(()=>{});});navigator.mediaSession.setActionHandler('pause',()=>{userPausedManually=true;interruptedBySystem=false;radioEl.pause();});navigator.mediaSession.setActionHandler('stop',()=>{userPausedManually=true;interruptedBySystem=false;radioEl.pause();});}catch(e){}}
