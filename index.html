<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Radio Sistema 3</title>

<style>

body{
    margin:0;
    color:#fff;
    font-family:Arial,sans-serif;
    text-align:center;

    background:
        linear-gradient(
            rgba(0,0,0,0.35),
            rgba(0,0,0,0.35)
        ),
        url("studio-radio.jpeg");

    background-size:cover;
    background-position:center center;
    background-repeat:no-repeat;
    background-attachment:fixed;
}

.container{
    max-width:900px;
    margin:20px auto;
    padding:20px;
}

.logo{
    width:200px;
    max-width:85%;
    height:auto;
}

h1{
    margin:20px 0 10px;
    font-size:3rem;
    color:#ffffff;
}

.slogan{
    font-size:18px;
    margin-bottom:20px;
}

.live{
    color:#ff4040;
    font-size:28px;
    font-weight:bold;
    margin:20px 0;
}

.btn{
    display:inline-block;
    margin:20px 0;
    padding:18px 45px;
    background:linear-gradient(135deg,#f15a24,#ff7a45);
    color:#fff;
    text-decoration:none;
    border-radius:50px;
    font-size:24px;
    font-weight:bold;
    box-shadow:0 0 20px rgba(241,90,36,.8);
    transition:all .3s ease;
}

.btn:hover{
    transform:scale(1.05);
}

.footer{
    margin:25px 0 15px;
    font-size:18px;
}

/* Widget MyShoutCast */

.cc_recenttracks_list{
    margin-top:20px !important;
    color:#ffffff !important;
    font-weight:bold !important;
}

.cc_recenttracks_list *{
    color:#ffffff !important;
}

/* Copertina */

.cc_recenttracks_list img{
    display:block !important;
    margin:15px auto !important;

    width:100px !important;
    max-width:100px !important;
    height:auto !important;

    border-radius:10px;
}
     
/* Nasconde Buy This Album */

.cc_recenttracks_list a{
    display:none !important;
}

</style>

<script src="https://manage.myshoutca.st/system/recenttracks.js"></script>

</head>

<body>

<div class="container">

<img src="RADIO SISTEMA 3.jpeg"
     alt="Radio Sistema 3"
     class="logo">

<h1>RADIO SISTEMA 3</h1>

<div class="slogan">
Musica, informazione e intrattenimento
</div>

<div class="live">
🔴 IN DIRETTA
</div>
    
    <a class="btn"
        
    href="https://listentomystream.com:8046/stream"
   target="_blank"
    rel="noopener noreferrer">      
        
   🎧 ASCOLTA
   </a>

<div class="footer">
La radio delle tue emozioni
</div>

<div class="cc_recenttracks_list"
     data-username="bomyydij">
</div>

</div>

</body>
</html>
