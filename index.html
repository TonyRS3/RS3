<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Radio Sistema 3 Live</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:'Segoe UI',sans-serif;

    background:
    linear-gradient(
        rgba(0,0,0,.45),
        rgba(0,0,0,.55)
    ),
    url("studio-radio.jpeg");

    background-size:cover;
    background-position:center;

    color:white;
}

.player-box{

    width:90%;
    max-width:700px;

    padding:40px;

    text-align:center;

    background:rgba(255,255,255,.10);

    backdrop-filter:blur(10px);

    border-radius:25px;

    border:1px solid rgba(255,255,255,.25);

    box-shadow:
    0 10px 40px rgba(0,0,0,.35);
}

.logo{

    width:180px;
    max-width:90%;

    border-radius:20px;

    margin-bottom:20px;
}

h1{

    margin-bottom:15px;

    font-size:2.5rem;
}

.slogan{

    margin-bottom:25px;

    color:#fff4c1;
}

.live{

    color:#ff4040;

    font-weight:bold;

    font-size:1.4rem;

    margin-bottom:25px;

    animation:pulse 1.5s infinite;
}

audio{

    width:100%;
}

.back{

    display:inline-block;

    margin-top:30px;

    padding:12px 25px;

    text-decoration:none;

    color:white;

    border-radius:50px;

    background:
    linear-gradient(
        135deg,
        #ff512f,
        #dd2476
    );
}

@keyframes pulse{

    0%{
        opacity:1;
    }

    50%{
        opacity:.4;
    }

    100%{
        opacity:1;
    }
}

</style>
</head>

<body>

<div class="player-box">

    <img src="RADIO SISTEMA 3.jpeg"
         class="logo"
         alt="Radio Sistema 3">

    <h1>RADIO SISTEMA 3</h1>

    <div class="slogan">
        La radio delle tue emozioni
    </div>

    <div class="live">
        🔴 IN DIRETTA
    </div>

    <audio controls autoplay preload="none">

        <source
        src="URL_DEL_TUO_STREAM"
        type="audio/mpeg">

    </audio>

    <br>

    <a href="index.html" class="back">
        ← Torna al sito
    </a>

</div>

</body>
</html>
