<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radio Sistema 3</title>

<style>

body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
    text-align:center;
}

.container{
    padding:20px;
}

.logo{
    width:300px;
    max-width:85%;
    height:auto;
}

h1{
    margin:20px 0 10px;
    font-size:3rem;
    color:#fff;
}

.slogan{
    font-size:18px;
    margin-bottom:25px;
}

.live{
    color:#ff4040;
    font-size:28px;
    font-weight:bold;
    margin:20px 0;
}

.btn{
    display:inline-block;
    margin-top:20px;
    padding:20px 50px;
    background:linear-gradient(135deg,#f15a24,#ff7a45);
    color:#fff;
    text-decoration:none;
    border-radius:50px;
    font-size:26px;
    font-weight:bold;
    box-shadow:0 0 25px rgba(241,90,36,.8);
    transition:all .3s ease;
}

.btn:hover{
    transform:scale(1.05);
    box-shadow:0 0 35px rgba(241,90,36,1);
}

.footer{
    margin:30px 0 20px;
    font-size:18px;
}

/* Widget brano */

.cc_recenttracks_list{
    font-size:16px !important;
    font-weight:bold !important;
    color:#ffffff !important;
    text-align:center !important;
    line-height:1.2 !important;
}

.cc_recenttracks_list *{
    color:#ffffff !important;
}

/* Copertina */

.cc_recenttracks_list img{
    display:block !important;
    margin:15px auto !important;
    max-width:180px !important;
    border-radius:8px;
    box-shadow:0 0 20px rgba(241,90,36,.6);
}

/* Nasconde Buy This Album */

.cc_recenttracks_list a{
    display:none !important;
}

</style>
</head>

<body>

<div class="container">

<img src="RADIO SISTEMA 3.jpeg"
     alt="Radio Sistema 3"
     class="logo">

<h1>RADIO SISTEMA 3</h1>

<div class="slogan">
Musica, informazione e intrattenimento
</div>

<div class="live">
🔴 IN DIRETTA
</div>
    
 <a class="btn"
   href="#"
   onclick="window.open('http://manage.myshoutca.st:8046/stream',
   'radio_player',
   'width=420,height=120'); return false;">
   🎧 ASCOLTA RADIO SISTEMA 3
</a>


<div class="footer">
La radio delle tue emozioni
</div>

<div class="cc_recenttracks_list"
     data-username="bomyydij">
</div>

<script src="https://manage.myshoutca.st/system/recenttracks.js"></script>

</div>

</body>
</html>
