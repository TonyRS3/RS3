<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radio Sistema 3</title>
<style>
body{background:#111;color:#fff;font-family:Arial;padding:20px;max-width:800px;margin:auto}
h1{color:#ffd966}
.box{background:#ffd966;color:#111;padding:20px;border-radius:15px;margin:20px 0}
.dedica{background:rgba(0,0,0,.3);padding:10px;border-radius:10px;margin:10px 0}
</style>
</head>
<body>
<h1>RSISTEMA.EU - Radio Sistema 3</h1>
<p>La radio di Cernobbio</p>

<div id="boxDediche" class="box" style="display:none">
<h2>💖 Ultime Dediche in Onda</h2>
<div id="lista"></div>
</div>

<script>
async function carica(){
  try{
    const r = await fetch('dediche.json?v='+Date.now());
    const d = await r.json();
    if(!d.length) return;
    document.getElementById('boxDediche').style.display='block';
    document.getElementById('lista').innerHTML = d.map(x=>`<div class="dedica"><b>Da ${x.da} per ${x.per}</b><br>${x.msg}</div>`).join('');
  }catch(e){ console.log('no dediche'); }
}
carica();
setInterval(carica, 30000);
</script>

</body>
</html>
