<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radio Sistema 3</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111;color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;background-image:url('https://images.unsplash.com/photo-1598488035139-bdbb22374218?w=1200');background-size:cover;background-position:center;background-attachment:fixed}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.65);backdrop-filter:blur(8px);z-index:-1}
.logo{width:140px;margin:20px auto;background:#fff;border-radius:20px;padding:10px;box-shadow:0 0 20px rgba(255,255,255,0.3);border:3px solid transparent;background:linear-gradient(white,white) padding-box, linear-gradient(45deg,orange,cyan) border-box}
.logo img{width:100%;display:block}
.title{font-size:2.2em;font-weight:900;text-align:center;margin:10px 0;letter-spacing:1px}
.onair{text-align:center;color:#ff4444;font-weight:bold;margin-bottom:15px}
.onair span{display:inline-block;width:12px;height:12px;background:#ff4444;border-radius:50%;animation:blink 1s infinite;margin-right:8px}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}

.card{width:90%;max-width:420px;background:rgba(255,255,255,0.1);backdrop-filter:blur(12px);border-radius:20px;padding:20px;text-align:center;border:1px solid rgba(255,255,255,0.15);margin-bottom:15px}
.card h3{color:#f9d976;font-weight:500;margin-bottom:12px}
.channel-switch{display:flex;gap:10px;justify-content:center;margin-bottom:15px}
.btn-ch{padding:10px 22px;border-radius:30px;border:none;font-weight:900;cursor:pointer;font-size:14px;transition:0.3s}
.btn-main{background:#fff;color:#333}
.btn-soul{background:#e84393;color:#fff;box-shadow:0 0 15px #e84393}
.btn-active{transform:scale(1.1);border:2px solid yellow!important}

audio{width:100%;border-radius:30px;margin-bottom:12px}
.meter{background:#000;border-radius:8px;padding:6px;margin-bottom:15px;border:1px solid #333}
.meter-bar{height:8px;background:linear-gradient(90deg,#0f0,yellow,red);border-radius:4px;margin:3px 0}
.meter-label{font-size:10px;color:#888;display:flex;justify-content:space-between}

.btn-popup{background:#22d3ee;color:#000;border:none;padding:10px 20px;border-radius:30px;font-weight:bold;cursor:pointer}
.btn-playlist{background:#e11d48;color:#fff;border:none;padding:12px 28px;border-radius:30px;font-weight:900;cursor:pointer;margin:15px 0}

.track{width:90%;max-width:420px;background:rgba(0,0,0,0.6);border-radius:15px;padding:12px;display:flex;gap:12px;align-items:center;margin-bottom:10px}
.track img{width:70px;height:70px;border-radius:5px;object-fit:cover;border:2px solid #fff}
.track-info{font-size:14px;line-height:1.3}
.track-info b{display:block}
.footer{font-size:11px;color:#aaa;margin:15px;text-align:center}
</style>
</head>
<body>
<div class="overlay"></div>

<div class="logo"><img src="https://via.placeholder.com/140x140?text=RS3" alt="RS3" id="logoImg"></div>
<div class="title">RADIO SISTEMA 3</div>
<div class="onair"><span></span> ON AIR 24/7</div>

<div class="card">
<div class="channel-switch">
<button id="bMain" class="btn-ch btn-main" onclick="switchCh('main')">MAIN</button>
<button id="bSoul" class="btn-ch btn-soul btn-active" onclick="switchCh('soul')">SOUL FUNK</button>
</div>

<h3>♪ Ascolta in diretta</h3>
<audio id="audio" controls autoplay><source id="src" src="http://listentomystream.com:8046/soulfunk" type="audio/mpeg"></audio>

<div class="meter">
<div class="meter-bar" style="width:92%"></div>
<div class="meter-bar" style="width:75%;opacity:0.7"></div>
<div class="meter-label"><span>L ● R STEREO</span><span style="color:#f55">STOP</span></div>
</div>

<button class="btn-popup" onclick="window.open(location.href,'popup','width=420,height=600')">⧉ APRI POPUP PLAYER</button>
</div>

<h3 style="color:#f9d976;margin:10px;font-weight:500">♪ Brano in onda</h3>

<div class="track">
<img src="https://via.placeholder.com/70?text=Cover" id="cover">
<div class="track-info">
<b>Self</b><b>Control</b>Laura<br>Branigan<br>Radio<br>Sistema 3
</div>
</div>

<button class="btn-playlist">▶ PLAYLIST</button>

<div class="footer">© Radio Sistema 3 - Tutti i Diritti Riservati - SIAE n°202600000389</div>

<script>
const streams={
main:'http://listentomystream.com:8046/stream',
soul:'http://listentomystream.com:8046/soulfunk'
};
function switchCh(c){
let a=document.getElementById('audio');
let s=document.getElementById('src');
let bm=document.getElementById('bMain');
let bs=document.getElementById('bSoul');
s.src=streams[c];
a.load(); a.play().catch(()=>{});
if(c=='main'){bm.classList.add('btn-active');bs.classList.remove('btn-active');}
else{bs.classList.add('btn-active');bm.classList.remove('btn-active');}
}
</script>
</body>
</html>
