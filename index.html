async function fetchYearFromMusicBrainz(artista,titolo){try{if(!titolo)return null;let titoloLow=titolo.toLowerCase();let keyCheck=(titolo+"|"+artista).toLowerCase().trim();if(ANNI_REALI_OVERRIDE[keyCheck])return ANNI_REALI_OVERRIDE[keyCheck];if(titoloLow.includes("jesahel"))return 1972;let titoloPulito=pulisciTitoloFinaleAntiRemaster(titolo);let q=`recording:"${titoloPulito}"${artista?` AND artist:"${artista}"`:""}`;let anni=[];try{let url=`https://musicbrainz.org/ws/2/recording/?query=${encodeURIComponent(q)}&fmt=json&limit=10`;let r=await fetch(url);let j=await r.json();if(j.recordings){for(let rec of j.recordings){if(rec['first-release-date']){let y=parseInt(rec['first-release-date'].substring(0,4));if(y>1950&&y<2027)anni.push(y);}if(rec.releases){for(let rel of rec.releases){if(rel["secondary-types"]&&rel["secondary-types"].includes("Compilation"))continue;if(rel.title&&rs3IsCompilationWord(rel.title))continue;if(rel.date){let y=parseInt(rel.date.substring(0,4));if(y>1950&&y<2027)anni.push(y);}}}}} }catch(e){}if(anni.length>0){anni.sort((a,b)=>a-b);return anni[0];}}catch(e){}return null;}

async function rs3TrovaAlbumVero(artista,titolo){RS3_ALBUM_VERO="";var chiaveOverride=(String(titolo||"").toLowerCase().trim()+"|"+String(artista||"").toLowerCase().trim());if(RS3_ALBUM_VERO_OVERRIDE[chiaveOverride]){RS3_ALBUM_VERO=RS3_ALBUM_VERO_OVERRIDE[chiaveOverride];return RS3_ALBUM_VERO;}try{let titoloPulito=pulisciTitoloFinaleAntiRemaster(titolo);let q=`recording:"${titoloPulito}"${artista?` AND artist:"${artista}"`:""}`;let r=await fetch(`https://musicbrainz.org/ws/2/recording/?query=${encodeURIComponent(q)}&fmt=json&limit=10`);let j=await r.json();if(j.recordings&&j.recordings.length){let candidati=[];for(let rec of j.recordings){if(!rec.releases)continue;for(let rel of rec.releases){let t=(rel.title||"").trim();if(!t)continue;if(rel["secondary-types"]&&rel["secondary-types"].includes("Compilation"))continue;if(rs3IsCompilationWord(t))continue;if(rs3IsCompilationTravestita(t))continue;if(rs3IsCopertinaVietata(t))continue;let anno=rel.date?parseInt(String(rel.date).substring(0,4)):9999;if(!anno||anno<1950||anno>2026)anno=9999;candidati.push({titolo:t.toLowerCase(),anno:anno});}}if(candidati.length){candidati.sort((a,b)=>a.anno-b.anno||a.titolo.localeCompare(b.titolo));RS3_ALBUM_VERO=candidati[0].titolo;return RS3_ALBUM_VERO;}}}catch(e){}return "";}

            if(collN!==albumVero && !collN.startsWith(albumVero+" ")) continue;

    try{

          if(trackN!==titLow && !trackN.startsWith(titLow+" ")) continue;

      let titoloPulito=pulisciTitoloFinaleAntiRemaster(titolo);

            if(await rs3PreloadHD(hd)) return salva(hd);
          }
        }
      }
    }catch(e){}
    return null;
  }catch(e){ return null; }
