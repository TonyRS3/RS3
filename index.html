<!DOCTYPE html>
<html lang="it">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Radio Sistema 3</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',Arial,sans-serif;
    color:white;
    text-align:center;

    background:
    linear-gradient(
        rgba(0,0,0,.35),
        rgba(0,0,0,.45)
    ),
    url("studio-radio.jpeg");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;
}

.container{

    max-width:900px;

    margin:30px auto;

    padding:35px;

    background:rgba(0,0,0,.25);

    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);

    border-radius:25px;

    border:1px solid rgba(255,255,255,.15);

    box-shadow:
        0 10px 30px rgba(0,0,0,.40);
}

.logo{

    width:260px;
    max-width:90%;
    height:auto;

    border-radius:20px;

    box-shadow:
        0 0 30px rgba(255,255,255,.40);
}

h1{

    margin-top:20px;

    font-size:3rem;

    letter-spacing:2px;

    text-shadow:
        0 2px 10px rgba(0,0,0,.5);
}

.tagline{

    margin-top:12px;

    font-size:1.2rem;

    color:#fff8d6;
}

.istruzioni{

    margin-top:20px;

    font-size:1.1rem;

    font-weight:bold;

    line-height:1.5;
}

.evidenza{

    color:#ffd700;

    padding:4px 10px;

    border-radius:10px;

    border:2px solid #ff8c00;

    background:rgba(255,140,0,.15);
}

.live{

    margin-top:30px;

    font-size:2rem;

    color:#ff3333;

    font-weight:bold;

    animation:pulse 1.4s infinite;
}

@keyframes pulse{
    0%{opacity:1;}
    50%{opacity:.4;}
    100%{opacity:1;}
}

.ascolta-btn{

    display:inline-block;

    margin-top:25px;

    padding:22px 55px;

    text-decoration:none;

    color:white;

    font-size:1.4rem;

    font-weight:bold;

    border-radius:60px;

    background:
    linear-gradient(
        135deg,
        #ff512f,
        #dd2476
    );

    box-shadow:
        0 0 25px rgba(255,82,82,.8);

    transition:.3s;
}

.ascolta-btn:hover{

    transform:scale(1.05);
}

.section-title{

    margin-top:50px;
    margin-bottom:20px;

    font-size:2rem;

    color:#ffd966;
}

.cc_recenttracks_list{

    color:white !important;
}

.cc_recenttracks_list *{

    color:white !important;
}

.cc_recenttracks_list img{

    display:block !important;

    margin:15px auto !important;

    width:120px !important;

    height:auto !important;

    border-radius:12px;
}

.cc_recenttracks_list .ccbuy{

    display:none !important;
}

.footer{

    margin-top:40px;

    padding-top:20px;

    border-top:1px solid rgba(255,255,255,.25);

    color:#f5f5f5;
}

.social{

    margin-top:20px;

    font-size:1rem;
}

.social a{

    color:white;

    text-decoration:none;

    margin:0 10px;
}

@media (max-width:768px){

    body{
        background-attachment:scroll;
    }

    .container{

        margin:10px;

        padding:20px;
    }

    h1{

        font-size:2rem;
    }

    .logo{

        width:220px;
    }

    .tagline{

        font-size:1rem;
    }

    .istruzioni{

        font-size:1rem;
    }

    .live{

        font-size:1.5rem;
    }

    .section-title{

        font-size:1.4rem;
    }

    .ascolta-btn{

        position:fixed;

        bottom:15px;
        left:15px;
        right:15px;

        width:auto;

        padding:18px;

        z-index:9999;

        font-size:1.2rem;
    }

    .footer{

        padding-bottom:100px;
    }
}

</style>

<script src="https://manage.myshoutca.st/system/recenttracks.js"></script>

</head>

<body>

<div class="container">

    <img src="RADIO SISTEMA 3.jpeg"
         alt="Radio Sistema 3"
         class="logo">

    <h1>RADIO SISTEMA 3</h1>

    <div class="tagline">
        🎙️ La musica che accompagna le tue giornate
    </div>

    <div class="istruzioni">
        🎧 Premi <span class="evidenza">ASCOLTA IN DIRETTA</span>
        per ascoltare subito Radio Sistema 3
    </div>

    <div class="live">
        🔴 ON AIR 24/7
    </div>

    <a class="ascolta-btn"
       href="https://manage.myshoutca.st/start/bomyydij/"
       target="_blank"
       rel="noopener noreferrer">

       🎧 ASCOLTA IN DIRETTA

    </a>

    <div class="section-title">
        🎵 Brano in onda
    </div>

    <div
        class="cc_recenttracks_list"
        data-username="bomyydij">
    </div>

    <div class="footer">

        © Radio Sistema 3

        <br><br>

        La radio delle tue emozioni

    </div>

</div>

</body>
</html>
