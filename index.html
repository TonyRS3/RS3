<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radio Sistema 3</title>
<script src="https://manage.myshoutca.st/system/recenttracks.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Segoe UI,Arial,sans-serif;color:white;text-align:center;background:linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.55)),url("studio-radio.jpeg");background-size:cover;background-position:center;background-attachment:fixed;}
.container{max-width:900px;margin:25px auto;padding:30px;background:rgba(255,255,255,.08);backdrop-filter:blur(8px);border-radius:25px;border:1px solid rgba(255,255,255,.15);}
.logo{width:260px;height:260px;object-fit:cover;border-radius:20px;}
.section-title{font-size:1.6rem;margin-bottom:12px;color:#ffd966;}
.player-box{margin-top:25px;background:rgba(255,255,255,.10);padding:15px;border-radius:20px;width:420px;max-width:90%;margin:0 auto;}
audio{width:100%;}
.cc_recenttracks_list{margin-top:10px !important;color:white !important;text-align:left !important;max-width:420px;margin-left:auto;margin-right:auto;background:rgba(0,0,0,.3);padding:10px;border-radius:12px;}
.cc_recenttracks_list *{color:white !important;}
.cc_recenttracks_list .ccbuy{display:none !important;}
.cc_recenttracks_list img{opacity:1 !important; display:inline-block !important; width:90px !important; height:90px !important; object-fit:cover; border-radius:8px; margin-right:10px; vertical-align:middle; border:1px solid rgba(255,255,255,.2);}
.topcharts-window{margin-top:30px;background:rgba(255,255,255,.10);padding:20px;border-radius:20px;border:1px solid rgba(255,217,102,.3);}
.grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(130px,1fr)); gap:14px; margin-top:14px;}
.card{background:rgba(0,0,0,.4); border-radius:12px; overflow:hidden; text-decoration:none; color:#fff; position:relative; display:block; border:1px solid rgba(255,255,255,.1);}
.card:hover{transform:scale(1.05); border-color:#ffd966;}
.card img{width:100%; aspect-ratio:1; object-fit:cover;}
.card .info{padding:8px; text-align:left; font-size:0.85rem;}
.play-badge{position:absolute; bottom:40px; right:7px; background:#ffd966; color:#000; width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:bold;}
</style>
</head>
<body>
<div class="container">
<img src="RADIO SISTEMA 3.jpeg" class="logo">
<h1>RADIO SISTEMA 3</h1>
<div class="player-box"><audio controls><source src="https://listentomystream.com:8046/;" type="audio/mpeg"></audio></div>

<div class="section-title" style="margin-top:15px;">🎵 Brano in onda</div>
<div class="cc_recenttracks_list" data-username="bomyydij"></div>

<div class="topcharts-window">
<div class="section-title">💿 Clicca la Cover per ascoltare su Top-Charts</div>
<div class="grid">
<a class="card" href="https://www.top-charts.com/search?q=%22KATSEYE%22%20%22Animal%22" target="_blank">
<img src="cover/Animal.jpg" onerror="this.src='https://via.placeholder.com/300?text=Animal'"><div class="play-badge">▶</div><div class="info"><b>Animal</b><span>KATSEYE</span></div></a>

<a class="card" href="https://www.top-charts.com/search?q=%22ZinGroove%22%20%22Love+Science%22" target="_blank">
<img src="cover/Love_Science.jpg" onerror="this.src='https://via.placeholder.com/300?text=Love+Science'"><div class="play-badge">▶</div><div class="info"><b>Love Science</b><span>ZinGroove</span></div></a>

<a class="card" href="https://www.top-charts.com/search?q=%22Elisa%22%20%22Kintsugi%22" target="_blank">
<img src="cover/Kintsugi.jpg" onerror="this.src='https://via.placeholder.com/300?text=Kintsugi'"><div class="play-badge">▶</div><div class="info"><b>Kintsugi</b><span>Elisa</span></div></a>
</div>
</div>
</div>
</body>
</html>
