<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Radio Sistema 3</title>

<style>

body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:Arial, Helvetica, sans-serif;
    text-align:center;
}

.container{
    max-width:900px;
    margin:auto;
    padding:30px 20px;
}

.logo{
    width:250px;
    max-width:80%;
    height:auto;
}

h1{
    margin:20px 0 10px;
    font-size:3rem;
    font-weight:bold;
}

.slogan{
    font-size:22px;
    margin-bottom:20px;
}

.live{
    color:#ff3b3b;
    font-size:28px;
    font-weight:bold;
    margin:20px 0;
}

.btn{
    display:inline-block;
    background:#f15a24;
    color:#fff;
    text-decoration:none;
    padding:15px 40px;
    border-radius:40px;
    font-size:24px;
    font-weight:bold;
    margin:20px 0;
    transition:.3s;
}

.btn:hover{
    background:#ff6d35;
}

.footer{
    margin:20px 0 30px 0;
    font-size:20px;
}

/* COPERTINA */
.cc_streaminfo[data-type="trackimageurl"]{
    width:280px !important;
    max-width:90%;
    margin-top:25px;
    border-radius:12px;
    box-shadow:0 0 25px rgba(241,90,36,.7);
}

/* TITOLO BRANO */
.cc_streaminfo[data-type="tracktitle"]{
    display:block !important;
    font-size:42px !important;
    font-weight:900 !important;
    color:#ffffff !important;
    margin:20px auto 10px auto !important;
    text-shadow:0 0 12px rgba(255,255,255,.8);
    line-height:1.2;
}

/* ARTISTA */
.cc_streaminfo[data-type="trackartist"]{
    display:block !important;
    font-size:30px !important;
    font-weight:bold !important;
    color:#f15a24 !important;
    margin-bottom:20px !important;
}

/* NASCONDE BUY THIS ALBUM */
a.cc_streaminfo[data-type="trackbuyurl"]{
    display:none !important;
}

/* NASCONDE EVENTUALI LINK ACQUISTO */
a[href*="buy"],
a[href*="amazon"],
a[href*="itunes"]{
    display:none !important;
}

/* NASCONDE IL GENERE */
.cc_streaminfo[data-type="trackgenre"]{
    display:none !important;
}

</style>
</head>

<body>

<div class="container">

    <img src="RADIO SISTEMA 3.jpeg"
         alt="Radio Sistema 3"
         class="logo">

    <h1>RADIO SISTEMA 3</h1>

    <div class="slogan">
        Musica, informazione e intrattenimento
    </div>

    <div class="live">
        🔴 IN DIRETTA
    </div>

    <a class="btn"
       href="http://manage.myshoutca.st:8046/stream"
       target="_blank">
       ▶ ASCOLTA LIVE
    </a>

    <div class="footer">
        La radio delle tue emozioni
    </div>

    <div class="cc_recenttracks_list"
         data-username="bomyydij">
         Caricamento...
    </div>

    <script
      src="https://manage.myshoutca.st/system/recenttracks.js">
    </script>

    <br><br>

    <img
       class="cc_streaminfo"
       data-type="trackimageurl"
       data-username="bomyydij">

    <div
       class="cc_streaminfo"
       data-type="tracktitle"
       data-username="bomyydij">
    </div>

    <div
       class="cc_streaminfo"
       data-type="trackartist"
       data-username="bomyydij">
    </div>

</div>

</body>
</html>
