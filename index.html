body.popup-mode .logo, body.popup-mode h1, body.popup-mode .live, body.popup-mode .footer{display:none}
body.popup-mode .top-title{display:block !important}

body.popup-mode .vu-wrap{max-width:260px !important; padding:2px 5px !important; margin-top:4px !important;}

body.popup-mode .cc_recenttracks_list{height:72px !important; min-height:72px !important; padding:4px 6px !important; background:rgba(0,0,0,.55) !important; border-radius:10px !important;}

<body>

</div>
<script>
if(new URLSearchParams(location.search).get('popup')==='1'){document.body.classList.add('popup-mode');}
function setupChannelNav(){
  const isPopup = new URLSearchParams(location.search).get('popup')==='1';
  const btnMain=document.getElementById('btnMain'),btnSoul=document.getElementById('btnSoul'),footerSoul=document.getElementById('footerSoul');
  if(isPopup){
    btnMain.href='index.html?popup=1';btnSoul.href='soul.html?popup=1';if(footerSoul)footerSoul.href='soul.html?popup=1';
    [btnMain,btnSoul].forEach(btn=>{btn.addEventListener('click',function(e){e.preventDefault();window.location.href=this.getAttribute('href');});});
  }else{btnMain.href='index.html';btnSoul.href='soul.html';if(footerSoul)footerSoul.href='soul.html?play=1';}
}
setupChannelNav();
function isAllWhite(img,cb){const t=new Image();t.crossOrigin="anonymous";t.onload=function(){const c=document.createElement('canvas');c.width=t.width;c.height=t.height;const ctx=c.getContext('2d');ctx.drawImage(t,0,0);try{const d=ctx.getImageData(0,0,c.width,c.height).data;let white=0,tot=0;for(let i=0;i<d.length;i+=4*20){tot++;if(d[i]>240&&d[i+1]>240&&d[i+2]>240)white++;}cb(white>tot*0.9);}catch(e){cb(false);}};t.onerror=()=>cb(false);t.src=img.src;}
function fetchRealCover(q,img){fetch('https://itunes.apple.com/search?term='+encodeURIComponent(q)+'&media=music&limit=1').then(r=>r.json()).then(j=>{if(j.results&&j.results[0]&&j.results[0].artworkUrl100){img.src=j.results[0].artworkUrl100.replace('100x100','300x300');}}).catch(()=>{});}
function handleCover(img){if(img.dataset.done=="1")return;const isPopup=new URLSearchParams(location.search).get('popup')==='1';const finalSize=isPopup?60:76;isAllWhite(img,allWhite=>{if(allWhite){img.dataset.done="1";const box=document.querySelector('.cc_recenttracks_list');let txt=box?box.innerText:'';txt=txt.replace(/\n+/g,' ').replace(/Unknown/gi,'').trim().substring(0,80);if(txt.length>3)fetchRealCover(txt,img);}else{const t=new Image();t.crossOrigin="anonymous";t.onload=function(){const w=t.width,h=t.height;const c=document.createElement('canvas');const ctx=c.getContext('2d');c.width=w;c.height=h;ctx.drawImage(t,0,0);const data=ctx.getImageData(0,0,w,h).data;let top=0,bottom=h,left=0,right=w;for(let y=0;y<h;y++){let wr=true;for(let x=0;x<w;x++){let i=(y*w+x)*4;if(data[i]<230||data[i+1]<230||data[i+2]<230){wr=false;break;}}if(!wr){top=y;break;}}for(let y=h-1;y>=0;y--){let wr=true;for(let x=0;x<w;x++){let i=(y*w+x)*4;if(data[i]<230||data[i+1]<230||data[i+2]<230){wr=false;break;}}if(!wr){bottom=y+1;break;}}for(let x=0;x<w;x++){let wc=true;for(let y=top;y<bottom;y++){let i=(y*w+x)*4;if(data[i]<230||data[i+1]<230||data[i+2]<230){wc=false;break;}}if(!wc){left=x;break;}}for(let x=w-1;x>=0;x--){let wc=true;for(let y=top;y<bottom;y++){let i=(y*w+x)*4;if(data[i]<230||data[i+1]<230||data[i+2]<230){wc=false;break;}}if(!wc){right=x+1;break;}}right=right-Math.round(w*0.02);left=left+Math.round(w*0.02);top=top+Math.round(h*0.02);bottom=bottom-Math.round(h*0.02);const cw=right-left,ch=bottom-top;const o=document.createElement('canvas');o.width=finalSize;o.height=finalSize;const octx=o.getContext('2d');octx.imageSmoothingQuality='high';octx.drawImage(c,left,top,cw,ch,0,0,finalSize,finalSize);img.src=o.toDataURL('image/jpeg',0.92);};t.src=img.src;img.dataset.done="1";}});}
function hideUnknownRow(){const box=document.querySelector('.cc_recenttracks_list');if(!box)return;box.querySelectorAll('*').forEach(el=>{if(el.children.length===0&&el.textContent.trim().toLowerCase()==='unknown'){el.style.display='none';}});}
const list=document.querySelector('.cc_recenttracks_list');if(list){new MutationObserver(()=>{document.querySelectorAll('.cc_recenttracks_list img').forEach(handleCover);hideUnknownRow();}).observe(list,{childList:true,subtree:true});setInterval(()=>{document.querySelectorAll('.cc_recenttracks_list img').forEach(handleCover);hideUnknownRow();},1500);}
const c=document.getElementById('vuCanvas'),x=c.getContext('2d');let l=0,r=0;
function draw(){
  x.clearRect(0,0,c.width,c.height);x.fillStyle='#111118';x.fillRect(0,0,c.width,c.height);
  let bars=36,bw=c.width/bars,g=1.5,rh=c.height/2-2,al=Math.floor((l/100)*bars),ar=Math.floor((r/100)*bars);
  for(let i=0;i<bars;i++){let lit=i<al;x.fillStyle=lit?(i<21?'#2aff2a':i<30?'#d4ff00':'#ff3b3b'):'#1e2a1e';x.fillRect(i*bw+g,1,bw-g*2,lit?rh-1:rh*0.4)}
  x.fillStyle='#333';x.fillRect(0,c.height/2-.5,c.width,1);
  for(let i=0;i<bars;i++){let lit=i<ar;x.fillStyle=lit?(i<21?'#2abfff':i<30?'#ffe600':'#ff3b3b'):'#1e2a2e';x.fillRect(i*bw+g,c.height/2+1,bw-g*2,lit?rh-1:rh*0.4)}
  requestAnimationFrame(draw)
}
// FIX LEVEL - ARRIVA FINO AL ROSSO
function upd(){
  let base = 35 + Math.random()*65;
  let peak = Math.random() < 0.15 ? 85 + Math.random()*15 : base;
  l += (peak + Math.random()*10 - l) * 0.35;
  r += (base + Math.random()*15 - r) * 0.35;
  if(l>100)l=100; if(r>100)r=100;
}
draw();setInterval(upd,70);
</script>
