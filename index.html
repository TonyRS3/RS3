<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Radio Sistema 3 - Manutenzione</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:'Segoe UI',Arial,sans-serif;

    background:
    linear-gradient(
        rgba(0,0,0,.35),
        rgba(0,0,0,.35)
    ),
    url("studio-radio.jpeg");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    color:white;

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    text-align:center;
}

.box{

    width:90%;
    max-width:700px;

    padding:50px;

    background:rgba(255,255,255,.10);

    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);

    border-radius:25px;

    border:1px solid rgba(255,255,255,.20);

    box-shadow:
    0 0 30px rgba(0,0,0,.30);
}

.logo{

    width:180px;
    max-width:80%;

    margin-bottom:25px;

    border-radius:20px;

    box-shadow:
    0 0 25px rgba(255,255,255,.35);
}

h1{

    font-size:3rem;

    margin-bottom:20px;

    text-shadow:
    0 2px 10px rgba(0,0,0,.5);
}

.status{

    font-size:2rem;

    color:#ffd966;

    font-weight:bold;

    margin-bottom:20px;

    animation:pulse 2s infinite;
}

.message{

    font-size:1.2rem;

    line-height:1.8;

    margin-bottom:30px;
}

.ascolta-btn{

    display:inline-block;

    padding:18px 45px;

    color:white;
    text-decoration:none;

    font-size:1.3rem;
    font-weight:bold;

    border-radius:60px;

    background:
    linear-gradient(
        135deg,
        #ff512f,
        #dd2476
    );

    box-shadow:
    0 0 25px rgba(255,82,82,.6);

    transition:.3s;
}

.ascolta-btn:hover{

    transform:scale(1.08);
}

.footer{

    margin-top:35px;

    opacity:.9;
}

@keyframes pulse{

    0%{
        opacity:1;
    }

    50%{
        opacity:.5;
    }

    100%{
        opacity:1;
    }
}

@media(max-width:768px){

    .box{
        padding:30px;
    }

    h1{
        font-size:2rem;
    }

    .status{
        font-size:1.4rem;
    }

    .message{
        font-size:1rem;
    }

    .logo{
        width:140px;
    }

    .ascolta-btn{
        width:100%;
    }
}

</style>

</head>

<body>

<div class="box">

    <img src="RADIO SISTEMA 3.jpeg"
         alt="Radio Sistema 3"
         class="logo">

    <h1>RADIO SISTEMA 3</h1>

    <div class="status">
        🚧 STIAMO MIGLIORANDO IL SITO 🚧
    </div>

    <div class="message">

        Stiamo effettuando alcuni aggiornamenti
        per offrirti un'esperienza ancora migliore.

        <br><br>

        Il sito tornerà online al più presto.

        <br><br>

        <strong>La musica continua!</strong> 🎧

    </div>

    <a class="ascolta-btn"
       href="https://manage.myshoutca.st/start/bomyydij/"
       target="_blank"
       rel="noopener noreferrer">

       ▶️ CONTINUA AD ASCOLTARCI

    </a>

    <div class="footer">

        <br><br>

        © Radio Sistema 3

        <br>

        La radio delle tue emozioni

    </div>

</div>

</body>

</html>
