<script>
const CACHE_VERSION='v185_POPUP_FIX';
function apriNovita(){var a=document.getElementById('radioAudio');if(a){try{a.pause();}catch(e){}window._pausedForPlaylist=true;}document.getElementById('novitaSection').style.display='block';document.getElementById('btnNovita').style.display='none';document.getElementById('novitaPlayerMain').innerHTML=PLACEHOLDER_HTML;renderNovita();}
function chiudiNovita(){document.getElementById('novitaPlayerMain').innerHTML=PLACEHOLDER_HTML;document.getElementById('novitaList').innerHTML="";document.getElementById('novitaList').dataset.done="0";document.getElementById('novitaSection').style.display='none';document.getElementById('btnNovita').style.display='inline-block';if(window._pausedForPlaylist){window._pausedForPlaylist=false;tryAutoPlay();}}
function playNovita(id,el){var a=document.getElementById('radioAudio');if(a){try{a.pause();}catch(e){}window._pausedForPlaylist=true;}document.querySelectorAll('.novita-row').forEach(x=>x.classList.remove('active'));el.classList.add('active');document.getElementById('novitaPlayerMain').innerHTML='<iframe src="https://www.youtube.com/embed/'+id+'?autoplay=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>';}
function renderNovita(){const c=document.getElementById('novitaList');if(c.dataset.done=="1")return;c.dataset.done="1";c.innerHTML=BRANI_NOVITA.map(b=>{const bb=normalizzaBrano(b);return `<div class="novita-row" onclick="playNovita('${bb.id}', this)"><img src="https://i.ytimg.com/vi/${bb.id}/hqdefault.jpg" style="width:50px;height:38px;border-radius:4px"><div><b style="font-size:0.9rem">${bb.artista}</b><br><span style="color:#aaa;font-size:.75rem">${bb.titolo}</span></div><div style="margin-left:auto;color:#ff0033">▶</div></div>`;}).join('');}
function dedup(list){const v=new Set();return list.filter(n=>{const k=(n.title||'').toLowerCase().slice(0,60).trim();if(!k||v.has(k))return false;v.add(k);return true;});}
function isMusicaVera(titolo){if(!titolo)return false;const t=titolo.toLowerCase();const blacklist=["fascismo","fascista","trump","meloni","salvini","governo","parlamento","politica","pacifica","opposizione","mcdonagh","martin mcdonagh","premio fiesole","narrativa","romanzo","libro","agrippa","robert harris","mondadori","einaudi","feltrinelli","biblioteca","poesia","saggio","under 40","visonà","fermare il","come possiamo"];for(let b of blacklist){if(t.includes(b))return false;}const whitelist=["musica","canzone","canzoni","singolo","album","concerto","concerti","tour","sanremo","cantante","cantanti","artista","band","disco","dischi","festival","hit","classifica","ozzfest","ozzy","osbourne","u2","carnaval de luz"];if(t.includes("ozzfest")||t.includes("ozzy")||t.includes("u2")||t.includes("carnaval de luz"))return true;for(let w of whitelist){if(t.includes(w))return true;}return false;}
async function fetchRSS_Ultra(url){const ts=Date.now();const clean=url+(url.includes('?')?'&':'?')+'t='+ts;const tries=[async()=>{const r=await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(clean)}`,{cache:'no-store'});const j=await r.json();return j.contents;},async()=>{const r=await fetch(`https://corsproxy.io/?${encodeURIComponent(clean)}`,{cache:'no-store'});return await r.text();},async()=>{const r=await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}&_t=${ts}`,{cache:'no-store'});const d=await r.json();if(d.items){let f='<rss><channel>';d.items.slice(0,10).forEach(it=>{f+=`<item><title><![CDATA[${it.title}]]></title><link>${it.link}</link></item>`;});f+='</channel></rss>';return f;}throw 0;}];for(let fn of tries){try{const xmlText=await Promise.race([fn(),new Promise((_,rej)=>setTimeout(()=>rej('to'),4000))]);if(!xmlText||!xmlText.includes('<item'))continue;const xml=new DOMParser().parseFromString(xmlText,"text/xml");const items=[...xml.querySelectorAll("item")].slice(0,10);if(items.length)return items.map(it=>({title:it.querySelector("title")?.textContent||"",link:it.querySelector("link")?.textContent||"#"}));}catch(e){continue;}}return null;}
async function fetchMulti(urls,soloMusica=false){const all=[];for(let u of urls){try{const r=await fetchRSS_Ultra(u);if(r)all.push(...r);}catch(e){}}let uniq=dedup(all);if(soloMusica){uniq=uniq.filter(n=>isMusicaVera(n.title));}if(uniq.length>4){const prime=uniq.slice(0,2);let resto=uniq.slice(2);for(let i=resto.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[resto[i],resto[j]]=[resto[j],resto[i]];}return [...prime,...resto.slice(0,2)];}return uniq.slice(0,4);}

function pulisciTitolo(raw){
  let t=raw||"";t=t.replace(/Radio Sistema 3/gi,'').trim();t=t.replace(/Buy this album/gi,'').trim();t=t.replace(/Buy/gi,'').trim();t=t.replace(/^\s*\d{1,2}:\d{2}(?::\d{2})?\s*(AM|PM)?\s*/i,'').trim();t=t.replace(/^(AM|PM)\s*/i,'').trim();t=t.replace(/^[-–—\s]+/,'').trim();
  t=t.replace(/\]([A-Za-z])/g, '] $1');t=t.replace(/\)([A-Z])/g, ') $1');t=t.replace(/\s{2,}/g,' ').trim();return t;
}
function pulisciTitoloFinale(t){
  if(!t) return t;
  t=t.replace(/\s*[\(\[][^\)\]]*remaster[^\)\]]*[\)\]]/gi,'').trim();
  t=t.replace(/\s*-\s*\d{4}\s*-\s*remaster.*$/gi,'').trim();
  t=t.replace(/\s*-\s*.*remaster.*$/gi,'').trim();
  t=t.replace(/\s+\d{4}\s+Remaster(ed)?/gi,'').trim();
  t=t.replace(/\s+Remaster(ed)?(\s+\d{4})?/gi,'').trim();
  t=t.replace(/\s*\[ga R\]\s*/gi,'').trim();
  t=t.replace(/\s*\[.*?R\]\s*$/gi,'').trim();
  t=t.replace(/\s*\[.*?\]\s*$/,'').trim();
  return t;
}
function rimuoviTitoloDuplicato(s){if(!s) return s;let w=s.trim().split(/\s+/);if(w.length<5) return s;for(let len=3; len>=2; len--){if(w.length>len*2){let first=w.slice(0,len).join(' ').toLowerCase();let last=w.slice(-len).join(' ').toLowerCase();if(first===last){return w.slice(0,-len).join(' ').trim();}}}return s;}
function parseArtistTitleSmart(s){
  if(!s) return {titolo:"", artista:""};
  s=s.replace(/\s+/g,' ').trim();
  s=pulisciTitoloFinale(s);
  let sep = s.includes(' - ') ? ' - ' : (s.includes(' – ') ? ' – ' : (s.includes(' — ') ? ' — ' : null));
  if(sep){
    let parts=s.split(sep);
    let artista=parts[0].trim();
    let titolo=parts.slice(1).join(sep).trim();
    titolo=pulisciTitoloFinale(titolo);
    return {titolo, artista};
  }
  return {titolo: pulisciTitoloFinale(s), artista:""};
}

async function rebuildTrackBox(){
  const mioBox=creaMioBox();const hidden=document.querySelector('.cc_recenttracks_list');if(!mioBox) return;let rawImg=getLogoAssoluto();
  try{
    let sourceHTML=hidden?hidden.innerHTML:"";

    let titleEl=tempScan.querySelector('[class*="title"], .cc_title, [class*="song"]');

      let art = artistEl.innerText.trim();

      tempScan.querySelectorAll('img,script,style').forEach(el=>el.remove());
      tempScan.querySelectorAll('div, span, p, b').forEach(d=>{
        let t=pulisciTitolo(d.innerText||"");

          if(t.toLowerCase().includes('buy this')) return;

      });
    }
    if(righe.length>=1){
      let rawCombined=righe.join(' ');
      rawCombined=rimuoviTitoloDuplicato(rawCombined);
      let parsed=parseArtistTitleSmart(rawCombined);
      let titolo=parsed.titolo;

        if(titolo.toLowerCase()===_lastArtist.toLowerCase() && artista.toLowerCase()===_lastTitolo.toLowerCase()){
          return;

      }
      let txt=titolo+" - "+artista;

      let info=mioBox.querySelector('.rs3-info');

  }catch(e){}
}

const vuCanvas=document.getElementById('vuCanvas');const vuCtx=vuCanvas.getContext('2d');const vuPeakEl=document.getElementById('vuPeak');
let isPlaying=false,lL=0,lR=0;
let audioCtx=null,analyser=null,dataArray=null,sourceNode=null,realMode=false;
let realFailed=false;
function initRealVU(){
  try{
    if(realFailed) return false;
    if(audioCtx){ 
      if(audioCtx.state==='suspended') audioCtx.resume(); 
      return realMode; 
    }
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    analyser.smoothingTimeConstant = 0.75;
    dataArray = new Uint8Array(analyser.frequencyBinCount);
    sourceNode = audioCtx.createMediaElementSource(radioEl);
    sourceNode.connect(analyser);
    analyser.connect(audioCtx.destination);
    realMode=true; return true;
  }catch(e){ realMode=false; realFailed=true; return false; }
}
function draw(){
  const W=vuCanvas.width,H=vuCanvas.height;
  vuCtx.clearRect(0,0,W,H); vuCtx.fillStyle='#0a0a0a'; vuCtx.fillRect(0,0,W,H);
  let bars=36,barW=W/bars,gap=1.5,rowH=H/2-2;
  let aL=Math.floor((lL/100)*bars);
  for(let i=0;i<bars;i++){let x=i*barW;let lit=i<aL;vuCtx.fillStyle=lit?(i<21?'#00ff2a':i<30?'#ffea00':'#ff1a1a'):'#1a1a1a';vuCtx.fillRect(x+gap,1+(rowH-(lit?rowH-1:rowH*0.4))/2,barW-gap*2,lit?rowH-1:rowH*0.4);}
  vuCtx.fillStyle='#333';vuCtx.fillRect(0,H/2-0.5,W,1);
  let aR=Math.floor((lR/100)*bars);
  for(let i=0;i<bars;i++){let x=i*barW;let lit=i<aR;vuCtx.fillStyle=lit?(i<21?'#00d4ff':i<30?'#ffea00':'#ff1a1a'):'#1a1a1a';vuCtx.fillRect(x+gap,H/2+1+(rowH-(lit?rowH-1:rowH*0.4))/2,barW-gap*2,lit?rowH-1:rowH*0.4);}
  requestAnimationFrame(draw);
}
function upd(){
  if(!isPlaying){
    let idle = 10 + Math.random()*14;
    let tL = idle + Math.random()*6;
    let tR = idle + Math.random()*6;
    lL+=(tL-lL)*0.08; 
    lR+=(tR-lR)*0.08;
    return;
  }
  if(realMode && analyser && dataArray && !realFailed){
    try{
      analyser.getByteFrequencyData(dataArray);
      let sum=0; for(let i=0;i<dataArray.length;i++) sum+=dataArray[i];
      if(sum < 10){
        throw 'cors';
      }
      let vol=Math.min(100,(sum/dataArray.length/255)*100*1.9);
      let tL=vol*(0.97+Math.random()*0.06);
      let tR=vol*(0.97+Math.random()*0.06);
      if(vol>72 && Math.random()<0.3){tL=Math.min(100,tL+8);tR=Math.min(100,tR+8);}
      lL+=(tL-lL)*0.52; lR+=(tR-lR)*0.52; return;
    }catch(e){ 
      realMode=false; realFailed=true;
    }
  }
  let base=40+Math.random()*45;let peak=Math.random()<0.18;
  let tL=peak?88+Math.random()*12:base+Math.random()*18;
  let tR=peak?85+Math.random()*15:base*0.9+Math.random()*20;
  lL+=(tL-lL)*0.38;lR+=(tR-lR)*0.34;
}
