<!DOCTYPE html>
<html lang="it">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Radio Sistema 3</title>

<script src="https://manage.myshoutca.st/system/recenttracks.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:'Segoe UI',Arial,sans-serif;
    color:white;
    text-align:center;

    background:
    linear-gradient(
        rgba(0,0,0,.35),
        rgba(0,0,0,.55)
    ),
    url("studio-radio.jpeg");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;
}

.container{

    max-width:900px;
    margin:30px auto;
    padding:30px;

    background:rgba(255,255,255,.08);

    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);

    border-radius:25px;

    border:1px solid rgba(255,255,255,.20);

    box-shadow:
        0 10px 25px rgba(0,0,0,.35);
}

/* LOGO */

.logo{

    width:320px;
    max-width:90%;

    height:auto;

    border-radius:20px;

    box-shadow:
        0 0 25px rgba(255,255,255,.35);
}

h1{

    margin-top:20px;

    font-size:3rem;

    text-shadow:
        0 2px 8px rgba(0,0,0,.5);
}

.tagline{

    margin-top:10px;

    font-size:1.2rem;

    color:#ffd966;
}

.live{

    margin-top:20px;

    font-size:1.8rem;

    font-weight:bold;

    color:#ff3333;

    animation:pulse 1.5s infinite;
}

@keyframes pulse{

    0%{opacity:1;}
    50%{opacity:.4;}
    100%{opacity:1;}
}

.player-box{

    margin-top:30px;

    padding:20px;

    background:rgba(255,255,255,.08);

    border-radius:20px;
}

.player-title{

    font-size:1.5rem;

    margin-bottom:15px;

    color:#ffd966;
}

/* PLAYER */

audio{

    width:300px;

    max-width:100%;
}

.section-title{

    margin-top:40px;

    margin-bottom:15px;

    font-size:1.5rem;

    color:#ffd966;
}

/* RECENT TRACKS */

.cc_recenttracks_list{
    color:white !important;
}

.cc_recenttracks_list *{
    color:white !important;
}

.cc_recenttracks_list img{

    display:block !important;

    margin:15px auto !important;

    width:120px !important;

    border-radius:12px;
}

.cc_recenttracks_list .ccbuy{
    display:none !important;
}

/* FOOTER */

.footer{

    margin-top:40px;

    padding-top:20px;

    border-top:1px solid rgba(255,255,255,.20);
}

/* MOBILE */

@media(max-width:768px){

    body{
        background-attachment:scroll;
    }

    .container{
        margin:12px;
        padding:20px;
    }

    h1{
        font-size:2rem;
    }

    .logo{
        width:260px;
    }

    .tagline{
        font-size:1rem;
    }

    .live{
        font-size:1.4rem;
    }

    audio{
        width:100%;
    }

}

</style>

</head>

<body>

<div class="container">

    <img
        src="RADIO SISTEMA 3.jpeg"
        alt="Radio Sistema 3"
        class="logo">

    <h1>RADIO SISTEMA 3</h1>

    <div class="tagline">
        🎙️ La musica che accompagna le tue giornate
    </div>

    <div class="live">
        🔴 ON AIR 24/7
    </div>

    <div class="player-box">

        <div class="player-title">
            🎧 Ascolta in diretta
        </div>

        <audio controls preload="none">
            <source src="https://listentomystream.com:8046/" type="audio/mpeg">
        </audio>

    </div>

    <div class="section-title">
        🎵 Brano in onda
    </div>

    <div
        class="cc_recenttracks_list"
        data-username="bomyydij">
    </div>

    <div class="footer">

        © Radio Sistema 3

        <br><br>

        La radio delle tue emozioni

    </div>

</div>

</body>
</html>
