<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Radio Sistema 3</title>
<script src="https://manage.myshoutca.st/system/recenttracks.js"></script>
<script>
const BRANI_NOVITA = [
  { id: "pzvhHsEqMzo", artista: "Marco Mengoni", titolo: "Giornate Perse" },
  { id: "wCaQfXxxRqg", artista: "Hugel & David Guetta", titolo: "Shine (feat. French Montana, Aidan Martin)" },
  { id: "clkCS0Fk8Hk", artista: "Lil Nas X", titolo: "World's Greatest!" },
  { id: "mw3kSNIxjqo", artista: "Taylor Swift", titolo: "Patient Zero" },
  { id: "frWVNdwHuGM", artista: "Baby K feat Guè", titolo: "Amore / Dilemma" },
  { id: "dQw4w9WgXcQ", artista: "Esempio", titolo: "Aggiungi quanti vuoi" }
];
const LOGO_AUTORADIO = "RADIO SISTEMA 3.jpeg";
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Segoe UI,Arial,sans-serif;color:white;text-align:center;background:linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.55)),url("studio-radio.jpeg");background-size:cover;background-position:center;background-attachment:fixed;}
.container{max-width:900px;margin:25px auto;padding:30px;background:rgba(255,255,255,.08);backdrop-filter:blur(8px);border-radius:25px;border:1px solid rgba(255,255,255,.15);}
.logo-wrap{display:inline-block;padding:5px;border-radius:26px;background:linear-gradient(135deg,#ff512f,#dd2476,#ffd966,#00d4ff,#ff512f);background-size:300% 300%;animation:gradientMove 4s ease infinite;}
@keyframes gradientMove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.logo{width:260px;height:260px;aspect-ratio:1/1;object-fit:cover;border-radius:20px;display:block;background:#000;}
h1{margin-top:20px;font-size:3rem;}
.tagline{margin-top:15px;color:#ffe9a8;}
.live{margin-top:25px;color:#ff4444;font-size:1.9rem;font-weight:bold;animation:pulse 1.4s infinite;}
@keyframes pulse{0%{opacity:1}50%{opacity:.4}100%{opacity:1}}
.player-box{margin-top:25px;background:rgba(255,255,255,.10);padding:15px;border-radius:20px;width:420px;max-width:90%;margin:0 auto;}
.section-title{font-size:1.6rem;margin-bottom:12px;color:#ffd966;}
audio{width:100%;max-width:350px;}
.cc_recenttracks_list{margin-top:5px !important;color:white !important;text-align:left !important;max-width:420px;margin-left:auto;margin-right:auto;}
.cc_recenttracks_list *{color:white !important;line-height:1.3 !important;}
.cc_recenttracks_list .ccbuy{display:none !important;}
.cc_recenttracks_list img{opacity:0;display:block;}
.dediche-box{margin-top:30px;background:rgba(255,255,255,.10);padding:20px;border-radius:20px;border:1px solid rgba(255,217,102,.3);}
.dediche-box input, .dediche-box textarea{width:100%;max-width:400px;padding:10px 12px;margin:6px 0;border-radius:10px;border:none;background:rgba(0,0,0,.4);color:white;font-size:1rem;outline:none;}
.btn-dedica{margin-top:12px;background:linear-gradient(135deg,#ffd966,#ff9f1c);color:#000;font-weight:bold;padding:12px 25px;border:none;border-radius:30px;font-size:1.1rem;cursor:pointer;}
.footer{margin-top:20px;padding-top:20px;border-top:1px solid rgba(255,255,255,.2);}
@media(max-width:768px){.logo{width:190px;height:190px;}h1{font-size:1.9rem;}.container{margin:10px;padding:18px;} #novitaPlayerMain{width:90% !important;}}
.btn-novita{margin-top:30px;background:#ff0033;color:#fff;font-weight:900;padding:18px 32px;border:none;border-radius:50px;font-size:1.2rem;cursor:pointer;}
#novitaSection{display:none;margin-top:30px;background:rgba(0,0,0,.6);padding:15px;border-radius:20px;border:1px solid rgba(255,255,255,.15);}
#novitaPlayerMain{position:sticky;top:10px;z-index:5;width:65%;max-width:360px;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#666;margin:0 auto 15px auto;border:2px solid #ff0033}
#novitaPlayerMain iframe{width:100%;height:100%;border:0;position:absolute;top:0;left:0}
#novitaList{max-height:380px;overflow-y:auto;text-align:left}
.novita-row{display:flex;align-items:center;gap:12px;padding:8px 10px;background:#151515;border-bottom:1px solid #222;cursor:pointer;border-radius:8px;margin-bottom:6px}
.novita-row:hover{background:#222}
.novita-row.active{background:#2a0000;border:1px solid #ff0033}
.novita-row img{width:60px;height:45px;object-fit:cover;border-radius:5px}
.novita-row b{font-size:.95rem}
.novita-row span{font-size:.8rem;color:#aaa}
</style>
</head>
<body>
<div class="container">
<div class="logo-wrap"><img src="RADIO SISTEMA 3.jpeg" alt="Radio Sistema 3" class="logo"></div>
<h1>RADIO SISTEMA 3</h1>
<div class="tagline">🎙️ La musica che accompagna le tue giornate</div>
<div class="live">🔴 ON AIR 24/7</div>
<div class="player-box"><div class="section-title">🎧 Ascolta in diretta</div><audio id="radioAudio" controls preload="none"><source src="https://listentomystream.com:8046/;" type="audio/mpeg"></audio></div>
<div class="section-title" style="margin-top:10px;">🎵 Brano in onda</div>
<div class="cc_recenttracks_list" data-username="bomyydij"></div>

<button class="btn-novita" id="btnNovita" onclick="apriNovita()">▶ ASCOLTA LE NOVITA'</button>

<div id="novitaSection">
  <div class="section-title">🔥 Novità Musicali</div>
  <div id="novitaPlayerMain">👇 Scegli un brano qui sotto</div>
  <div id="novitaList"></div>
  <button class="btn-dedica" style="background:#333;color:#fff;margin-top:15px" onclick="chiudiNovita()">✕ Chiudi Novità</button>
</div>

<div class="dediche-box">
<div class="section-title">💌 Dedica una canzone</div>
<input type="text" id="nome" placeholder="Il tuo nome"><input type="text" id="perChi" placeholder="Per chi è la dedica?"><textarea id="messaggio" placeholder="Scrivi il tuo messaggio..."></textarea><input type="text" id="canzone" placeholder="Canzone richiesta (opzionale)"><br><button class="btn-dedica" onclick="inviaDedica()">📩 INVIA DEDICA</button>
</div>
<div class="footer">© Radio Sistema 3<br><br>La radio delle tue emozioni<br><br>Licenza SIAE n° 202600000389</div>
</div>

<script>
function apriNovita(){
  const r=document.getElementById('radioAudio'); if(r) r.pause();
  document.getElementById('novitaSection').style.display='block';
  document.getElementById('btnNovita').style.display='none';
  document.getElementById('novitaSection').scrollIntoView({behavior:'smooth'});
  renderNovita();
}
function chiudiNovita(){
  document.getElementById('novitaPlayerMain').innerHTML = "👆 Scegli un brano qui sotto";
  document.getElementById('novitaList').innerHTML = "";
  document.getElementById('novitaList').dataset.done = "0";
  document.getElementById('novitaSection').style.display='none';
  document.getElementById('btnNovita').style.display='inline-block';
  const r=document.getElementById('radioAudio'); if(r) r.play().catch(()=>{});
  aggiornaCoverAutoradio("Radio Sistema 3","ON AIR 24/7",LOGO_AUTORADIO);
}
function playNovita(id, el){
  const r=document.getElementById('radioAudio'); if(r) r.pause();
  document.querySelectorAll('.novita-row').forEach(x=>x.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('novitaPlayerMain').innerHTML='<iframe src="https://www.youtube.com/embed/'+id+'?autoplay=1&rel=0&modestbranding=1&playsinline=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe>';
}
function renderNovita(){
  const c=document.getElementById('novitaList');
  if(c.dataset.done=="1") return; c.dataset.done="1";
  c.innerHTML = BRANI_NOVITA.map(b=>`
    <div class="novita-row" onclick="playNovita('${b.id}', this)">
      <img src="https://i.ytimg.com/vi/${b.id}/hqdefault.jpg">
      <div><b>${b.artista}</b><br><span>${b.titolo}</span></div>
      <div style="margin-left:auto;color:#ff0033">▶</div>
    </div>`).join('');
}
const WHATSAPP_NUMBER = "39XXXXXXXXXX";
function inviaDedica(){
  const nome=document.getElementById('nome').value.trim();
  const perChi=document.getElementById('perChi').value.trim();
  const msg=document.getElementById('messaggio').value.trim();
  const canzone=document.getElementById('canzone').value.trim();
  if(!nome || !perChi || !msg){alert("Compila nome, per chi e messaggio!");return;}
  const testo=`*NUOVA DEDICA - RADIO SISTEMA 3*%0A%0A👤 Da: ${nome}%0A❤️ Per: ${perChi}%0A💬 Messaggio: ${msg}%0A🎵 Canzone: ${canzone || 'a scelta della regia'}`;
  window.location.href=`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(testo)}`;
}
function cleanWhiteBorder(img){
  if(img.dataset.cleaned==="1") return; img.dataset.cleaned="1";
  const isMobile=window.innerWidth<768; const finalSize=isMobile?80:100;
  const tempImg=new Image();tempImg.crossOrigin="anonymous";
  tempImg.onload=function(){
    const w=tempImg.width,h=tempImg.height; const canvas=document.createElement('canvas');const ctx=canvas.getContext('2d');
    canvas.width=w;canvas.height=h;ctx.drawImage(tempImg,0,0); const data=ctx.getImageData(0,0,w,h).data;
    let top=0,bottom=h,left=0,right=w;
    for(let y=0;y<h;y++){let whiteRow=true;for(let x=0;x<w;x++){const i=(y*w+x)*4;if(data[i]<230||data[i+1]<230||data[i+2]<230){whiteRow=false;break;}}if(!whiteRow){top=y;break;}}
    for(let y=h-1;y>=0;y--){let whiteRow=true;for(let x=0;x<w;x++){const i=(y*w+x)*4;if(data[i]<230||data[i+1]<230||data[i+2]<230){whiteRow=false;break;}}if(!whiteRow){bottom=y+1;break;}}
    for(let x=0;x<w;x++){let whiteCol=true;for(let y=top;y<bottom;y++){const i=(y*w+x)*4;if(data[i]<230||data[i+1]<230||data[i+2]<230){whiteCol=false;break;}}if(!whiteCol){left=x;break;}}
    for(let x=w-1;x>=0;x--){let whiteCol=true;for(let y=top;y<bottom;y++){const i=(y*w+x)*4;if(data[i]<230||data[i+1]<230||data[i+2]<230){whiteCol=false;break;}}if(!whiteCol){right=x+1;break;}}
    right=right-Math.round(w*0.10);left=left+Math.round(w*0.02);top=top+Math.round(h*0.02);bottom=bottom-Math.round(h*0.02);
    const cw=right-left,ch=bottom-top; const out=document.createElement('canvas');out.width=finalSize;out.height=finalSize;
    const octx=out.getContext('2d');octx.imageSmoothingQuality='high'; octx.drawImage(canvas,left,top,cw,ch,0,0,finalSize,finalSize);
    img.src=out.toDataURL('image/jpeg',0.92);
    img.style.width=finalSize+"px";img.style.height=finalSize+"px";img.style.objectFit="cover";img.style.borderRadius="5px";img.style.display="inline-block";img.style.verticalAlign="middle";img.style.margin="2px 8px 2px 0";img.style.opacity="1";img.style.border="none";
  }; tempImg.src=img.src;
}
const list=document.querySelector('.cc_recenttracks_list');
new MutationObserver(()=>{document.querySelectorAll('.cc_recenttracks_list img').forEach(cleanWhiteBorder);}).observe(list,{childList:true,subtree:true});
setInterval(()=>{document.querySelectorAll('.cc_recenttracks_list img').forEach(cleanWhiteBorder);},1000);
function aggiornaCoverAutoradio(titolo, artista, immagine){
  if('mediaSession' in navigator){
    try{
      navigator.mediaSession.metadata = new MediaMetadata({
        title: titolo || "Radio Sistema 3",
        artist: artista || "Live On Air",
        album: "Radio Sistema 3",
        artwork: [{ src: immagine || LOGO_AUTORADIO, sizes: "512x512", type: "image/jpeg" }]
      });
    }catch(e){}
  }
}
document.getElementById('radioAudio').addEventListener('play', () => { aggiornaCoverAutoradio("Radio Sistema 3", "ON AIR 24/7", LOGO_AUTORADIO); });
setTimeout(()=>{ aggiornaCoverAutoradio("Radio Sistema 3","ON AIR 24/7",LOGO_AUTORADIO); }, 1000);
</script>
</body>
</html>
