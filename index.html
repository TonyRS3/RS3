<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radio Sistema 3 - STEREO SLIM</title>
<script src="https://manage.myshoutca.st/system/recenttracks.js"></script>
<script>
const BRANI_NOVITA = [
  { id: "pzvhHsEqMzo", artista: "Marco Mengoni", titolo: "Giornate Perse" },
  { id: "fRIhCiUVaKs", artista: "Karol G", titolo: "Bby Wow" }, 
  { id: "z5qAtdZh5Uo", artista: "Giorgia", titolo: "SIAMO L'ECCEZIONE" },
  { id: "rSiBJ4JRTv4", artista: "Alfa & Gigi D'Alessio", titolo: "Genova E Napoli" },
  { id: "D3zkX-Am4o4", artista: "Madonna", titolo: "Danceteria" },
];
const LOGO_AUTORADIO = "RADIO SISTEMA 3.jpeg";
const PLACEHOLDER_HTML = `<div style="text-align:center"><div style="color:#fff;font-weight:bold">Scegli un brano</div><div style="font-size:2rem">👇</div></div>`;
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Segoe UI,Arial,sans-serif;color:white;text-align:center;background:linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.55)),url("studio-radio.jpeg");background-size:cover;background-position:center;background-attachment:fixed;}
.container{max-width:900px;margin:25px auto;padding:30px;background:rgba(255,255,255,.08);backdrop-filter:blur(8px);border-radius:25px;border:1px solid rgba(255,255,255,.15);}
.logo-wrap{display:inline-block;padding:5px;border-radius:26px;background:linear-gradient(135deg,#ff512f,#dd2476,#ffd966,#00d4ff,#ff512f);background-size:300% 300%;animation:gradientMove 4s ease infinite;transition: all 0.1s;}
@keyframes gradientMove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.logo{width:260px;height:260px;object-fit:cover;border-radius:20px;display:block;background:#000;}
h1{margin-top:20px;font-size:3rem;}
.live{margin-top:15px;color:#ff4444;font-size:1.6rem;font-weight:bold;animation:pulse 1.4s infinite;}
@keyframes pulse{0%{opacity:1}50%{opacity:.4}100%{opacity:1}}
.player-box{margin-top:15px;background:rgba(255,255,255,.10);padding:12px;border-radius:20px;width:400px;max-width:92%;margin:0 auto;}
.section-title{font-size:1.4rem;margin-bottom:8px;color:#ffd966;}
audio{width:100%;max-width:340px;height:36px;}
/* FIX FODERINA - torna vicino al testo */
.cc_recenttracks_list{margin-top:8px !important;color:white !important;text-align:left !important;max-width:400px;margin-left:auto;margin-right:auto;background:rgba(0,0,0,0.3);padding:8px;border-radius:10px;}
.cc_recenttracks_list *{color:white !important;line-height:1.25 !important;font-size:0.95rem !important;}
.cc_recenttracks_list .ccbuy{display:none !important;}
.cc_recenttracks_list img{opacity:0;display:block;} /* viene sostituita da cleanWhiteBorder */
.btn-novita{margin-top:20px;background:#ff0033;color:#fff;font-weight:900;padding:14px 26px;border:none;border-radius:50px;font-size:1.1rem;cursor:pointer;}
#novitaSection{display:none;margin-top:20px;background:rgba(0,0,0,.6);padding:15px;border-radius:20px;}
#novitaPlayerMain{width:65%;max-width:340px;aspect-ratio:16/9;background:#1a1a1a;border-radius:12px;margin:0 auto 12px auto;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;border:2px dashed #555}
#novitaPlayerMain iframe{width:100%;height:100%;border:0;position:absolute;top:0;left:0}
#novitaList{max-height:350px;overflow-y:auto;text-align:left}
.novita-row{display:flex;align-items:center;gap:10px;padding:7px 9px;background:#151515;cursor:pointer;border-radius:8px;margin-bottom:5px}
/* VU STRETTO - più slim come vuoi tu */
.vu-wrap{margin-top:8px;background:rgba(0,0,0,.75);padding:6px 8px;border-radius:10px;border:1px solid rgba(255,255,255,.2);}
#vuCanvas{width:100%;height:54px;display:block;border-radius:5px;background:#0a0a0a;}
.vu-label{font-size:.7rem;color:#aaa;margin-top:3px;display:flex;justify-content:space-between;font-family:monospace;}
@keyframes bassHit {0%{transform:scale(1);}15%{transform:scale(1.04); box-shadow:0 0 20px #ff0033;}100%{transform:scale(1);}}
.bass-active .logo-wrap{animation:bassHit 0.2s ease, gradientMove 4s ease infinite !important;}
#bassFlashOverlay{position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle, rgba(255,0,51,0.15) 0%, transparent 70%);pointer-events:none;opacity:0;transition:opacity 0.1s;z-index:9999;}
#bassFlashOverlay.on{opacity:1;}
</style>
</head>
<body>
<div id="bassFlashOverlay"></div>
<div class="container">
<div class="logo-wrap"><img src="RADIO SISTEMA 3.jpeg" alt="Radio Sistema 3" class="logo"></div>
<h1>RADIO SISTEMA 3</h1>
<div class="live">🔴 ON AIR 24/7 - STEREO</div>
<div class="player-box">
<div class="section-title">🎧 Ascolta in diretta</div>
<audio id="radioAudio" controls preload="none"><source src="https://listentomystream.com:8046/;" type="audio/mpeg"></audio>
<div class="vu-wrap">
<canvas id="vuCanvas" width="600" height="54"></canvas>
<div class="vu-label"><span>L ● R STEREO SLIM</span><span id="vuPeak">STOP</span></div>
</div>
</div>
<div class="section-title" style="margin-top:8px;font-size:1.3rem">🎵 Brano in onda</div>
<div class="cc_recenttracks_list" data-username="bomyydij"></div>
<button class="btn-novita" id="btnNovita" onclick="apriNovita()">▶ PLAYLIST</button>
<div id="novitaSection">
  <div class="section-title">🔥 Playlist</div>
  <div id="novitaPlayerMain"></div>
  <div id="novitaList"></div>
  <button style="background:#333;color:#fff;margin-top:12px;padding:8px 18px;border:none;border-radius:20px" onclick="chiudiNovita()">✕ Chiudi</button>
</div>
<div class="footer" style="margin-top:15px;font-size:0.85rem">© Radio Sistema 3 - SIAE 202600000389</div>
</div>
<script>
function apriNovita(){ document.getElementById('radioAudio').pause(); document.getElementById('novitaSection').style.display='block'; document.getElementById('btnNovita').style.display='none'; document.getElementById('novitaPlayerMain').innerHTML = PLACEHOLDER_HTML; renderNovita(); }
function chiudiNovita(){ document.getElementById('novitaPlayerMain').innerHTML = PLACEHOLDER_HTML; document.getElementById('novitaList').innerHTML = ""; document.getElementById('novitaList').dataset.done = "0"; document.getElementById('novitaSection').style.display='none'; document.getElementById('btnNovita').style.display='inline-block'; document.getElementById('radioAudio').play().catch(()=>{}); }
function playNovita(id, el){ document.getElementById('radioAudio').pause(); document.querySelectorAll('.novita-row').forEach(x=>x.classList.remove('active')); el.classList.add('active'); document.getElementById('novitaPlayerMain').innerHTML='<iframe src="https://www.youtube.com/embed/'+id+'?autoplay=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>'; }
function renderNovita(){ const c=document.getElementById('novitaList'); if(c.dataset.done=="1") return; c.dataset.done="1"; c.innerHTML = BRANI_NOVITA.map(b=>`<div class="novita-row" onclick="playNovita('${b.id}', this)"><img src="https://i.ytimg.com/vi/${b.id}/hqdefault.jpg" style="width:50px;height:38px;border-radius:4px"><div><b style="font-size:0.9rem">${b.artista}</b><br><span style="color:#aaa;font-size:.75rem">${b.titolo}</span></div><div style="margin-left:auto;color:#ff0033">▶</div></div>`).join(''); }

// FIX FODERINA - rimessa vicina come prima
function cleanWhiteBorder(img){ if(img.dataset.cleaned==="1") return; img.dataset.cleaned="1"; const isMobile=window.innerWidth<768; const finalSize=isMobile?68:82; const tempImg=new Image();tempImg.crossOrigin="anonymous"; tempImg.onload=function(){ const w=tempImg.width,h=tempImg.height; const canvas=document.createElement('canvas');const ctx=canvas.getContext('2d'); canvas.width=w;canvas.height=h;ctx.drawImage(tempImg,0,0); const data=ctx.getImageData(0,0,w,h).data; let top=0,bottom=h,left=0,right=w; for(let y=0;y<h;y++){let whiteRow=true;for(let x=0;x<w;x++){const i=(y*w+x)*4;if(data[i]<230||data[i+1]<230||data[i+2]<230){whiteRow=false;break;}}if(!whiteRow){top=y;break;}} for(let y=h-1;y>=0;y--){let whiteRow=true;for(let x=0;x<w;x++){const i=(y*w+x)*4;if(data[i]<230||data[i+1]<230||data[i+2]<230){whiteRow=false;break;}}if(!whiteRow){bottom=y+1;break;}} for(let x=0;x<w;x++){let whiteCol=true;for(let y=top;y<bottom;y++){const i=(y*w+x)*4;if(data[i]<230||data[i+1]<230||data[i+2]<230){whiteCol=false;break;}}if(!whiteCol){left=x;break;}} for(let x=w-1;x>=0;x--){let whiteCol=true;for(let y=top;y<bottom;y++){const i=(y*w+x)*4;if(data[i]<230||data[i+1]<230||data[i+2]<230){whiteCol=false;break;}}if(!whiteCol){right=x+1;break;}} right=right-Math.round(w*0.10);left=left+Math.round(w*0.02);top=top+Math.round(h*0.02);bottom=bottom-Math.round(h*0.02); const cw=right-left,ch=bottom-top; const out=document.createElement('canvas');out.width=finalSize;out.height=finalSize; const octx=out.getContext('2d');octx.imageSmoothingQuality='high'; octx.drawImage(canvas,left,top,cw,ch,0,0,finalSize,finalSize); img.src=out.toDataURL('image/jpeg',0.92); img.style.width=finalSize+"px";img.style.height=finalSize+"px";img.style.objectFit="cover";img.style.borderRadius="5px";img.style.display="inline-block";img.style.verticalAlign="middle";img.style.margin="0 8px 0 0";img.style.opacity="1";img.style.border="none"; }; tempImg.src=img.src; }
const list=document.querySelector('.cc_recenttracks_list'); if(list){ new MutationObserver(()=>{document.querySelectorAll('.cc_recenttracks_list img').forEach(cleanWhiteBorder);}).observe(list,{childList:true,subtree:true}); setInterval(()=>{document.querySelectorAll('.cc_recenttracks_list img').forEach(cleanWhiteBorder);},1000); }

// VU STEREO SLIM - più stretto
const vuCanvas = document.getElementById('vuCanvas');
const vuCtx = vuCanvas.getContext('2d');
const radioEl = document.getElementById('radioAudio');
let isPlayingVU = false;
let levelL = 0, levelR = 0;
let peakL = 0, peakR = 0;
function drawStereo(){
  const W=vuCanvas.width, H=vuCanvas.height;
  vuCtx.clearRect(0,0,W,H);
  vuCtx.fillStyle='#0a0a0a';
  vuCtx.fillRect(0,0,W,H);
  let bars = 36;
  let barW = W / bars;
  let gap = 1.5;
  let rowH = H/2 - 2;
  let activeL = Math.floor((levelL/100)*bars);
  for(let i=0;i<bars;i++){
    let x = i*barW; let lit = i < activeL;
    let color = i < bars*0.6 ? (lit ? '#00ff2a' : '#001a05') : i < bars*0.84 ? (lit ? '#ffea00' : '#1a1a00') : (lit ? '#ff1a1a' : '#1a0000');
    vuCtx.fillStyle = color;
    let y = 1; let bh = lit ? rowH-1 : rowH*0.4;
    vuCtx.fillRect(x+gap, y + (rowH-bh)/2, barW-gap*2, bh);
  }
  vuCtx.fillStyle='#333'; vuCtx.fillRect(0, H/2-0.5, W, 1);
  let activeR = Math.floor((levelR/100)*bars);
  for(let i=0;i<bars;i++){
    let x = i*barW; let lit = i < activeR;
    let color = i < bars*0.6 ? (lit ? '#00d4ff' : '#001a1a') : i < bars*0.84 ? (lit ? '#ffea00' : '#1a1a00') : (lit ? '#ff1a1a' : '#1a0000');
    vuCtx.fillStyle = color;
    let y = H/2 + 1; let bh = lit ? rowH-1 : rowH*0.4;
    vuCtx.fillRect(x+gap, y + (rowH-bh)/2, barW-gap*2, bh);
  }
  vuCtx.fillStyle='#00ff2a'; vuCtx.font='bold 9px monospace'; vuCtx.fillText('L', 2, 10);
  vuCtx.fillStyle='#00d4ff'; vuCtx.fillText('R', 2, H-2);
  if(peakL > 2){ vuCtx.fillStyle='#ff0000'; vuCtx.fillRect((peakL/100)*W-1, 1, 1.5, rowH-2); }
  if(peakR > 2){ vuCtx.fillStyle='#ff0000'; vuCtx.fillRect((peakR/100)*W-1, H/2+1, 1.5, rowH-2); }
  requestAnimationFrame(drawStereo);
}
function updateStereo(){
  if(!isPlayingVU){ levelL += (0 - levelL)*0.08; levelR += (0 - levelR)*0.08; peakL += (0 - peakL)*0.05; peakR += (0 - peakR)*0.05; return; }
  let bass = Math.sin(Date.now()/125) > 0.65 ? 28 : 0;
  let base = 18 + Math.random()*28 + bass;
  let targetL = base + Math.random()*22 + (Math.random()>0.86 ? 32 : 0);
  let targetR = base*0.85 + Math.random()*28 + (Math.random()>0.83 ? 38 : 0);
  if(Math.random() > 0.91) targetL += 18;
  if(Math.random() > 0.91) targetR += 18;
  levelL += (targetL - levelL)*0.32; levelR += (targetR - levelR)*0.28;
  if(levelL > peakL) peakL = levelL; else peakL -= 0.8;
  if(levelR > peakR) peakR = levelR; else peakR -= 0.8;
  if((levelL > 78 || levelR > 78) && Math.random() > 0.78){
    document.body.classList.add('bass-active');
    document.getElementById('bassFlashOverlay').classList.add('on');
    setTimeout(()=>{ document.body.classList.remove('bass-active'); document.getElementById('bassFlashOverlay').classList.remove('on'); }, 150);
  }
  const lab = document.getElementById('vuPeak');
  if(levelL > 84 || levelR > 84) { lab.textContent=`BASS!`; lab.style.color='#ff0000'; }
  else lab.textContent=`L:${Math.round(levelL)}% R:${Math.round(levelR)}%`;
}
radioEl.addEventListener('play', ()=>{ isPlayingVU=true; });
radioEl.addEventListener('pause', ()=>{ isPlayingVU=false; });
drawStereo();
setInterval(updateStereo, 60);
document.getElementById('novitaPlayerMain').innerHTML = PLACEHOLDER_HTML;
</script>
</body>
</html>
