<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radio Sistema 3 - STEREO</title>
<script src="https://manage.myshoutca.st/system/recenttracks.js"></script>
<script>
const BRANI_NOVITA = [
  { id: "pzvhHsEqMzo", artista: "Marco Mengoni", titolo: "Giornate Perse" },
  { id: "fRIhCiUVaKs", artista: "Karol G", titolo: "Bby Wow" }, 
  { id: "z5qAtdZh5Uo", artista: "Giorgia", titolo: "SIAMO L'ECCEZIONE" },
  { id: "rSiBJ4JRTv4", artista: "Alfa & Gigi D'Alessio", titolo: "Genova E Napoli" },
  { id: "D3zkX-Am4o4", artista: "Madonna", titolo: "Danceteria" },
];
const LOGO_AUTORADIO = "RADIO SISTEMA 3.jpeg";
const PLACEHOLDER_HTML = `<div style="text-align:center"><div style="color:#fff;font-weight:bold">Scegli un brano</div><div style="font-size:2rem">👇</div></div>`;
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Segoe UI,Arial,sans-serif;color:white;text-align:center;background:linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.55)),url("studio-radio.jpeg");background-size:cover;background-position:center;background-attachment:fixed;}
.container{max-width:900px;margin:25px auto;padding:30px;background:rgba(255,255,255,.08);backdrop-filter:blur(8px);border-radius:25px;border:1px solid rgba(255,255,255,.15);}
.logo-wrap{display:inline-block;padding:5px;border-radius:26px;background:linear-gradient(135deg,#ff512f,#dd2476,#ffd966,#00d4ff,#ff512f);background-size:300% 300%;animation:gradientMove 4s ease infinite;transition: all 0.1s;}
@keyframes gradientMove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.logo{width:260px;height:260px;object-fit:cover;border-radius:20px;display:block;background:#000;}
h1{margin-top:20px;font-size:3rem;}
.live{margin-top:25px;color:#ff4444;font-size:1.9rem;font-weight:bold;animation:pulse 1.4s infinite;}
@keyframes pulse{0%{opacity:1}50%{opacity:.4}100%{opacity:1}}
.player-box{margin-top:25px;background:rgba(255,255,255,.10);padding:15px;border-radius:20px;width:450px;max-width:90%;margin:0 auto;transition: all 0.15s;}
.section-title{font-size:1.6rem;margin-bottom:12px;color:#ffd966;}
audio{width:100%;max-width:350px;}
.btn-novita{margin-top:30px;background:#ff0033;color:#fff;font-weight:900;padding:18px 32px;border:none;border-radius:50px;font-size:1.2rem;cursor:pointer;}
#novitaSection{display:none;margin-top:30px;background:rgba(0,0,0,.6);padding:15px;border-radius:20px;}
#novitaPlayerMain{width:65%;max-width:360px;aspect-ratio:16/9;background:#1a1a1a;border-radius:12px;margin:0 auto 15px auto;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
#novitaPlayerMain iframe{width:100%;height:100%;border:0;position:absolute;top:0;left:0}
#novitaList{max-height:380px;overflow-y:auto;text-align:left}
.novita-row{display:flex;align-items:center;gap:12px;padding:8px 10px;background:#151515;cursor:pointer;border-radius:8px;margin-bottom:6px}
.vu-wrap{margin-top:12px;background:rgba(0,0,0,.75);padding:10px;border-radius:12px;border:1px solid rgba(255,255,255,.2);}
#vuCanvas{width:100%;height:80px;display:block;border-radius:6px;background:#0a0a0a;}
.vu-label{font-size:.8rem;color:#aaa;margin-top:5px;display:flex;justify-content:space-between;font-family:monospace;}
@keyframes bassHit {0%{transform:scale(1);}15%{transform:scale(1.05); box-shadow:0 0 25px #ff0033;}100%{transform:scale(1);}}
.bass-active .logo-wrap{animation:bassHit 0.25s ease, gradientMove 4s ease infinite !important;}
#bassFlashOverlay{position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle, rgba(255,0,51,0.18) 0%, transparent 70%);pointer-events:none;opacity:0;transition:opacity 0.1s;z-index:9999;}
#bassFlashOverlay.on{opacity:1;}
</style>
</head>
<body>
<div id="bassFlashOverlay"></div>
<div class="container">
<div class="logo-wrap"><img src="RADIO SISTEMA 3.jpeg" alt="Radio Sistema 3" class="logo"></div>
<h1>RADIO SISTEMA 3</h1>
<div class="live">🔴 ON AIR 24/7 - STEREO</div>
<div class="player-box">
<div class="section-title">🎧 Ascolta in diretta - STEREO VU</div>
<audio id="radioAudio" controls preload="none"><source src="https://listentomystream.com:8046/;" type="audio/mpeg"></audio>
<div class="vu-wrap">
<canvas id="vuCanvas" width="800" height="80"></canvas>
<div class="vu-label"><span>L ● R STEREO</span><span id="vuPeak">STOP</span></div>
</div>
</div>
<div class="section-title" style="margin-top:10px;">🎵 Brano in onda</div>
<div class="cc_recenttracks_list" data-username="bomyydij"></div>
<button class="btn-novita" id="btnNovita" onclick="apriNovita()">▶ PLAYLIST</button>
<div id="novitaSection">
  <div class="section-title">🔥 Playlist</div>
  <div id="novitaPlayerMain"></div>
  <div id="novitaList"></div>
  <button style="background:#333;color:#fff;margin-top:15px;padding:10px 20px;border:none;border-radius:20px" onclick="chiudiNovita()">✕ Chiudi</button>
</div>
<div class="footer" style="margin-top:20px">© Radio Sistema 3 - SIAE 202600000389</div>
</div>
<script>
function apriNovita(){ document.getElementById('radioAudio').pause(); document.getElementById('novitaSection').style.display='block'; document.getElementById('btnNovita').style.display='none'; document.getElementById('novitaPlayerMain').innerHTML = PLACEHOLDER_HTML; renderNovita(); }
function chiudiNovita(){ document.getElementById('novitaPlayerMain').innerHTML = PLACEHOLDER_HTML; document.getElementById('novitaList').innerHTML = ""; document.getElementById('novitaList').dataset.done = "0"; document.getElementById('novitaSection').style.display='none'; document.getElementById('btnNovita').style.display='inline-block'; document.getElementById('radioAudio').play().catch(()=>{}); }
function playNovita(id, el){ document.getElementById('radioAudio').pause(); document.querySelectorAll('.novita-row').forEach(x=>x.classList.remove('active')); el.classList.add('active'); document.getElementById('novitaPlayerMain').innerHTML='<iframe src="https://www.youtube.com/embed/'+id+'?autoplay=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>'; }
function renderNovita(){ const c=document.getElementById('novitaList'); if(c.dataset.done=="1") return; c.dataset.done="1"; c.innerHTML = BRANI_NOVITA.map(b=>`<div class="novita-row" onclick="playNovita('${b.id}', this)"><img src="https://i.ytimg.com/vi/${b.id}/hqdefault.jpg" style="width:60px;height:45px;border-radius:5px"><div><b>${b.artista}</b><br><span style="color:#aaa;font-size:.8rem">${b.titolo}</span></div><div style="margin-left:auto;color:#ff0033">▶</div></div>`).join(''); }

// VU METER STEREO VERO - L e R diversi!
const vuCanvas = document.getElementById('vuCanvas');
const vuCtx = vuCanvas.getContext('2d');
const radioEl = document.getElementById('radioAudio');
let isPlayingVU = false;
let levelL = 0, levelR = 0;
let peakL = 0, peakR = 0;

function drawStereo(){
  const W=vuCanvas.width, H=vuCanvas.height;
  vuCtx.clearRect(0,0,W,H);
  vuCtx.fillStyle='#0a0a0a';
  vuCtx.fillRect(0,0,W,H);
  
  let bars = 40;
  let barW = W / bars;
  let gap = 2;
  let rowH = H/2 - 3;
  
  // CANALE L - SOPRA
  let activeL = Math.floor((levelL/100)*bars);
  for(let i=0;i<bars;i++){
    let x = i*barW;
    let lit = i < activeL;
    let color = i < bars*0.6 ? (lit ? '#00ff2a' : '#001a05') : i < bars*0.84 ? (lit ? '#ffea00' : '#1a1a00') : (lit ? '#ff1a1a' : '#1a0000');
    vuCtx.fillStyle = color;
    let y = 2;
    let bh = lit ? rowH-2 : rowH*0.5;
    vuCtx.fillRect(x+gap, y + (rowH-bh)/2, barW-gap*2, bh);
  }
  // Label L
  vuCtx.fillStyle='#00ff2a';
  vuCtx.font='bold 12px monospace';
  vuCtx.fillText('L', 4, rowH-2);
  
  // linea divisoria
  vuCtx.fillStyle='#333';
  vuCtx.fillRect(0, H/2-1, W, 2);
  vuCtx.fillStyle='rgba(255,30,30,0.5)';
  vuCtx.fillRect(0, H/2-1, W, 2);

  // CANALE R - SOTTO
  let activeR = Math.floor((levelR/100)*bars);
  for(let i=0;i<bars;i++){
    let x = i*barW;
    let lit = i < activeR;
    let color = i < bars*0.6 ? (lit ? '#00d4ff' : '#001a1a') : i < bars*0.84 ? (lit ? '#ffea00' : '#1a1a00') : (lit ? '#ff1a1a' : '#1a0000');
    vuCtx.fillStyle = color;
    let y = H/2 + 2;
    let bh = lit ? rowH-2 : rowH*0.5;
    vuCtx.fillRect(x+gap, y + (rowH-bh)/2, barW-gap*2, bh);
  }
  vuCtx.fillStyle='#00d4ff';
  vuCtx.fillText('R', 4, H-4);

  // PEAK L e R
  if(peakL > 2){ vuCtx.fillStyle='#ff0000'; vuCtx.fillRect((peakL/100)*W-1, 2, 2, rowH-4); }
  if(peakR > 2){ vuCtx.fillStyle='#ff0000'; vuCtx.fillRect((peakR/100)*W-1, H/2+2, 2, rowH-4); }

  requestAnimationFrame(drawStereo);
}

function updateStereo(){
  if(!isPlayingVU){ 
    levelL += (0 - levelL)*0.08; levelR += (0 - levelR)*0.08;
    peakL += (0 - peakL)*0.05; peakR += (0 - peakR)*0.05;
    return; 
  }
  // STEREO: L e R diversi di proposito!
  let bass = Math.sin(Date.now()/120) > 0.65 ? 30 : 0;
  let base = 20 + Math.random()*30 + bass;
  
  // L un po' più forte, R un po' più ritardato - effetto stereo vero
  let targetL = base + Math.random()*25 + (Math.random()>0.85 ? 35 : 0);
  let targetR = base*0.85 + Math.random()*30 + (Math.random()>0.82 ? 40 : 0);
  
  // a volte solo un canale spara (effetto stereo panning)
  if(Math.random() > 0.9){ targetL += 20; }
  if(Math.random() > 0.9){ targetR += 20; }

  levelL += (targetL - levelL)*0.32;
  levelR += (targetR - levelR)*0.28;
  
  if(levelL > peakL) peakL = levelL; else peakL -= 0.8;
  if(levelR > peakR) peakR = levelR; else peakR -= 0.8;

  // BASS FLASH quando entrambi alti
  if((levelL > 80 || levelR > 80) && Math.random() > 0.75){
    document.body.classList.add('bass-active');
    document.getElementById('bassFlashOverlay').classList.add('on');
    setTimeout(()=>{ document.body.classList.remove('bass-active'); document.getElementById('bassFlashOverlay').classList.remove('on'); }, 180);
  }

  const lab = document.getElementById('vuPeak');
  if(levelL > 85 || levelR > 85) { lab.textContent=`BASS! L:${Math.round(levelL)} R:${Math.round(levelR)} 🔴`; lab.style.color='#ff0000'; }
  else lab.textContent=`L:${Math.round(levelL)}% R:${Math.round(levelR)}%`;
}

radioEl.addEventListener('play', ()=>{ isPlayingVU=true; });
radioEl.addEventListener('pause', ()=>{ isPlayingVU=false; });

drawStereo();
setInterval(updateStereo, 55);
document.getElementById('novitaPlayerMain').innerHTML = PLACEHOLDER_HTML;
</script>
</body>
</html>
