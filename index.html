<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Radio Sistema 3</title>

<style>

body{
    margin:0;
    color:#fff;
    font-family:Arial,sans-serif;
    text-align:center;

    background:
        linear-gradient(
            rgba(0,0,0,0.35),
            rgba(0,0,0,0.35)
        ),
        url("studio-radio.jpeg");

    background-size:cover;
    background-position:center center;
    background-repeat:no-repeat;
    background-attachment:fixed;
}

.container{
    max-width:900px;
    margin:20px auto;
    padding:20px;
}

.logo{
    width:200px;
    max-width:85%;
    height:auto;
}

h1{
    margin:20px 0 10px;
    font-size:3rem;
    color:#ffffff;
}

.slogan{
    font-size:18px;
    margin-bottom:20px;
}

.live{
    color:#ff4040;
    font-size:28px;
    font-weight:bold;
    margin:20px 0;
}

/* PLAYER */

.radio-player{
    max-width:700px;
    margin:25px auto;
    padding:20px;
    background:rgba(0,0,0,0.45);
    border-radius:15px;
    backdrop-filter:blur(5px);
    box-shadow:0 0 20px rgba(0,0,0,0.4);
}

.radio-player audio{
    width:100%;
    max-width:600px;
}

.footer{
    margin:25px 0 15px;
    font-size:18px;
}

/* TRACCE RECENTI */

.cc_recenttracks_list{
    margin-top:20px !important;
    color:#ffffff !important;
    font-weight:bold !important;
}

.cc_recenttracks_list *{
    color:#ffffff !important;
}

/* COPERTINA */

.cc_recenttracks_list img{
    display:block !important;
    margin:15px auto !important;
    width:100px !important;
    max-width:100px !important;
    height:auto !important;
    border-radius:10px;
}

/* NASCONDE LINK ACQUISTO */

.cc_recenttracks_list a{
    display:none !important;
}

</style>

<script src="https://manage.myshoutca.st/system/recenttracks.js"></script>

</head>

<body>

<div class="container">

    <img
        src="RADIO SISTEMA 3.jpeg"
        alt="Radio Sistema 3"
        class="logo"
    >

    <h1>RADIO SISTEMA 3</h1>

    <div class="slogan">
        Musica, informazione e intrattenimento
    </div>

    <div class="live">
        🔴 IN DIRETTA
    </div>

    <div class="radio-player">

        <audio controls preload="none">
            <source src="https://listentomystream.com:8046/stream" type="audio/mpeg">
            Il tuo browser non supporta l'audio HTML5.
        </audio>

    </div>

    <div class="footer">
        La radio delle tue emozioni
    </div>

    <h2>🎵 Ultimi Brani Trasmessi</h2>

    <div
        class="cc_recenttracks_list"
        data-username="bomyydij">
    </div>

</div>

</body>
</html>
