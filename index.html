<!DOCTYPE html>
<html lang="it">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Radio Sistema 3</title>

<script src="https://manage.myshoutca.st/system/recenttracks.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:'Segoe UI',Arial,sans-serif;

    color:white;
    text-align:center;

    background:
    linear-gradient(
        rgba(0,0,0,.35),
        rgba(0,0,0,.55)
    ),
    url("studio-radio.jpeg");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;

}

.container{

    max-width:950px;
    margin:30px auto;
    padding:30px;

    background:rgba(255,255,255,.08);

    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);

    border-radius:25px;

    border:1px solid rgba(255,255,255,.20);

    box-shadow:
        0 0 25px rgba(255,255,255,.10),
        0 10px 25px rgba(0,0,0,.30);

}

/* COPERTINA QUADRATA */

.logo-container{

    width:300px;
    height:300px;

    margin:0 auto;

    overflow:hidden;

    border-radius:20px;

    border:3px solid rgba(255,255,255,.20);

    box-shadow:
        0 0 30px rgba(255,255,255,.35),
        0 10px 25px rgba(0,0,0,.35);

}

.logo{

    width:100%;
    height:100%;

    object-fit:cover;
    object-position:center center;

    display:block;

}

h1{

    margin-top:25px;

    font-size:3rem;

    text-shadow:
        0 2px 8px rgba(0,0,0,.5);

}

.tagline{

    margin-top:10px;

    font-size:1.2rem;

    color:#ffe9a8;

}

.live{

    margin-top:25px;

    font-size:1.8rem;

    color:#ff3030;

    font-weight:bold;

    animation:pulse 1.5s infinite;

}

@keyframes pulse{

    0%{opacity:1;}
    50%{opacity:.35;}
    100%{opacity:1;}

}

.player-box{

    margin-top:30px;

    padding:20px;

    border-radius:20px;

    background:rgba(255,255,255,.08);

}

.section-title{

    margin-bottom:15px;

    font-size:1.6rem;

    color:#ffd966;

}

/* PLAYER PIÙ PICCOLO */

audio{

    width:300px;
    max-width:100%;

}

#fallback{

    display:none;

    margin-top:15px;

}

.backup-btn{

    display:inline-block;

    padding:12px 24px;

    text-decoration:none;

    color:white;

    font-weight:bold;

    border-radius:40px;

    background:
    linear-gradient(
        135deg,
        #ff512f,
        #dd2476
    );

}

.cc_recenttracks_list{
    color:white !important;
}

.cc_recenttracks_list *{
    color:white !important;
}

.cc_recenttracks_list img{

    display:block !important;

    margin:15px auto !important;

    width:120px !important;

    border-radius:12px;

}

.cc_recenttracks_list .ccbuy{

    display:none !important;

}

.footer{

    margin-top:40px;

    padding-top:20px;

    border-top:1px solid rgba(255,255,255,.25);

}

@media (max-width:768px){

    body{

        background-attachment:scroll;

    }

    .container{

        margin:12px;
        padding:20px;

    }

    h1{

        font-size:2rem;

    }

    .logo-container{

        width:220px;
        height:220px;

    }

    .tagline{

        font-size:1rem;

    }

    .live{

        font-size:1.4rem;

    }

    .section-title{

        font-size:1.3rem;

    }

    audio{

        width:100%;

    }

}

</style>

</head>

<body>

<div class="container">

    <div class="logo-container">

        <img
            src="RADIO SISTEMA 3.jpeg"
            alt="Radio Sistema 3"
            class="logo">

    </div>

    <h1>RADIO SISTEMA 3</h1>

    <div class="tagline">
        🎙️ La musica che accompagna le tue giornate
    </div>

    <div class="live">
        🔴 ON AIR 24/7
    </div>

    <div class="player-box">

        <div class="section-title">
            🎧 Ascolta in diretta
        </div>

        <audio id="radioPlayer" controls preload="none">
            <source src="https://listentomystream.com:8046/;" type="audio/mpeg">
            Il tuo browser non supporta l'audio HTML5.
        </audio>

        <div id="fallback">

            <p style="margin-bottom:10px;">
                ⚠️ Se il player non funziona usa il player esterno
            </p>

            <a
                class="backup-btn"
                href="https://listentomystream.com:8046/"
                target="_blank">

                🎧 APRI PLAYER ESTERNO

            </a>

        </div>

    </div>

    <div class="section-title" style="margin-top:40px;">
        🎵 Brano in onda
    </div>

    <div
        class="cc_recenttracks_list"
        data-username="bomyydij">
    </div>

    <div class="footer">

        © Radio Sistema 3

        <br><br>

        La radio delle tue emozioni

    </div>

</div>

<script>

const player = document. fallback.style.display = "block";
}

player.addEventListener("error", mostraFallback);
player.addEventListener("stalled", mostraFallback);

</script>

</body>
</html>
