<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radio Sistema 3</title>
<script src="https://manage.myshoutca.st/system/recenttracks.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111;color:#fff;font-family:Arial;text-align:center;padding:15px}
.container{max-width:900px;margin:auto;background:#1a1a1a;padding:20px;border-radius:20px;border:1px solid #333}
.logo{width:200px;height:200px;object-fit:cover;border-radius:15px}
.player-box{margin:20px auto;background:#222;padding:15px;border-radius:15px;max-width:420px}
audio{width:100%}
.cc_recenttracks_list{max-width:420px;margin:10px auto;background:#222;padding:12px;border-radius:12px;text-align:left;color:#fff}
.cc_recenttracks_list img{width:80px!important;height:80px!important;opacity:1!important;display:inline-block!important;border-radius:6px}
.topcharts{margin-top:25px;background:#222;padding:15px;border-radius:15px;border:1px solid #ffd96630}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:12px}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:#111;border-radius:10px;overflow:hidden;text-decoration:none;color:#fff;border:1px solid #333;display:block;position:relative}
.card img{width:100%;height:140px;object-fit:cover;display:block}
.card .info{padding:8px;text-align:left}
.card .titolo{display:block;font-weight:bold;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .autore{display:block;font-size:12px;color:#aaa;margin-top:2px}
.play{position:absolute;bottom:45px;right:8px;background:#ffd966;color:#000;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold}
.dediche{margin-top:25px;background:#222;padding:15px;border-radius:15px}
.dediche input,.dediche textarea{width:100%;max-width:400px;padding:10px;margin:6px 0;border-radius:8px;border:none;background:#000;color:#fff}
.btn{background:#ffd966;color:#000;padding:12px 25px;border:none;border-radius:25px;font-weight:bold;cursor:pointer;margin-top:10px}
</style>
</head>
<body>
<div class="container">
<img src="RADIO SISTEMA 3.jpeg" class="logo">
<h1>RADIO SISTEMA 3</h1>
<p style="color:#ffd966">ON AIR 24/7</p>

<div class="player-box">
<h3 style="color:#ffd966">🎧 Ascolta in diretta</h3>
<audio controls autoplay>
<source src="https://listentomystream.com:8046/;" type="audio/mpeg">
Il tuo browser non supporta l'audio.
</audio>
</div>

<h3 style="color:#ffd966;margin-top:15px">🎵 Brano in onda</h3>
<div class="cc_recenttracks_list" data-username="bomyydij"></div>

<div class="topcharts">
<h3 style="color:#ffd966">💿 Clicca la Cover - Apre in altra pagina</h3>
<div class="grid">
<a class="card" href="https://www.top-charts.com/search?q=%22KATSEYE%22%20%22Animal%22" target="_blank">
<img src="cover/Animal.jpg"><div class="play">▶</div><div class="info"><span class="titolo">Animal</span><span class="autore">KATSEYE</span></div></a>
<a class="card" href="https://www.top-charts.com/search?q=%22Elisa%22%20%22Kintsugi%22" target="_blank">
<img src="cover/Kintsugi.jpg"><div class="play">▶</div><div class="info"><span class="titolo">Kintsugi</span><span class="autore">Elisa</span></div></a>
<a class="card" href="https://www.top-charts.com/search?q=%22Sfera%20Ebbasta%22%20%22Lontano%22" target="_blank">
<img src="cover/Lontano.jpg"><div class="play">▶</div><div class="info"><span class="titolo">Lontano</span><span class="autore">Sfera Ebbasta</span></div></a>
</div>
</div>

<div class="dediche">
<h3 style="color:#ffd966">💌 Dedica una canzone</h3>
<input id="nome" placeholder="Il tuo nome"><br>
<input id="perChi" placeholder="Per chi"><br>
<textarea id="msg" placeholder="Messaggio"></textarea><br>
<input id="canzone" placeholder="Canzone richiesta"><br>
<button class="btn" onclick="let n=document.getElementById('nome').value;let p=document.getElementById('perChi').value;let m=document.getElementById('msg').value;if(!n||!p||!m){alert('Compila');return;}window.open('https://wa.me/39XXXXXXXXXX?text='+encodeURIComponent('Dedica da '+n+' per '+p+': '+m))">📩 INVIA</button>
</div>

<p style="margin-top:15px;font-size:12px;color:#888">Licenza SIAE 202600000389</p>
</div>
</body>
</html>
