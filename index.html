<!DOCTYPE html>
<html lang="it">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Radio Sistema 3</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI', Arial, sans-serif;
    color:white;
    text-align:center;

    background:
    linear-gradient(
        rgba(0,0,0,.30),
        rgba(0,0,0,.35)
    ),
    url("studio-radio.jpeg");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;
}

.container{
    max-width:950px;
    margin:40px auto;
    padding:40px;

    background:rgba(255,255,255,.18);

    backdrop-filter:blur(10px);

    border-radius:25px;

    border:1px solid rgba(255,255,255,.20);

    box-shadow:
    0 8px 35px rgba(0,0,0,.25);
}

.logo{
    width:230px;
    max-width:90%;
    height:auto;

    border-radius:20px;

    box-shadow:
    0 0 30px rgba(255,255,255,.25);
}

h1{
    margin-top:25px;
    font-size:4rem;

    text-shadow:
    0 0 15px rgba(255,255,255,.3);
}

.slogan{
    font-size:1.3rem;
    margin-top:10px;
    color:#ffffff;

    text-shadow:
    0 0 10px rgba(0,0,0,.3);
}

.tagline{
    margin-top:15px;
    font-size:1.1rem;
    color:#fff3b0;
    font-weight:500;
}

.live{
    margin-top:35px;
    font-size:2rem;
    color:#ff4d4d;
    font-weight:bold;

    animation:pulse 1.5s infinite;
}

@keyframes pulse{

    0%{
        opacity:1;
    }

    50%{
        opacity:.4;
    }

    100%{
        opacity:1;
    }
}

.ascolta-btn{

    display:inline-block;

    margin-top:30px;

    padding:20px 55px;

    text-decoration:none;

    color:white;

    font-size:1.5rem;

    font-weight:bold;

    border-radius:60px;

    background:
    linear-gradient(
        135deg,
        #ff512f,
        #dd2476
    );

    box-shadow:
    0 0 25px rgba(255,82,82,.7);

    transition:.3s ease;
}

.ascolta-btn:hover{
    transform:scale(1.08);

    box-shadow:
    0 0 35px rgba(255,82,82,1);
}

.section-title{

    margin-top:50px;
    margin-bottom:20px;

    font-size:2rem;

    color:#ffd966;

    text-shadow:
    0 0 10px rgba(255,217,102,.5);
}

.footer{

    margin-top:40px;

    padding-top:20px;

    border-top:
    1px solid rgba(255,255,255,.2);

    color:#ffffff;
}

/* Widget Tracce Recenti */

.cc_recenttracks_list{
    color:white !important;
}

.cc_recenttracks_list *{
    color:white !important;
}

.cc_recenttracks_list img{

    display:block !important;

    margin:15px auto !important;

    width:120px !important;

    height:auto !important;

    border-radius:12px;

    box-shadow:
    0 0 15px rgba(0,0,0,.4);
}

/* Nasconde "Acquista questo album" */

.cc_recenttracks_list .ccbuy{
    display:none !important;
}

.cc_recenttracks_list a{
    text-decoration:none;
}

</style>

<script src="https://manage.myshoutca.st/system/recenttracks.js"></script>

</head>

<body>

<div class="container">

    <img
        src="RADIO SISTEMA 3.jpeg"
        alt="Radio Sistema 3"
        class="logo">

    <h1>RADIO SISTEMA 3</h1>

    <div class="slogan">
        Musica, informazione e intrattenimento
    </div>

    <div class="tagline">
        🎙️ La musica che accompagna le tue giornate
    </div>

    <div class="live">
        🔴 ON AIR
    </div>

    <a
       class="ascolta-btn"
       href="https://manage.myshoutca.st/start/bomyydij/"
       target="_blank"
       rel="noopener noreferrer">

       🎧 ASCOLTA ORA

    </a>

    <div class="section-title">
        🎵 Ultimi Brani Trasmessi
    </div>

    <div
        class="cc_recenttracks_list"
        data-username="bomyydij">
    </div>

    <div class="footer">

        © Radio Sistema 3

        <br><br>

        La radio delle tue emozioni

    </div>

</div>

</body>

</html>
