<script>
const CACHE_VERSION='v95_ANTI_FLASH_VERO';
function apriNovita(){document.getElementById('novitaSection').style.display='block';document.getElementById('btnNovita').style.display='none';document.getElementById('novitaPlayerMain').innerHTML=PLACEHOLDER_HTML;renderNovita();}
function chiudiNovita(){document.getElementById('novitaPlayerMain').innerHTML=PLACEHOLDER_HTML;document.getElementById('novitaList').innerHTML="";document.getElementById('novitaList').dataset.done="0";document.getElementById('novitaSection').style.display='none';document.getElementById('btnNovita').style.display='inline-block';document.getElementById('radioAudio').play().catch(()=>{});}
function playNovita(id,el){document.querySelectorAll('.novita-row').forEach(x=>x.classList.remove('active'));el.classList.add('active');document.getElementById('novitaPlayerMain').innerHTML='<iframe src="https://www.youtube.com/embed/'+id+'?autoplay=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>';}
function renderNovita(){const c=document.getElementById('novitaList');if(c.dataset.done=="1")return;c.dataset.done="1";c.innerHTML=BRANI_NOVITA.map(b=>{const bb=normalizzaBrano(b);return `<div class="novita-row" onclick="playNovita('${bb.id}', this)"><img src="https://i.ytimg.com/vi/${bb.id}/hqdefault.jpg" style="width:50px;height:38px;border-radius:4px"><div><b style="font-size:0.9rem">${bb.artista}</b><br><span style="color:#aaa;font-size:.75rem">${bb.titolo}</span></div><div style="margin-left:auto;color:#ff0033">▶</div></div>`;}).join('');}
function dedup(list){const v=new Set();return list.filter(n=>{const k=(n.title||'').toLowerCase().slice(0,60).trim();if(!k||v.has(k))return false;v.add(k);return true;});}
async function fetchRSS_Ultra(url){
  const ts=Date.now(); const clean=url+(url.includes('?')?'&':'?')+'t='+ts;
  const tries=[
    async()=>{const r=await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(clean)}`,{cache:'no-store'});const j=await r.json();return j.contents;},
    async()=>{const r=await fetch(`https://corsproxy.io/?${encodeURIComponent(clean)}`,{cache:'no-store'});return await r.text();},
    async()=>{const r=await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}&_t=${ts}`,{cache:'no-store'});const d=await r.json();if(d.items){let f='<rss><channel>';d.items.slice(0,6).forEach(it=>{f+=`<item><title><![CDATA[${it.title}]]></title><link>${it.link}</link></item>`;});f+='</channel></rss>';return f;}throw 0;}
  ];
  for(let fn of tries){
    try{
      const xmlText=await Promise.race([fn(), new Promise((_,rej)=>setTimeout(()=>rej('to'),4000))]);
      if(!xmlText||!xmlText.includes('<item'))continue;
      const xml=new DOMParser().parseFromString(xmlText,"text/xml");
      const items=[...xml.querySelectorAll("item")].slice(0,6);
      if(items.length)return items.map(it=>({title:it.querySelector("title")?.textContent||"",link:it.querySelector("link")?.textContent||"#"}));
    }catch(e){continue;}
  }
  return null;
}
async function fetchMulti(urls){
  const all=[]; for(let u of urls){try{const r=await fetchRSS_Ultra(u);if(r)all.push(...r);}catch(e){}}
  const uniq=dedup(all);
  if(uniq.length>4){const prime=uniq.slice(0,2);let resto=uniq.slice(2);for(let i=resto.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[resto[i],resto[j]]=[resto[j],resto[i]];}return [...prime,...resto.slice(0,2)];}
  return uniq.slice(0,4);
}
async function caricaCronaca(){
  const box=document.getElementById('newsListNord'); const t=document.getElementById('newsTime');
  try{
    const notizie=await fetchMulti(['https://www.ansa.it/sito/notizie/cronaca/cronaca_rss.xml','https://www.ansa.it/sito/notizie/topnews/topnews_rss.xml','https://www.ansa.it/sito/notizie/politica/politica_rss.xml']);
    if(notizie.length){box.innerHTML=notizie.map(n=>`<div class="news-item"><a href="${n.link}" target="_blank">• ${n.title}</a></div>`).join(''); if(t) t.textContent=new Date().toLocaleTimeString();}
  }catch(e){}
}
async function caricaCalcio(){
  const box=document.getElementById('newsListCalcio'); const t=document.getElementById('calcioTime');
  try{
    const notizie=await fetchMulti(['https://www.tuttomercatoweb.com/rss/','https://www.tuttomercatoweb.com/rss/tmw.xml','https://www.ansa.it/sito/notizie/sport/calcio/calcio_rss.xml','https://www.gazzetta.it/rss/Calcio.xml']);
    if(notizie.length){box.innerHTML=notizie.map(n=>`<div class="news-item calcio"><a href="${n.link}" target="_blank">• ${n.title}</a></div>`).join(''); if(t) t.textContent=new Date().toLocaleTimeString();}
  }catch(e){}
}
function pulisciTitolo(raw){
  let t = raw || "";
  t = t.replace(/Radio Sistema 3/gi,'').trim();
  t = t.replace(/^\s*\d{1,2}:\d{2}(?::\d{2})?\s*(AM|PM)?\s*/i,'');
  t = t.replace(/^(AM|PM)\s*/i,'').trim();
  t = t.replace(/^[-–—\s]+/,'').trim();
  t = t.replace(/([a-zàèéìòù])([A-ZÀÈÉÌÒÙ])/g,'$1 $2');
  t = t.replace(/\s{2,}/g,' ').trim();
  if(!t.includes(' - ')){
    const m = t.match(/^(.+?)\s+([A-ZÀ-ÿ][a-zà-ÿ]+\s+[A-ZÀ-ÿ][a-zà-ÿ]+)$/);
    if(m){ t = m[2] + ' - ' + m[1]; }
  }
  return t;
}
let _isRebuilding=false;
let _lastRaw="";
function rebuildTrackBox(){
  if(_isRebuilding) return;
  const wrap=document.querySelector('.cc_recenttracks_list'); if(!wrap)return;
  const rawHtml = wrap.innerHTML;
  if(rawHtml.includes('rs3-trackbox') && rawHtml.length < 350) return;
  let existingBox=wrap.querySelector('.rs3-trackbox'); 
  let rawText="Radio Sistema 3 - Live"; 
  let rawImg=getLogoAssoluto();
  let temp=document.createElement('div'); 
  temp.innerHTML=wrap.innerHTML; 
  temp.querySelectorAll('img,a,.rs3-trackbox').forEach(el=>el.remove()); 
  let txt=temp.innerText.trim(); 
  if(txt.length>2) rawText=pulisciTitolo(txt);
  if(!rawText || rawText.length<2) return;
  if(rawText === _lastRaw && existingBox) return;
  _lastRaw = rawText;
  _isRebuilding = true;
  let artista="", titolo="";
  if(rawText.includes(' - ')){
    const p=rawText.split(' - ');
    artista=p[0].trim();
    titolo=p.slice(1).join(' - ').trim();
  } else {
    titolo=rawText;
  }
  if(!existingBox){
    wrap.innerHTML='';
    const b=document.createElement('div');b.className='rs3-trackbox';
    const img=document.createElement('img');img.className='rs3-cover';img.src=rawImg;
    const info=document.createElement('div');info.className='rs3-info';
    if(artista && titolo){
      info.innerHTML='<div style="font-weight:900;color:#fff">'+artista+'</div><div style="color:#ffd966;font-weight:700">'+titolo+'</div>';
    } else {
      info.textContent=titolo;
    }
    info.dataset.lastText=rawText;
    b.appendChild(img);b.appendChild(info);wrap.appendChild(b);
  } else {
    const info=existingBox.querySelector('.rs3-info');
    if(info && info.dataset.lastText!==rawText){
      if(artista && titolo){
        info.innerHTML='<div style="font-weight:900;color:#fff">'+artista+'</div><div style="color:#ffd966;font-weight:700">'+titolo+'</div>';
      } else {
        info.textContent=rawText;
      }
      info.dataset.lastText=rawText;
    }
  }
  wrap.classList.add('rs3-ready');
  setTimeout(()=>{_isRebuilding=false;}, 400);
}
const list=document.querySelector('.cc_recenttracks_list'); 
if(list){
  const obs = new MutationObserver((muts)=>{
    if(_isRebuilding) return;
    for(let m of muts){
      if(m.target && m.target.closest && m.target.closest('.rs3-trackbox')) return;
      if(m.target && m.target.classList && m.target.classList.contains('rs3-trackbox')) return;
    }
    rebuildTrackBox();
  });
  obs.observe(list,{childList:true,subtree:true});
}
let _fastInterval=setInterval(rebuildTrackBox,300);
setTimeout(()=>{clearInterval(_fastInterval); _fastInterval=setInterval(rebuildTrackBox,2000);},5000);
const METEO_API_KEY="cf67ed7472bdfb3087a25f37627f5d74";
const LEFT=[{q:"Torino,IT",label:"Torino"},{q:"Milano,IT",label:"Milano"},{q:"Venezia,IT",label:"Venezia"},{q:"Bologna,IT",label:"Bologna"},{q:"Firenze,IT",label:"Firenze"}];
const RIGHT=[{q:"Roma,IT",label:"Roma"},{q:"Ancona,IT",label:"Ancona"},{q:"Napoli,IT",label:"Napoli"},{q:"Palermo,IT",label:"Palermo"},{q:"Brindisi,IT",label:"Brindisi"}];
async function renderMeteo(cities,id){const grid=document.getElementById(id); let h=""; for(let c of cities){try{const r=await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${c.q}&appid=${METEO_API_KEY}&units=metric&lang=it&bust=${Date.now()}`,{cache:'no-store'});const d=await r.json();const temp=Math.round(d.main.temp);const icon=d.weather[0].icon;h+=`<div class="meteo-mini"><b>${c.label}</b><img src="https://openweathermap.org/img/wn/${icon}.png"><div class="temp">${temp}°C</div></div>`;}catch(e){h+=`<div class="meteo-mini"><b>${c.label}</b><div class="temp">--°</div></div>`;}}grid.innerHTML=h;}
function caricaMeteo(){if(document.documentElement.classList.contains('is-popup'))return;renderMeteo(LEFT,'meteo-left'); renderMeteo(RIGHT,'meteo-right');}
const vuCanvas=document.getElementById('vuCanvas'); const vuCtx=vuCanvas.getContext('2d'); const radioEl=document.getElementById('radioAudio'); const vuPeakEl=document.getElementById('vuPeak');
let isPlaying=false,lL=0,lR=0;
function draw(){const W=vuCanvas.width,H=vuCanvas.height;vuCtx.clearRect(0,0,W,H);vuCtx.fillStyle='#0a0a0a';vuCtx.fillRect(0,0,W,H);let bars=36,barW=W/bars,gap=1.5,rowH=H/2-2;let aL=Math.floor((lL/100)*bars);for(let i=0;i<bars;i++){let x=i*barW;let lit=i<aL;vuCtx.fillStyle=lit?(i<21?'#00ff2a':i<30?'#ffea00':'#ff1a1a'):'#1a1a1a';vuCtx.fillRect(x+gap,1+(rowH-(lit?rowH-1:rowH*0.4))/2,barW-gap*2,lit?rowH-1:rowH*0.4);}vuCtx.fillStyle='#333';vuCtx.fillRect(0,H/2-0.5,W,1);let aR=Math.floor((lR/100)*bars);for(let i=0;i<bars;i++){let x=i*barW;let lit=i<aR;vuCtx.fillStyle=lit?(i<21?'#00d4ff':i<30?'#ffea00':'#ff1a1a'):'#1a1a1a';vuCtx.fillRect(x+gap,H/2+1+(rowH-(lit?rowH-1:rowH*0.4))/2,barW-gap*2,lit?rowH-1:rowH*0.4);}requestAnimationFrame(draw);}
function upd(){if(!isPlaying){lL+=(0-lL)*0.08;lR+=(0-lR)*0.08;return;}let base=40+Math.random()*45;let peak=Math.random()<0.18;let tL=peak?88+Math.random()*12:base+Math.random()*18;let tR=peak?85+Math.random()*15:base*0.9+Math.random()*20;lL+=(tL-lL)*0.38;lR+=(tR-lR)*0.34;}draw();setInterval(upd,70);
radioEl.addEventListener('play',()=>{isPlaying=true;vuPeakEl.textContent="LIVE";vuPeakEl.style.color="#00ff2a";});
radioEl.addEventListener('pause',()=>{isPlaying=false;vuPeakEl.textContent="STOP";vuPeakEl.style.color="#ff4444";});
document.getElementById('novitaPlayerMain').innerHTML=PLACEHOLDER_HTML;
document.addEventListener('DOMContentLoaded',()=>{rebuildTrackBox();caricaMeteo();if(!document.documentElement.classList.contains('is-popup')){caricaCronaca();caricaCalcio();setInterval(caricaCronaca,90000);setInterval(caricaCalcio,60000);}setInterval(caricaMeteo,3600000);});
if(document.readyState!=='loading'){caricaMeteo();if(!document.documentElement.classList.contains('is-popup')){caricaCronaca();caricaCalcio();}}
</script>
