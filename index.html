<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Radio Sistema 3</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI', Arial, sans-serif;
    color:white;
    text-align:center;

    background:
    linear-gradient(
        rgba(0,0,0,.35),
        rgba(0,0,0,.40)
    ),
    url("studio-radio.jpeg");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;
}

.container{
    max-width:950px;
    margin:40px auto;
    padding:40px;

    background:rgba(0,0,0,.25);

    backdrop-filter:blur(8px);

    border-radius:25px;

    border:1px solid rgba(255,255,255,.20);

    box-shadow:0 8px 35px rgba(0,0,0,.40);
}

.logo{
    width:230px;
    max-width:90%;
    height:auto;

    border-radius:20px;

    box-shadow:0 0 30px rgba(255,255,255,.35);
}

h1{
    margin-top:25px;
    font-size:4rem;
    color:#ffffff;

    text-shadow:
        0 0 15px rgba(0,0,0,.7),
        0 0 30px rgba(0,0,0,.4);
}

.slogan{
    font-size:1.3rem;
    margin-top:10px;
    color:#ffffff;
}

.tagline{
    margin-top:15px;
    font-size:1.1rem;
    color:#fff8d6;
}

.live{
    margin-top:35px;
    font-size:2rem;
    color:#ff2d2d;
    font-weight:bold;
    animation:pulse 1.5s infinite;
}

@keyframes pulse{
    0%{opacity:1;}
    50%{opacity:.4;}
    100%{opacity:1;}
}

.ascolta-btn{
    display:inline-block;
    margin-top:30px;
    padding:20px 55px;

    text-decoration:none;
    color:white;

    font-size:1.5rem;
    font-weight:bold;

    border-radius:60px;

    background:
    linear-gradient(
        135deg,
        #ff512f,
        #dd2476
    );

    box-shadow:
        0 0 25px rgba(255,82,82,.7);

    transition:.3s ease;
}

.ascolta-btn:hover{
    transform:scale(1.08);
}

.section-title{
    margin-top:50px;
    margin-bottom:20px;

    font-size:2rem;

    color:#ffd966;

    text-shadow:
        0 0 10px rgba(255,217,102,.5);
}

.footer{
    margin-top:40px;
    padding-top:20px;

    border-top:
    1px solid rgba(255,255,255,.30);

    color:#ffffff;
}

/* Tracce Recenti */

.cc_recenttracks_list{
    color:white !important;
}

.cc_recenttracks_list *{
    color:white !important;
}

.cc_recenttracks_list img{
    display:block !important;
    margin:15px auto !important;
    width:120px !important;
    height:auto !important;
    border-radius:12px;

    box-shadow:
        0 0 15px rgba(0,0,0,.4);
}

.cc_recenttracks_list .ccbuy{
    display:none !important;
}

.cc_recenttracks_list a{
    text-decoration:none;
}

/* Smartphone */

@media(max-width:768px){

    body{
        background-attachment:scroll;
    }

    .container{
        margin:15px;
        padding:25px;
    }

    h1{
        font-size:2.4rem;
    }

    .slogan{
        font-size:1.1rem;
    }

    .tagline{
        font-size:1rem;
    }

    .live{
        font-size:1.5rem;
    }

    .section-title{
        font-size:1.5rem;
    }

    .ascolta-btn{
        width:100%;
        padding:18px;
        font-size:1.2rem;
    }

    .logo{
        width:180px;
    }
}

</style>

<script src="https://manage.myshoutca.st/system/recenttracks.js"></script>

</head>

<body>

<div class="container">

    <img src="RADIO SISTEMA 3.jpeg"
         alt="Radio Sistema 3
