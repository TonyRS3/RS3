<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radio Sistema 3</title>
<script src="https://manage.myshoutca.st/system/recenttracks.js"></script>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
body{
    font-family:Segoe UI,Arial,sans-serif;
    color:white;
    text-align:center;
    background:
    linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.55)),
    url("studio-radio.jpeg");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;
}
.container{
    max-width:900px;
    margin:25px auto;
    padding:30px;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    border-radius:25px;
    border:1px solid rgba(255,255,255,.15);
    box-shadow:0 10px 30px rgba(0,0,0,.35);
}
.logo-wrap{
    display:inline-block;
    padding:5px;
    border-radius:26px;
    background: linear-gradient(135deg, #ff512f, #dd2476, #ffd966, #00d4ff, #ff512f);
    background-size: 300% 300%;
    animation: gradientMove 4s ease infinite;
    box-shadow: 0 0 25px rgba(255,81,47,.6), 0 0 25px rgba(0,212,255,.4);
}
@keyframes gradientMove{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
}
.logo{
    width:260px;
    height:260px;
    aspect-ratio:1 / 1;
    object-fit:cover;
    object-position:center;
    border-radius:20px;
    display:block;
    background:#000;
}
h1{margin-top:20px;font-size:3rem;}
.tagline{margin-top:15px;font-size:1.2rem;color:#ffe9a8;}
.live{margin-top:25px;color:#ff4444;font-size:1.9rem;font-weight:bold;animation:pulse 1.4s infinite;}
@keyframes pulse{0%{opacity:1}50%{opacity:.4}100%{opacity:1}}
.player-box{margin-top:30px;background:rgba(255,255,255,.10);padding:15px;border-radius:20px;width:420px;max-width:90%;margin:0 auto;}
.section-title{font-size:1.6rem;margin-bottom:15px;color:#ffd966;}
audio{width:100%;max-width:350px;}

/* ELIMINA BORDO BIANCO DALLE COVER */
.cc_recenttracks_list{
    color:white !important;
    margin-top:25px;
}
.cc_recenttracks_list *{color:white !important;}
.cc_recenttracks_list img{
    display:block !important;
    margin:15px auto !important;
    width:140px !important;
    height:140px !important;
    object-fit:cover !important;
    aspect-ratio:1 / 1 !important;
    border-radius:14px !important;
    border:0 !important; /* tolto bordo bianco */
    background:#000 !important;
    padding:0 !important;
    box-shadow:0 0 20px rgba(255,217,102,.5);
    /* trucco per tagliare eventuale bordo bianco residuo dentro l'immagine */
    outline: 3px solid #ffd966;
    outline-offset: -2px;
}
.cc_recenttracks_list .ccbuy{display:none !important;}
.footer{margin-top:40px;padding-top:20px;border-top:1px solid rgba(255,255,255,.2);}
@media(max-width:768px){
    body{background-attachment:scroll;}
    .container{margin:12px;padding:20px;}
    h1{font-size:2rem;}
    .logo{width:220px;height:220px;}
    .live{font-size:1.4rem;}
}
</style>
</head>
<body>
<div class="container">
<div class="logo-wrap">
<img src="RADIO SISTEMA 3.jpeg" alt="Radio Sistema 3" class="logo">
</div>
<h1>RADIO SISTEMA 3</h1>
<div class="tagline">🎙️ La musica che accompagna le tue giornate</div>
<div class="live">🔴 ON AIR 24/7</div>
<div class="player-box">
<div class="section-title">🎧 Ascolta in diretta</div>
<audio controls preload="none">
    <source src="https://listentomystream.com:8046/;" type="audio/mpeg">
</audio>
</div>
<div class="section-title" style="margin-top:40px;">🎵 Brano in onda</div>
<div class="cc_recenttracks_list" data-username="bomyydij"></div>
<div class="footer">
© Radio Sistema 3<br><br>
La radio delle tue emozioni<br><br>
Licenza SIAE n° 202600000389<br>
</div>
</div>
</body>
</html>
