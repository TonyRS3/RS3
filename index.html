<!DOCTYPE html>
<html lang="it">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Radio Sistema 3</title>

<style>

body{
    margin:0;
    color:#fff;
    font-family:Arial,sans-serif;
    text-align:center;

    background:
        linear-gradient(
            rgba(0,0,0,0.35),
            rgba(0,0,0,0.35)
        ),
        url("studio-radio.jpeg");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;
}

.container{
    max-width:900px;
    margin:20px auto;
    padding:20px;
}

.logo{
    width:220px;
    max-width:85%;
    height:auto;
}

h1{
    margin:20px 0 10px;
    font-size:3rem;
}

.slogan{
    font-size:18px;
    margin-bottom:20px;
}

.live{
    color:#ff4040;
    font-size:28px;
    font-weight:bold;
    margin:20px 0;
}

.radio-player{
    max-width:700px;
    margin:30px auto;
    padding:25px;
    background:rgba(0,0,0,0.45);
    border-radius:15px;
    box-shadow:0 0 20px rgba(0,0,0,.4);
}

.radio-player audio{
    width:100%;
    max-width:600px;
}

.footer{
    margin:30px 0;
    font-size:18px;
}

.cc_recenttracks_list{
    margin-top:20px !important;
    color:#fff !important;
    font-weight:bold !important;
}

.cc_recenttracks_list *{
    color:#fff !important;
}

.cc_recenttracks_list img{
    display:block !important;
    margin:15px auto !important;
    width:100px !important;
    height:auto !important;
    border-radius:10px;
}

.cc_recenttracks_list .ccbuy{
    display:none !important;
}

</style>

<script src="https://manage.myshoutca.st/system/recenttracks.js"></script>

</head>

<body>

<div class="container">

    <img
        src="RADIO SISTEMA 3.jpeg"
        alt="Radio Sistema 3"
        class="logo">

    <h1>RADIO SISTEMA 3</h1>

    <div class="slogan">
        Musica, informazione e intrattenimento
    </div>

    <div class="live">
        🔴 IN DIRETTA
    </div>

    <div class="radio-player">

        <audio id="radioPlayer" controls preload="none">
            <source
                src="https://listentomystream.com:8046/stream"
                type="audio/mpeg">

            Il tuo browser non supporta l'audio HTML5.
        </audio>

        <p>Streaming Live</p>

    </div>

    <div class="footer">
        La radio delle tue emozioni
    </div>

    <h2>🎵 Ultimi brani trasmessi</h2>

    <div
        id="cc_recenttracks_bomyydij"
        class="cc_recenttracks_list"
        data-username="bomyydij">
    </div>

</div>

</body>

</html>
