const coverCacheRS3={};
async function fetchCopertinaBrano(artista, titolo){
  if(!titolo && !artista) return null;
  const key=(artista+"|"+titolo).toLowerCase();
  if(coverCacheRS3[key]!==undefined) return coverCacheRS3[key];
  try{
    const term=encodeURIComponent(((artista||"")+" "+(titolo||"")).trim());
    const r=await fetch(`https://itunes.apple.com/search?term=${term}&media=music&entity=song&limit=1`,{cache:'no-store'});
    const j=await r.json();
    if(j.results && j.results[0] && j.results[0].artworkUrl100){
      let url=j.results[0].artworkUrl100.replace('100x100bb','600x600bb').replace('100x100','600x600');
      coverCacheRS3[key]=url;
      return url;
    }
  }catch(e){}
  coverCacheRS3[key]=null;

}
