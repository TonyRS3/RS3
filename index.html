<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Radio Sistema 3</title>
<script src="https://manage.myshoutca.st/system/recenttracks.js"></script>
<script>
// ========= QUI CAMBI I BRANI - FACILISSIMO =========
// Prendi solo la parte dopo v= dal link YouTube
// Es: https://www.youtube.com/watch?v=pzvhHsEqMzo -> metti solo pzvhHsEqMzo
const BRANI_NOVITA = [
  { id: "pzvhHsEqMzo", artista: "Marco Mengoni", titolo: "Giornate Perse" },
  { id: "clkCS0Fk8Hk", artista: "Lil Nas X", titolo: "World's Greatest!" },
  { id: "mw3kSNIxjqo", artista: "Taylor Swift", titolo: "Patient Zero" },
  { id: "frWVNdwHuGM", artista: "Baby K feat Guè", titolo: "Amore / Dilemma" }
];
// ========= FINE PARTE DA MODIFICARE =========
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Segoe UI,Arial,sans-serif;color:white;text-align:center;background:linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.55)),url("studio-radio.jpeg");background-size:cover;background-position:center;background-attachment:fixed;}
.container{max-width:900px;margin:25px auto;padding:30px;background:rgba(255,255,255,.08);backdrop-filter:blur(8px);border-radius:25px;border:1px solid rgba(255,255,255,.15);}
.logo-wrap{display:inline-block;padding:5px;border-radius:26px;background:linear-gradient(135deg,#ff512f,#dd2476,#ffd966,#00d4ff,#ff512f);background-size:300% 300%;animation:gradientMove 4s ease infinite;}
@keyframes gradientMove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.logo{width:260px;height:260px;aspect-ratio:1/1;object-fit:cover;border-radius:20px;display:block;background:#000;}
h1{margin-top:20px;font-size:3rem;}
.tagline{margin-top:15px;color:#ffe9a8;}
.live{margin-top:25px;color:#ff4444;font-size:1.9rem;font-weight:bold;animation:pulse 1.4s infinite;}
@keyframes pulse{0%{opacity:1}50%{opacity:.4}100%{opacity:1}}
.player-box{margin-top:25px;background:rgba(255,255,255,.10);padding:15px;border-radius:20px;width:420px;max-width:90%;margin:0 auto;}
.section-title{font-size:1.6rem;margin-bottom:12px;color:#ffd966;}
audio{width:100%;max-width:350px;}
.cc_recenttracks_list{margin-top:5px !important;color:white !important;text-align:left !important;max-width:420px;margin-left:auto;margin-right:auto;}
.cc_recenttracks_list *{color:white !important;line-height:1.3 !important;}
.cc_recenttracks_list .ccbuy{display:none !important;}
.cc_recenttracks_list img{opacity:0;display:block;}
.dediche-box{margin-top:30px;background:rgba(255,255,255,.10);padding:20px;border-radius:20px;border:1px solid rgba(255,217,102,.3);}
.dediche-box input, .dediche-box textarea{width:100%;max-width:400px;padding:10px 12px;margin:6px 0;border-radius:10px;border:none;background:rgba(0,0,0,.4);color:white;font-size:1rem;outline:none;}
.btn-dedica{margin-top:12px;background:linear-gradient(135deg,#ffd966,#ff9f1c);color:#000;font-weight:bold;padding:12px 25px;border:none;border-radius:30px;font-size:1.1rem;cursor:pointer;}
.footer{margin-top:20px;padding-top:20px;border-top:1px solid rgba(255,255,255,.2);}
@media(max-width:768px){.logo{width:190px;height:190px;}h1{font-size:1.9rem;}.container{margin:10px;padding:18px;}}
.btn-novita{margin-top:30px;background:#ff0033;color:#fff;font-weight:900;padding:18px 32px;border:none;border-radius:50px;font-size:1.2rem;cursor:pointer;}
#novitaSection{display:none;margin-top:30px;background:rgba(0,0,0,.5);padding:15px;border-radius:20px;border:1px solid rgba(255,255,255,.15);}
.novita-block{background:#181818;margin-bottom:15px;border-radius:12px;overflow:hidden;text-align:left;border:1px solid #222}
.novita-header{display:flex;align-items:center;gap:12px;padding:10px 12px;background:#111}
.novita-mini{width:56px;height:56px;border-radius:6px;object-fit:cover}
.novita-tit{flex:1}.novita-tit b{display:block}.novita-tit span{color:#aaa;font-size:.85rem}
.novita-player{position:relative;width:100%;padding-bottom:56.25%;background:#000;cursor:pointer}
.novita-player img.thumb{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
.novita-player .play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#ff0000;width:68px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:28px}
.novita-player iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
</style>
</head>
<body>
<div class="container">
<div class="logo-wrap"><img src="RADIO SISTEMA 3.jpeg" alt="Radio Sistema 3" class="logo"></div>
<h1>RADIO SISTEMA 3</h1>
<div class="tagline">🎙️ La musica che accompagna le tue giornate</div>
<div class="live">🔴 ON AIR 24/7</div>
<div class="player-box"><div class="section-title">🎧 Ascolta in diretta</div><audio id="radioAudio" controls preload="none"><source src="https://listentomystream.com:8046/;" type="audio/mpeg"></audio></div>
<div class="section-title" style="margin-top:10px;">🎵 Brano in onda</div>
<div class="cc_recenttracks_list" data-username="bomyydij"></div>

<button class="btn-novita" id="btnNovita" onclick="apriNovita()">▶ ASCOLTA LE NOVITA'</button>
<div id="novitaSection"><div class="section-title">🔥 Novità Musicali</div><div id="novitaContainer"></div><button class="btn-dedica" style="background:#333;color:#fff;margin-top:10px" onclick="chiudiNovita()">✕ Chiudi Novità</button></div>

<div class="dediche-box">
<div class="section-title">💌 Dedica una canzone</div>
<input type="text" id="nome" placeholder="Il tuo nome"><input type="text" id="perChi" placeholder="Per chi è la dedica?"><textarea id="messaggio" placeholder="Scrivi il tuo messaggio..."></textarea><input type="text" id="canzone" placeholder="Canzone richiesta (opzionale)"><br><button class="btn-dedica" onclick="inviaDedica()">📩 INVIA DEDICA</button>
</div>
<div class="footer">© Radio Sistema 3<br><br>La radio delle tue emozioni<br><br>Licenza SIAE n° 202600000389</div>
</div>

<script>
function apriNovita(){
  const r=document.getElementById('radioAudio'); if(r) r.pause();
  document.getElementById('novitaSection').style.display='block';
  document.getElementById('btnNovita').style.display='none';
  document.getElementById('novitaSection').scrollIntoView({behavior:'smooth'});
  renderNovita();
}
function chiudiNovita(){
  document.getElementById('novitaSection').style.display='none';
  document.getElementById('btnNovita').style.display='inline-block';
  const r=document.getElementById('radioAudio'); if(r) r.play().catch(()=>{});
}
function playVideo(el,id){
  const r=document.getElementById('radioAudio'); if(r) r.pause();
  el.innerHTML='<iframe src="https://www.youtube.com/embed/'+id+'?autoplay=1&rel=0&modestbranding=1&playsinline=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>';
}
function renderNovita(){
  const c=document.getElementById('novitaContainer');
  if(c.dataset.done=="1") return;
  c.dataset.done="1";
  c.innerHTML = BRANI_NOVITA.map(b=>`
    <div class="novita-block">
      <div class="novita-header"><img class="novita-mini" src="https://i.ytimg.com/vi/${b.id}/hqdefault.jpg"><div class="novita-tit"><b>${b.artista}</b><span>${b.titolo}</span></div></div>
      <div class="novita-player" onclick="playVideo(this,'${b.id}')"><img class="thumb" src="https://i.ytimg.com/vi/${b.id}/hqdefault.jpg"><div class="play">▶</div></div>
    </div>`).join('');
}
const WHATSAPP_NUMBER = "39XXXXXXXXXX";
function inviaDedica(){
  const nome=document.getElementById('nome').value.trim();
  const perChi=document.getElementById('perChi').value.trim();
  const msg=document.getElementById('messaggio').value.trim();
  const canzone=document.getElementById('canzone').value.trim();
  if(!nome || !perChi || !msg){alert("Compila nome, per chi e messaggio!");return;}
  const testo=`*NUOVA DEDICA - RADIO SISTEMA 3*%0A%0A👤 Da: ${nome}%0A❤️ Per: ${perChi}%0A💬 Messaggio: ${msg}%0A🎵 Canzone: ${canzone || 'a scelta della regia'}`;
  window.location.href=`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(testo)}`;
}
</script>
</body>
</html>
