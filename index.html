<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radio Sistema 3 - con VU Meter</title>
<script src="https://manage.myshoutca.st/system/recenttracks.js"></script>
<script>
const BRANI_NOVITA = [
  { id: "pzvhHsEqMzo", artista: "Marco Mengoni", titolo: "Giornate Perse" },
  { id: "fRIhCiUVaKs", artista: "Karol G", titolo: "Bby Wow" }, 
  { id: "z5qAtdZh5Uo", artista: "Giorgia", titolo: "SIAMO L'ECCEZIONE" },
  { id: "rSiBJ4JRTv4", artista: "Alfa & Gigi D'Alessio", titolo: "Genova E Napoli" },
  { id: "D3zkX-Am4o4", artista: "Madonna", titolo: "Danceteria" },
];
const LOGO_AUTORADIO = "RADIO SISTEMA 3.jpeg";
const PLACEHOLDER_HTML = `<div style="text-align:center"><div style="color:#fff;font-weight:bold">Scegli un brano qui sotto</div><div style="font-size:2rem">👇</div></div>`;
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Segoe UI,Arial,sans-serif;color:white;text-align:center;background:linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.55)),url("studio-radio.jpeg");background-size:cover;background-position:center;background-attachment:fixed;}
.container{max-width:900px;margin:25px auto;padding:30px;background:rgba(255,255,255,.08);backdrop-filter:blur(8px);border-radius:25px;border:1px solid rgba(255,255,255,.15);}
.logo{width:260px;height:260px;object-fit:cover;border-radius:20px;display:block;background:#000;}
.logo-wrap{display:inline-block;padding:5px;border-radius:26px;background:linear-gradient(135deg,#ff512f,#dd2476,#ffd966,#00d4ff,#ff512f);background-size:300% 300%;animation:gradientMove 4s ease infinite;}
@keyframes gradientMove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
h1{margin-top:20px;font-size:3rem;}
.tagline{margin-top:15px;color:#ffe9a8;}
.live{margin-top:25px;color:#ff4444;font-size:1.9rem;font-weight:bold;animation:pulse 1.4s infinite;}
@keyframes pulse{0%{opacity:1}50%{opacity:.4}100%{opacity:1}}
.player-box{margin-top:25px;background:rgba(255,255,255,.10);padding:15px;border-radius:20px;width:420px;max-width:90%;margin:0 auto;}
.section-title{font-size:1.6rem;margin-bottom:12px;color:#ffd966;}
audio{width:100%;max-width:350px;}
.vu-wrap{margin-top:12px;background:rgba(0,0,0,.6);padding:8px 10px;border-radius:12px;border:1px solid rgba(255,255,255,.2);}
#vuCanvas{width:100%;height:48px;display:block;border-radius:6px;background:#111;}
.vu-label{font-size:.75rem;color:#aaa;margin-top:4px;display:flex;justify-content:space-between;}
.btn-popup{background:linear-gradient(135deg,#00d4ff,#0077ff);color:#fff;font-weight:bold;padding:12px 22px;border:none;border-radius:30px;font-size:1.05rem;cursor:pointer;margin-top:15px}
.btn-novita{margin-top:30px;background:#ff0033;color:#fff;font-weight:900;padding:18px 32px;border:none;border-radius:50px;font-size:1.2rem;cursor:pointer;}
#novitaSection{display:none;margin-top:30px;background:rgba(0,0,0,.6);padding:15px;border-radius:20px;border:1px solid rgba(255,255,255,.15);}
#novitaPlayerMain{position:sticky;top:10px;z-index:5;width:65%;max-width:360px;aspect-ratio:16/9;background:linear-gradient(135deg,#1a1a1a,#2a2a2a);border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;margin:0 auto 15px auto;border:2px dashed #555}
#novitaPlayerMain iframe{width:100%;height:100%;border:0;position:absolute;top:0;left:0}
#novitaList{max-height:380px;overflow-y:auto;text-align:left}
.novita-row{display:flex;align-items:center;gap:12px;padding:8px 10px;background:#151515;border-bottom:1px solid #222;cursor:pointer;border-radius:8px;margin-bottom:6px}
.dediche-box{margin-top:30px;background:rgba(255,255,255,.10);padding:20px;border-radius:20px;border:1px solid rgba(255,217,102,.3);}
.dediche-box input, .dediche-box textarea{width:100%;max-width:400px;padding:10px 12px;margin:6px 0;border-radius:10px;border:none;background:rgba(0,0,0,.4);color:white;font-size:1rem;}
.btn-dedica{margin-top:12px;background:linear-gradient(135deg,#ffd966,#ff9f1c);color:#000;font-weight:bold;padding:12px 25px;border:none;border-radius:30px;font-size:1.1rem;cursor:pointer;}
.footer{margin-top:20px;padding-top:20px;border-top:1px solid rgba(255,255,255,.2);}
</style>
</head>
<body>
<div class="container">
<div class="logo-wrap"><img src="RADIO SISTEMA 3.jpeg" alt="Radio Sistema 3" class="logo"></div>
<h1>RADIO SISTEMA 3</h1>
<div class="tagline">🎙️ La musica che accompagna le tue giornate</div>
<div class="live">🔴 ON AIR 24/7</div>

<div class="player-box">
<div class="section-title">🎧 Ascolta in diretta</div>
<audio id="radioAudio" controls preload="none"><source src="https://listentomystream.com:8046/;" type="audio/mpeg"></audio>

<div class="vu-wrap">
<canvas id="vuCanvas" width="800" height="60"></canvas>
<div class="vu-label"><span>🔈 LIVE LEVEL</span><span id="vuPeak" style="color:#ff4444">♪</span></div>
</div>

<button class="btn-popup" onclick="window.open('popup.html','RadioSistema3Popup','width=380,height=450')">🎧 Apri Player in Popup</button>
</div>

<div class="section-title" style="margin-top:15px;">🎵 Brano in onda</div>
<div class="cc_recenttracks_list" data-username="bomyydij"></div>

<button class="btn-novita" id="btnNovita" onclick="apriNovita()">▶ La PLAYLIST di Radio Sistema 3</button>
<div id="novitaSection">
  <div class="section-title">🔥 La Playlist</div>
  <div id="novitaPlayerMain"></div>
  <div id="novitaList"></div>
  <button class="btn-dedica" style="background:#333;color:#fff;margin-top:15px" onclick="chiudiNovita()">✕ Chiudi</button>
</div>

<div class="dediche-box">
<div class="section-title">💌 Dedica un pensiero</div>  
<input type="text" id="nome" placeholder="Il tuo nome">
<input type="text" id="perChi" placeholder="Per chi è la dedica?">
<textarea id="messaggio" placeholder="Scrivi il tuo messaggio..."></textarea>
<br><button class="btn-dedica" onclick="inviaDedica()">📩 INVIA DEDICA</button>
</div>

<div class="footer">© Radio Sistema 3 - Licenza SIAE n° 202600000389</div>
</div>

<script>
function apriNovita(){ const r=document.getElementById('radioAudio'); if(r) r.pause(); document.getElementById('novitaSection').style.display='block'; document.getElementById('btnNovita').style.display='none'; document.getElementById('novitaPlayerMain').innerHTML = PLACEHOLDER_HTML; renderNovita(); }
function chiudiNovita(){ document.getElementById('novitaPlayerMain').innerHTML = PLACEHOLDER_HTML; document.getElementById('novitaSection').style.display='none'; document.getElementById('btnNovita').style.display='inline-block'; const r=document.getElementById('radioAudio'); if(r) r.play().catch(()=>{}); }
function playNovita(id, el){ const r=document.getElementById('radioAudio'); if(r) r.pause(); document.querySelectorAll('.novita-row').forEach(x=>x.classList.remove('active')); el.classList.add('active'); document.getElementById('novitaPlayerMain').innerHTML='<iframe src="https://www.youtube.com/embed/'+id+'?autoplay=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>'; }
function renderNovita(){ const c=document.getElementById('novitaList'); if(c.dataset.done=="1") return; c.dataset.done="1"; c.innerHTML = BRANI_NOVITA.map(b=>`<div class="novita-row" onclick="playNovita('${b.id}', this)"><img src="https://i.ytimg.com/vi/${b.id}/hqdefault.jpg" style="width:60px;height:45px;object-fit:cover;border-radius:5px"><div><b>${b.artista}</b><br><span>${b.titolo}</span></div><div style="margin-left:auto;color:#ff0033">▶</div></div>`).join(''); }
function inviaDedica(){ const nome=document.getElementById('nome').value.trim(); const perChi=document.getElementById('perChi').value.trim(); const msg=document.getElementById('messaggio').value.trim(); if(!nome||!perChi||!msg){alert("Compila tutti i campi!");return;} const testo=`*NUOVA DEDICA*\nDa: ${nome}\nPer: ${perChi}\nMessaggio: ${msg}`; window.open(`https://wa.me/393664780561?text=${encodeURIComponent(testo)}`, '_blank'); }

// VU METER CHE BALLA COME NELLO SCREENSHOT
const vuCanvas = document.getElementById('vuCanvas');
const vuCtx = vuCanvas.getContext('2d');
const radioEl = document.getElementById('radioAudio');
let isPlaying = false;
let bars = 64;
let currentLevels = new Array(bars).fill(5);
let targetLevels = new Array(bars).fill(5);
function drawVu(){ const W=vuCanvas.width,H=vuCanvas.height; vuCtx.clearRect(0,0,W,H); vuCtx.fillStyle='#111'; vuCtx.fillRect(0,0,W,H); let barW=W/bars,gap=barW*0.25,w=barW-gap; for(let i=0;i<bars;i++){ currentLevels[i]+=(targetLevels[i]-currentLevels[i])*0.25; let h=(currentLevels[i]/100)*(H-8); let x=i*barW+gap/2,y=(H-h)/2; let color=i<bars*0.6?'#2eff2e':i<bars*0.82?'#ffe600':'#ff3333'; if(currentLevels[i]<10) color='#222'; vuCtx.fillStyle=color; vuCtx.beginPath(); vuCtx.roundRect(x,y,w,h,3); vuCtx.fill(); } vuCtx.fillStyle='rgba(255,60,60,0.9)'; vuCtx.fillRect(0,H/2-1,W,2); requestAnimationFrame(drawVu); }
function randomizeLevels(){ if(!isPlaying){ targetLevels=targetLevels.map(()=>Math.random()*4+1); return; } for(let i=0;i<bars;i++){ let base=20+Math.sin(Date.now()/180+i*0.3)*15+Math.random()*35; if(i<15) base+=25; if(i>50&&Math.random()>0.7) base+=30; targetLevels[i]=Math.min(100,Math.max(2,base)); } }
radioEl.addEventListener('play', ()=>{ isPlaying=true; document.getElementById('vuPeak').textContent='♫ LIVE'; document.getElementById('vuPeak').style.color='#2eff2e'; });
radioEl.addEventListener('pause', ()=>{ isPlaying=false; document.getElementById('vuPeak').textContent='❚❚ PAUSA'; document.getElementById('vuPeak').style.color='#ff4444'; });
drawVu(); setInterval(randomizeLevels,80);
</script>
</body>
</html>
