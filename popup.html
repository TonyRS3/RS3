<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radio Sistema 3</title>
<script src="https://manage.myshoutca.st/system/recenttracks.js"></script>
<style>
 body{margin:0;background:#0E1C3A;color:white;text-align:center;padding:15px;font-family:Arial}
 .logo{width:120px;height:120px;border-radius:15px}
 audio{width:100%;margin-top:15px}
 .box{background:rgba(255,255,255,.1);padding:12px;border-radius:12px;margin-top:12px;min-height:40px}
 .cc_recenttracks_list img, .cc_recenttracks_list .cccover{display:none !important}
 .cc_recenttracks_list *{color:white !important}
 .cc_recenttracks_list .ccbuy{display:none !important}
 #branoFallback{color:white;margin-top:5px}
</style>
</head>
<body>
<h2 style="margin:5px 0">RADIO SISTEMA 3</h2>
<div style="color:#ff4444;font-weight:bold">🔴 ON AIR 24/7</div>
<img src="RADIO SISTEMA 3.jpeg" class="logo" style="margin-top:10px">
<audio controls autoplay><source src="https://listentomystream.com:8046/;" type="audio/mpeg"></audio>

<div class="box">
 <div style="color:#ffd966;font-weight:bold">🎵 Brano in onda</div>
 <div class="cc_recenttracks_list" data-username="bomyydij"></div>
 <div id="branoFallback"></div>
</div>

<script>
// Se dopo 3 secondi il sistema vecchio non ha caricato nulla (succede su telefono), usa il piano B
setTimeout(function(){
  var lista = document.querySelector('.cc_recenttracks_list');
  if(!lista || lista.innerHTML.trim() === ""){
    fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent('https://listentomystream.com:8046/currentsong?sid=1'))
    .then(r=>r.text())
    .then(t=>{
      if(t) document.getElementById('branoFallback').innerHTML = t;
      else document.getElementById('branoFallback').innerHTML = "Radio Sistema 3 - Live";
    })
    .catch(()=>{ document.getElementById('branoFallback').innerHTML = "ON AIR - Radio Sistema 3"; });
  }
}, 3000);
</script>
</body>
</html>
