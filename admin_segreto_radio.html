<!DOCTYPE html>
<html lang="it"><head><meta charset="UTF-8"><title>Admin Segreto</title>
<style>body{background:#000;color:#fff;font-family:Arial;padding:20px}.box{max-width:700px;margin:auto;background:#1a1a1a;padding:20px;border-radius:15px}
input{width:100%;padding:10px;margin:6px 0;border-radius:8px;background:#000;color:#fff;border:1px solid #444;box-sizing:border-box}
img.preview{width:200px;height:200px;object-fit:cover;border-radius:10px;border:2px solid #ffd966;display:block;margin:10px auto}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px}
.card{background:#222;border-radius:10px;overflow:hidden}.card img{width:100%;height:120px;object-fit:cover;display:block}
pre{background:#000;color:#0f0;padding:12px;border-radius:8px;white-space:pre-wrap;font-size:11px}
</style></head><body>
<div class="box">
<h2 style="color:#ffd966;text-align:center">Admin Cover - VEDI SEMPRE LA COVER</h2>
<input type="file" id="f" accept="image/*">
<img id="ante" class="preview" style="display:none">
<input id="titolo" placeholder="Titolo">
<input id="autore" placeholder="Autore">
<button onclick="add()" style="width:100%;padding:12px;background:#ffd966;border:none;border-radius:25px;font-weight:bold;cursor:pointer">AGGIUNGI</button>
<div id="g" class="grid"></div>
<pre id="out">Qui il codice...</pre>
</div>
<script>
let list=[];
document.getElementById('f').addEventListener('change', e=>{
  const file=e.target.files[0];
  if(!file)return;
  const url=URL.createObjectURL(file);
  const img=document.getElementById('ante');
  img.src=url;
  img.style.display='block';
});
function add(){
  const file=document.getElementById('f').files[0];
  const tit=document.getElementById('titolo').value.trim();
  const aut=document.getElementById('autore').value.trim();
  if(!file||!tit||!aut){alert('file+titolo+autore');return}
  const url=URL.createObjectURL(file);
  list.unshift({url,tit,aut});
  render();
}
function render(){
  let h='',c='';
  list.forEach(i=>{
    h+=`<div class="card"><img src="${i.url}"><div style="padding:6px"><b>${i.tit}</b><br><small>${i.aut}</small></div></div>`;
    const q=encodeURIComponent('"'+i.aut+'" "'+i.tit+'"');
    c+=`<a class="card" href="https://www.top-charts.com/search?q=${q}" target="_blank">\n  <img src="cover/${i.tit.replace(/ /g,'_')}.jpg">\n  <div class="info"><span class="titolo">${i.tit}</span><span class="autore">${i.aut}</span></div>\n</a>\n\n`;
  });
  document.getElementById('g').innerHTML=h;
  document.getElementById('out').textContent=c;
}
</script>
</body></html>
